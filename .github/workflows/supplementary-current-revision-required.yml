                and .base_sha == $base
                and .head_sha == $head
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and .workflow_sha == $base
                and (.merge_base_sha | test("^[0-9a-f]{40}$"))
                and (.integration_tree_sha | test("^[0-9a-f]{40}$"))
                and (.diff_sha256 | test("^[0-9a-f]{64}$"))
                and (.input_sha256 | test("^[0-9a-f]{64}$"))
              ' <<<"${summary}" >/dev/null
          else
            if [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|managed-sync|ancestry-backmerge):v6:${PR_NUMBER}:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]; then
              producer_kind="${BASH_REMATCH[1]}"
              producer_run_id="${BASH_REMATCH[2]}"
            else
              # Keep v5 valid only for already-open pull requests during the
              # atomic producer/verifier rollout. Exact-one inventory above
              # prevents v5 and v6 from satisfying the gate together.
              [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|ancestry-backmerge):v5:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]
              producer_kind="${BASH_REMATCH[1]}"
              producer_run_id="${BASH_REMATCH[2]}"
            fi
            if { [ "${author}" = 'lightning-it-release-automation[bot]' ] \
                || [ "${central_sync_backmerge}" = true ]; }; then
              test "${producer_kind}" = ancestry-backmerge
              test "${base_ref}" = develop
              [[ "${head_ref}" == backmerge/*-main ]]
              [[ "${pr_title}" == \
                "chore(governance): record main ancestry before "* ]]
              expected_review_path="deterministic evidence-bound ancestry exemption"
            elif [ "${author}" = 'lightning-it-shared-assets-sync[bot]' ]; then
              test "${REPOSITORY}" != 'lightning-it/.github'
              test "${producer_kind}" = managed-sync
              test "${base_ref}" = develop
              expected_review_path="deterministic provenance-bound managed distribution exemption"
            else
              test "${producer_kind}" = copilot
              expected_review_path="applicable Copilot or governed automation exemption"
            fi
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
            producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            controller_sha="$(jq -er '.controller_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              <<<"${summary}")"
            # pull_request_target always runs the protected default-branch
            # controller. PR base_ref remains independently valid as main or
            # develop and is already bound to EVENT_BASE above.
            controller_branch="$(jq -er \
              '.default_branch | select(type == "string" and length > 0)' \
              <<<"${target_repository}")"
            controller_branch_uri="$(jq -rn \
              --arg value "${controller_branch}" '$value | @uri')"
            test -n "${controller_branch_uri}"
            controller_head="$(gh api \
              "repos/${REPOSITORY}/branches/${controller_branch_uri}" --jq .commit.sha)"
            [[ "${controller_head}" =~ ^[0-9a-f]{40}$ ]]
            controller_ancestry="$(gh api \
              "repos/${REPOSITORY}/compare/${controller_sha}...${controller_head}")"
            jq -e \
              --arg controller "${controller_sha}" '
                .status == "identical"
                or (.status == "ahead" and .behind_by == 0
                    and .merge_base_commit.sha == $controller)
              ' <<<"${controller_ancestry}" >/dev/null
            producer_run_attempt="$(jq -er \
              '.run_attempt | select(type == "number" and (. == 1 or . == 2))' \
              <<<"${producer}")"
            if [ "${producer_run_attempt}" -eq 1 ]; then
              jq -e \
                --arg actor "${author}" \
                --arg head_ref "${head_ref}" \
                --arg head_sha "${EVENT_HEAD}" '
                  .event == "pull_request_target"
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "success"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_branch == $head_ref
                  and .head_sha == $head_sha
                  and .actor.login == $actor
                  and .triggering_actor.login == $actor
                ' <<<"${producer}" >/dev/null
            else
              # A late Copilot review may authorize exactly one verifier-only
              # rerun. The protected review-event controller must publish the
              # unique authorization before it requests that rerun. This keeps
              # arbitrary UI/API reruns and candidate workflows from becoming
              # a permanent producer.
              test "${producer_kind}" = copilot
              authorization_pages="$(gh api --paginate --slurp \
                "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Late%20review%20rerun%20authorization&filter=all&per_page=100")"
              authorizations="$(jq -c \
                --arg base "${EVENT_BASE}" \
                --arg head "${EVENT_HEAD}" \
                --arg pr "${PR_NUMBER}" \
                --arg producer "${producer_run_id}" '
                  [.[].check_runs[]? |
                    select(.name == "Late review rerun authorization") |
                    select(.app.id == 15368 and .app.slug == "github-actions") |
                    select(.head_sha == $head) |
                    select((.external_id | type) == "string") |
                    select(.external_id |
                      test("^rep60-late-review-rerun:v1:[1-9][0-9]*:"
                        + $pr + ":" + $producer + ":" + $base + ":"
                        + $head + ":[1-9][0-9]*$"))]
                ' <<<"${authorization_pages}")"
              test "$(jq 'length' <<<"${authorizations}")" -eq 1
              authorization="$(jq -c '.[0]' <<<"${authorizations}")"
              jq -e '
                .status == "completed"
                and .conclusion == "success"
                and (.output.summary | type) == "string"
              ' <<<"${authorization}" >/dev/null
              authorization_external_id="$(jq -er '.external_id' \
                <<<"${authorization}")"
              [[ "${authorization_external_id}" =~ ^rep60-late-review-rerun:v1:([1-9][0-9]*):${PR_NUMBER}:${producer_run_id}:${EVENT_BASE}:${EVENT_HEAD}:([1-9][0-9]*)$ ]]
              refresh_run_id="${BASH_REMATCH[1]}"
              review_id="${BASH_REMATCH[2]}"
              refresh_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${refresh_run_id}"
              test "$(jq -r '.details_url // empty' <<<"${authorization}")" = \
                "${refresh_run_url}"
              authorization_summary="$(jq -er \
                '.output.summary | fromjson | select(type == "object")' \
                <<<"${authorization}")"
              jq -e \
                --arg base "${EVENT_BASE}" \
                --arg controller "${controller_sha}" \
                --arg head "${EVENT_HEAD}" \
                --arg refresh_url "${refresh_run_url}" \
                --argjson pr_number "${PR_NUMBER}" \
                --argjson producer_id "${producer_run_id}" \
                --argjson refresh_id "${refresh_run_id}" \
                --argjson review_id "${review_id}" '
                  (keys | sort) == ([
                    "base_sha", "controller_sha", "head_sha",
                    "producer_run_id", "pull_request_number",
                    "refresh_run_id", "refresh_run_url", "review_id",
                    "review_submitted_at", "schema"
                  ] | sort)
                  and .schema == "rep60-late-review-rerun/v1"
                  and .base_sha == $base
                  and .controller_sha == $controller
                  and .head_sha == $head
                  and .producer_run_id == $producer_id
                  and .pull_request_number == $pr_number
                  and .refresh_run_id == $refresh_id
                  and .refresh_run_url == $refresh_url
                  and .review_id == $review_id
                  and (.review_submitted_at | type) == "string"
                ' <<<"${authorization_summary}" >/dev/null

              refresh_run="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${refresh_run_id}")"
              jq -e \
                --arg api_url "${GITHUB_API_URL}" \
                --arg base_ref "${base_ref}" \
                --arg base_sha "${EVENT_BASE}" \
                --arg head_ref "${head_ref}" \
                --arg head_sha "${EVENT_HEAD}" \
                --arg repository "${REPOSITORY}" \
                --arg run_url "${refresh_run_url}" \
                --argjson pr_number "${PR_NUMBER}" '
                  .event == "pull_request_review"
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "success"
                  and .path == ".github/workflows/copilot-review-refresh.yml"
                  and .name == "Refresh Copilot review gate"
                  and .head_branch == $head_ref
                  and .head_sha == $head_sha
                  and .html_url == $run_url
                  and .actor.login == "Copilot"
                  and .triggering_actor.login == "Copilot"
                  and (.pull_requests | length) == 1
                  and .pull_requests[0].number == $pr_number
                  and .pull_requests[0].base.ref == $base_ref
                  and .pull_requests[0].base.sha == $base_sha
                  and .pull_requests[0].base.repo.url
                    == ($api_url + "/repos/" + $repository)
                  and .pull_requests[0].head.ref == $head_ref
                  and .pull_requests[0].head.sha == $head_sha
                  and .pull_requests[0].head.repo.url
                    == ($api_url + "/repos/" + $repository)
                ' <<<"${refresh_run}" >/dev/null

              review="$(gh api \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${review_id}")"
              jq -e \
                --arg head "${EVENT_HEAD}" \
                --arg submitted "$(jq -r .review_submitted_at \
                  <<<"${authorization_summary}")" \
                --argjson review_id "${review_id}" '
                  .id == $review_id
                  and .user.login == "copilot-pull-request-reviewer[bot]"
                  and .user.type == "Bot"
                  and .commit_id == $head
                  and (.state == "COMMENTED" or .state == "APPROVED")
                  and .submitted_at == $submitted
                  and ((.body // "") | ascii_downcase |
                    (contains("unable to review this pull request") | not)
                    and (contains("premium request quota") | not)
                    and (contains("premium requests quota") | not)
                    and (contains("encountered an error") | not))
                ' <<<"${review}" >/dev/null

              attempt_one="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${producer_run_id}/attempts/1")"
              jq -e \
                --arg actor "${author}" \
                --arg head_ref "${head_ref}" \
                --arg head_sha "${EVENT_HEAD}" '
                  .event == "pull_request_target"
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_branch == $head_ref
                  and .head_sha == $head_sha
                  and .actor.login == $actor
                  and .triggering_actor.login == $actor
                ' <<<"${attempt_one}" >/dev/null
              attempt_one_jobs="$(gh api --paginate --slurp \
                "repos/${REPOSITORY}/actions/runs/${producer_run_id}/attempts/1/jobs?filter=all&per_page=100")"
              jq -e '
                [.[].jobs[]? |
                  select(.name == "Request Copilot review for current revision") |
                  select(.run_attempt == 1 and .status == "completed"
                    and .conclusion == "success")] | length == 1
              ' <<<"${attempt_one_jobs}" >/dev/null
              first_verifier_completed_at="$(jq -er '
                [.[].jobs[]? |
                  select(.name == "Verify current revision policy") |
                  select(.run_attempt == 1 and .status == "completed"
                    and .conclusion == "failure") |
                  .completed_at] | select(length == 1) | .[0]
                ' <<<"${attempt_one_jobs}")"
              review_submitted_at="$(jq -r .submitted_at <<<"${review}")"
              test "$(date -u -d "${review_submitted_at}" +%s)" -gt \
                "$(date -u -d "${first_verifier_completed_at}" +%s)"

              timeline="$(gh api --paginate --slurp \
                -H 'Accept: application/vnd.github+json' \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline?per_page=100")"
              jq -e --arg actor "${author}" '
                [add[]? |
                  select(.event == "review_requested") |
                  select(.actor.login == $actor) |
                  select(.requested_reviewer.login == "Copilot")]
                | length == 1
              ' <<<"${timeline}" >/dev/null
              jq -e \
                --arg actor "${author}" \
                --arg head_ref "${head_ref}" \
                --arg head_sha "${EVENT_HEAD}" \
                --arg refresh_actor "github-actions[bot]" '
                  .event == "pull_request_target"
                  and .run_attempt == 2
                  and .status == "completed"
                  and .conclusion == "success"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_branch == $head_ref
                  and .head_sha == $head_sha
                  and .actor.login == $actor
                  and .triggering_actor.login == $refresh_actor
                ' <<<"${producer}" >/dev/null
            fi
            jq -e \
              --arg run_url "${producer_run_url}" '
                .html_url == $run_url
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg controller "${controller_sha}" \
              --arg head "${EVENT_HEAD}" \
              --arg review_path "${expected_review_path}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .controller_sha == $controller
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and .review_path == $review_path
              ' <<<"${summary}" >/dev/null
          fi

          fi

          failure_stage='permanent-finalization'
          gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Protected current-revision evidence verified' \
            -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; producer ${producer_run_url}." >/dev/null
          trap - ERR
