              refresh_run_id="${BASH_REMATCH[1]}"
              review_id="${BASH_REMATCH[2]}"
              refresh_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${refresh_run_id}"
              test "$(jq -r '.details_url // empty' <<<"${authorization}")" = \
                "${refresh_run_url}"
              authorization_summary="$(jq -er \
                '.output.summary | fromjson | select(type == "object")' \
                <<<"${authorization}")"
              jq -e \
                --arg base "${EVENT_BASE}" \
                --arg controller "${controller_sha}" \
                --arg head "${EVENT_HEAD}" \
                --arg refresh_url "${refresh_run_url}" \
                --argjson pr_number "${PR_NUMBER}" \
                --argjson producer_id "${producer_run_id}" \
                --argjson refresh_id "${refresh_run_id}" \
                --argjson review_id "${review_id}" '
                  (keys | sort) == ([
                    "base_sha", "controller_sha", "head_sha",
                    "producer_run_id", "pull_request_number",
                    "refresh_run_id", "refresh_run_url", "review_id",
                    "review_submitted_at", "schema"
                  ] | sort)
                  and .schema == "rep60-late-review-rerun/v1"
                  and .base_sha == $base
                  and .controller_sha == $controller
                  and .head_sha == $head
                  and .producer_run_id == $producer_id
                  and .pull_request_number == $pr_number
                  and .refresh_run_id == $refresh_id
                  and .refresh_run_url == $refresh_url
                  and .review_id == $review_id
                  and (.review_submitted_at | type) == "string"
                ' <<<"${authorization_summary}" >/dev/null

              refresh_run="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${refresh_run_id}")"
              jq -e \
                --arg api_url "${GITHUB_API_URL}" \
                --arg base_ref "${base_ref}" \
                --arg base_sha "${EVENT_BASE}" \
                --arg head_ref "${head_ref}" \
                --arg head_sha "${EVENT_HEAD}" \
                --arg repository "${REPOSITORY}" \
                --arg run_url "${refresh_run_url}" \
                --argjson pr_number "${PR_NUMBER}" '
                  .event == "pull_request_review"
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "success"
                  and .path == ".github/workflows/copilot-review-refresh.yml"
                  and .name == "Refresh Copilot review gate"
                  and .head_branch == $head_ref
                  and .head_sha == $head_sha
                  and .html_url == $run_url
                  and .actor.login == "Copilot"
                  and .triggering_actor.login == "Copilot"
                  and (.pull_requests | length) == 1
                  and .pull_requests[0].number == $pr_number
                  and .pull_requests[0].base.ref == $base_ref
                  and .pull_requests[0].base.sha == $base_sha
                  and .pull_requests[0].base.repo.url
                    == ($api_url + "/repos/" + $repository)
                  and .pull_requests[0].head.ref == $head_ref
                  and .pull_requests[0].head.sha == $head_sha
                  and .pull_requests[0].head.repo.url
                    == ($api_url + "/repos/" + $repository)
                ' <<<"${refresh_run}" >/dev/null

              review="$(gh api \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${review_id}")"
              jq -e \
                --arg head "${EVENT_HEAD}" \
                --arg submitted "$(jq -r .review_submitted_at \
                  <<<"${authorization_summary}")" \
                --argjson review_id "${review_id}" '
                  .id == $review_id
                  and .user.login == "copilot-pull-request-reviewer[bot]"
                  and .user.type == "Bot"
                  and .commit_id == $head
                  and (.state == "COMMENTED" or .state == "APPROVED")
                  and .submitted_at == $submitted
                  and ((.body // "") | ascii_downcase |
                    (contains("unable to review this pull request") | not)
                    and (contains("premium request quota") | not)
                    and (contains("premium requests quota") | not)
                    and (contains("encountered an error") | not))
                ' <<<"${review}" >/dev/null

              attempt_one="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${producer_run_id}/attempts/1")"
              jq -e \
                --arg actor "${author}" \
                --arg head_ref "${head_ref}" \
                --arg head_sha "${EVENT_HEAD}" '
                  .event == "pull_request_target"
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_branch == $head_ref
                  and .head_sha == $head_sha
                  and .actor.login == $actor
                  and .triggering_actor.login == $actor
                ' <<<"${attempt_one}" >/dev/null
              attempt_one_jobs="$(gh api --paginate --slurp \
                "repos/${REPOSITORY}/actions/runs/${producer_run_id}/attempts/1/jobs?filter=all&per_page=100")"
              jq -e '
                [.[].jobs[]? |
                  select(.name == "Request Copilot review for current revision") |
                  select(.run_attempt == 1 and .status == "completed"
                    and .conclusion == "success")] | length == 1
              ' <<<"${attempt_one_jobs}" >/dev/null
              first_verifier_completed_at="$(jq -er '
                [.[].jobs[]? |
                  select(.name == "Verify current revision policy") |
                  select(.run_attempt == 1 and .status == "completed"
                    and .conclusion == "failure") |
                  .completed_at] | select(length == 1) | .[0]
                ' <<<"${attempt_one_jobs}")"
              review_submitted_at="$(jq -r .submitted_at <<<"${review}")"
              test "$(date -u -d "${review_submitted_at}" +%s)" -gt \
                "$(date -u -d "${first_verifier_completed_at}" +%s)"

              tl="$(gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline?per_page=100")"
              jq -e --arg actor "${author}" \
                --arg start "$(jq -er '.created_at | strings' <<<"${producer}")" \
                --arg end "${review_submitted_at}" \
                '[add[]? | select(.event=="review_requested" and .actor.login == $actor and .requested_reviewer.login=="Copilot" and .created_at>=$start and .created_at<=$end)] | length == 1' \
                <<<"${tl}" >/dev/null
              jq -e \
                --arg actor "${author}" \
                --arg head_ref "${head_ref}" \
                --arg head_sha "${EVENT_HEAD}" \
                --arg refresh_actor "github-actions[bot]" '
                  .event == "pull_request_target"
                  and .run_attempt == 2
                  and .status == "completed"
                  and .conclusion == "success"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_branch == $head_ref
                  and .head_sha == $head_sha
                  and .actor.login == $actor
                  and .triggering_actor.login == $refresh_actor
                ' <<<"${producer}" >/dev/null
            fi
            jq -e \
              --arg run_url "${producer_run_url}" '
                .html_url == $run_url
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg controller "${controller_sha}" \
              --arg head "${EVENT_HEAD}" \
              --arg review_path "${expected_review_path}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .controller_sha == $controller
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and .review_path == $review_path
              ' <<<"${summary}" >/dev/null
          fi

          fi

          [[ "${producer_kind}" =~ ^(copilot|release-app|managed-sync|ancestry-backmerge|renovate)$ ]]
          {
            echo 'finalize=true'
            echo "producer_kind=${producer_kind}"
            echo "producer_run_url=${producer_run_url}"
            echo "reservation_id=${reservation_id}"
          } >>"${GITHUB_OUTPUT}"
          trap - ERR

      - name: Rebind and finalize the protected result
        if: steps.protected-verifier.outputs.finalize == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_KIND: ${{ steps.protected-verifier.outputs.producer_kind }}
          PRODUCER_RUN_URL: >-
            ${{ steps.protected-verifier.outputs.producer_run_url }}
          RENOVATE_LABELS_SHA256: >-
            ${{ steps.renovate-producer.outputs.labels_sha256 }}
          RENOVATE_LAST_EDITED_AT: >-
            ${{ steps.renovate-producer.outputs.last_edited_at }}
          RESERVATION_ID: ${{ steps.protected-verifier.outputs.reservation_id }}
        run: |
          set -euo pipefail
          failure_stage='permanent-finalization'
          [[ "${RESERVATION_ID}" =~ ^[1-9][0-9]*$ ]]
          finalize_failure() {
            local exit_code="$?"
            trap - ERR
            set +e
            gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${RESERVATION_ID}" \
              -f status=completed \
              -f conclusion=failure \
              -f 'output[title]=Protected current-revision evidence is absent or invalid' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}; stage ${failure_stage}; fail-closed." \
              >/dev/null
            exit "${exit_code}"
          }
          trap finalize_failure ERR

          final_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .draft == false
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and .head.sha == $head
              and (.head.repo.full_name | type == "string" and length > 0)
            ' <<<"${final_pr}" >/dev/null

          if [ "${PRODUCER_KIND}" = renovate ]; then
            failure_stage='renovate-final-rebind'
            jq -e \
              --arg repository "${REPOSITORY}" '
                .user.login == "renovate[bot]"
                and .user.type == "Bot"
                and .base.ref == "develop"
                and .base.repo.full_name == $repository
                and (.head.ref | startswith("renovate/"))
                and .head.repo.full_name == $repository
                and (.labels | type) == "array"
                and all(.labels[];
                  type == "object" and (.name | type) == "string")
                and ([.labels[].name] | index("renovate") != null)
                and ([.labels[].name] | index("dependencies") != null)
                and ([.labels[].name] | index("safe-automerge") != null)
                and ([.labels[].name] | index("breaking-update") == null)
              ' <<<"${final_pr}" >/dev/null
            test "$(jq -r '.last_edited_at // "null"' \
              <<<"${final_pr}")" = "${RENOVATE_LAST_EDITED_AT}"
            final_labels="$(jq -cer \
              'if (.labels | type) == "array"
               and all(.labels[];
                 type == "object" and (.name | type) == "string")
               then [.labels[].name] | sort
               else error("malformed pull-request labels") end' \
              <<<"${final_pr}")"
            test "$(printf '%s' "${final_labels}" \
              | sha256sum | cut -d ' ' -f 1)" = \
              "${RENOVATE_LABELS_SHA256}"
          fi

          failure_stage='permanent-finalization'
          finalized="$(gh api --method PATCH \
            "repos/${REPOSITORY}/check-runs/${RESERVATION_ID}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Protected current-revision evidence verified' \
            -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; producer ${PRODUCER_RUN_URL}.")"
          jq -e \
            --arg external_id \
              "rep60-required-workflow:v3:${GITHUB_RUN_ID}:${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}" \
            --arg head "${EVENT_HEAD}" \
            --argjson check_id "${RESERVATION_ID}" '
              .id == $check_id
              and .head_sha == $head
              and .status == "completed"
              and .conclusion == "success"
              and .external_id == $external_id
              and .app.id == 15368
              and .app.slug == "github-actions"
            ' <<<"${finalized}" >/dev/null
          trap - ERR
