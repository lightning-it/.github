# Organization-owned REP-60 trust root for managed Lightning IT repositories.
# Organization rulesets bind this stable legacy source path and protected main
# ref. The path keeps its historical name so the existing Supplementary gate is
# never interrupted during the organization-wide rollout. Ruleset workflow
# Required Workflows ignore source event filters, while this repository also
# executes the protected file directly. The explicit lifecycle list keeps that
# self-hosted verifier current across Draft-to-Ready and base-branch edits.
# yamllint disable rule:truthy rule:line-length
---
name: Protected current-revision evidence verifier

run-name: >-
  Protected current revision PR #${{ github.event.pull_request.number }}
  ${{ github.event.action }} ${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: >-
    protected-current-revision-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  authorize-supplementary-catchup-v5-successor:
    name: Authorize exact Supplementary catch-up v5 successor
    if: >-
      github.repository == 'lightning-it/ansible-collection-supplementary'
      && github.event.action == 'opened'
      && github.event.pull_request.draft == false
      && github.event.pull_request.user.login
        == 'lightning-it-release-automation[bot]'
      && github.event.pull_request.user.id == 307565056
      && github.event.pull_request.user.type == 'Bot'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.base.sha
        == '626f249d5e05a9bdca93f183029f031f6979061b'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.sha
        == '5dcbc1ee4d08797c84ffe47282ff7502428553d9'
      && github.event.pull_request.title
        == 'chore(rep60): promote protected Supplementary protected-checkpoint-1-v5-successor'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: normal-release-promotion-approval

    steps:
      - name: Mint protected Shared-Assets source-read token
        id: source-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: lightning-it
          repositories: shared-assets-lit
          permission-actions: read
          permission-contents: read

      - name: Verify the one protected checkpoint authorization
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_GH_TOKEN: ${{ steps.source-app.outputs.token }}
        run: |
          set -euo pipefail
          expected_base='626f249d5e05a9bdca93f183029f031f6979061b'
          expected_head='5dcbc1ee4d08797c84ffe47282ff7502428553d9'
          expected_source='43578ba3a09f1da6b6654ba9ba564a56f9ab5996'
          expected_source_parent='34503f45f037d8e06edd662ddacd70e95639f813'
          expected_source_tree='e9f6adc1d4114b2102e743809e7409819160c564'
          expected_historical_test_blob='33e063b24ea6e15642b1ea0b1182d11e40bd41f3'
          expected_develop='6ed1845f1a5f1eab5a49c0efebb02a5c7bb6b100'
          expected_anchor_base='cf4fab537760231b897f67074b87053b0bc8442a'
          expected_anchor_head='cdf6673eb2ade10fafd06c09aba2d02268833155'
          expected_patch_bytes=199991
          expected_patch_sha='f3144c8266e245357aafd340a60485025708aea52657133b06be7657822cb7e4'
          expected_source_workflow_blob='aee7f71950743ce5037546e399b2ed376cee4d8e'
          expected_title='chore(rep60): promote protected Supplementary protected-checkpoint-1-v5-successor'
          expected_subject='chore(rep60): promote protected Supplementary protected-checkpoint-1-v5-successor'

          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${EVENT_BASE}" = "${expected_base}"
          test "${EVENT_HEAD}" = "${expected_head}"
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          test -n "${SOURCE_GH_TOKEN}"

          live_main="$(gh api "repos/${REPOSITORY}/branches/main")"
          live_develop="$(gh api "repos/${REPOSITORY}/branches/develop")"
          jq -e --arg sha "${expected_base}" '
            .name == "main" and .protected == true and .commit.sha == $sha
          ' <<<"${live_main}" >/dev/null
          jq -e --arg sha "${expected_develop}" '
            .name == "develop" and .protected == true and .commit.sha == $sha
          ' <<<"${live_develop}" >/dev/null

          pull="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          head_ref="$(jq -er '.head.ref | select(type == "string")' <<<"${pull}")"
          branch_prefix='release/rep60-supplementary-protected-checkpoint-1-v5-successor-43578ba3a09f-'
          [[ "${head_ref}" =~ ^${branch_prefix}([1-9][0-9]*)$ ]]
          source_run_id="${BASH_REMATCH[1]}"
          marker="<!-- rep60-bounded-supplementary-main-catchup/v1 target=${REPOSITORY} stage=protected-checkpoint-1-v5-successor base=${expected_base} source=${expected_source} develop=${expected_develop} -->"
          dispatch_marker="<!-- rep60-bounded-supplementary-catchup-dispatch-bound:${expected_base}:${expected_head}:${source_run_id} -->"
          expected_body="${marker}"$'\n'"${dispatch_marker}"$'\n\n'
          expected_body+="Protected-history checkpoint ${expected_source} from live develop ${expected_develop}. "
          expected_body+="Patch SHA-256: ${expected_patch_sha}; bytes: ${expected_patch_bytes}. "
          expected_body+='This is a normal Release-App PR and grants no review or merge exception.'
          jq -e \
            --arg base "${expected_base}" \
            --arg body "${expected_body}" \
            --arg branch "${head_ref}" \
            --arg head "${expected_head}" \
            --arg repository "${REPOSITORY}" \
            --arg title "${expected_title}" \
            --argjson number "${PR_NUMBER}" '
              .number == $number
              and .state == "open"
              and .draft == false
              and .user.login == "lightning-it-release-automation[bot]"
              and .user.id == 307565056
              and .user.type == "Bot"
              and .base.repo.full_name == $repository
              and .base.ref == "main"
              and .base.sha == $base
              and .head.repo.full_name == $repository
              and .head.ref == $branch
              and .head.sha == $head
              and .title == $title
              and .body == $body
              and .last_edited_at == null
              and (.labels | length) == 0
            ' <<<"${pull}" >/dev/null

          target_commit="$(gh api "repos/${REPOSITORY}/commits/${expected_head}")"
          jq -e \
            --arg base "${expected_base}" \
            --arg head "${expected_head}" \
            --arg source "${expected_source}" '
              .sha == $head
              and [.parents[].sha] == [$base, $source]
              and .author.login == "lightning-it-shared-assets-sync[bot]"
              and .author.id == 307342877
              and .author.type == "Bot"
              and .committer.login == "lightning-it-shared-assets-sync[bot]"
              and .committer.id == 307342877
              and .committer.type == "Bot"
            ' <<<"${target_commit}" >/dev/null
          source_commit="$(gh api "repos/${REPOSITORY}/commits/${expected_source}")"
          jq -e \
            --arg parent "${expected_source_parent}" \
            --arg source "${expected_source}" '
              .sha == $source and [.parents[].sha] == [$parent]
            ' <<<"${source_commit}" >/dev/null
          anchor_commit="$(gh api "repos/${REPOSITORY}/commits/${expected_develop}")"
          jq -e \
            --arg base "${expected_anchor_base}" \
            --arg head "${expected_anchor_head}" \
            --arg sha "${expected_develop}" '
              .sha == $sha
              and .commit.verification.verified == true
              and [.parents[].sha] == [$base, $head]
            ' <<<"${anchor_commit}" >/dev/null

          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git init --quiet target
          git -C target remote add origin "${GITHUB_SERVER_URL}/${REPOSITORY}.git"
          git -C target -c \
            "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --quiet --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/develop:refs/remotes/origin/develop" \
            "refs/heads/${head_ref}:refs/remotes/origin/candidate"
          test "$(git -C target rev-parse refs/remotes/origin/main)" = "${expected_base}"
          test "$(git -C target rev-parse refs/remotes/origin/develop)" = "${expected_develop}"
          test "$(git -C target rev-parse refs/remotes/origin/candidate)" = "${expected_head}"
          test "$(git -C target show -s --format=%P "${expected_head}")" = \
            "${expected_base} ${expected_source}"
          test "$(git -C target rev-parse "${expected_head}^{tree}")" = \
            "${expected_source_tree}"
          test "$(git -C target rev-parse "${expected_source}^{tree}")" = \
            "${expected_source_tree}"
          test "$(git -C target ls-tree "${expected_source}" \
            tests/unit/test_bounded_promotion_transition.py | awk '{print $3}')" = \
            "${expected_historical_test_blob}"
          test "$(git -C target ls-tree "${expected_head}" \
            tests/unit/test_bounded_promotion_transition.py | awk '{print $3}')" = \
            "${expected_historical_test_blob}"
          test -z "$(git -C target ls-tree "${expected_develop}" \
            tests/unit/test_bounded_promotion_transition.py)"
          test "$(git -C target show -s --format='%an <%ae>' "${expected_head}")" = \
            'lightning-it-shared-assets-sync[bot] <307342877+lightning-it-shared-assets-sync[bot]@users.noreply.github.com>'
          test "$(git -C target show -s --format='%cn <%ce>' "${expected_head}")" = \
            'lightning-it-shared-assets-sync[bot] <307342877+lightning-it-shared-assets-sync[bot]@users.noreply.github.com>'
          test "$(git -C target show -s --format=%B "${expected_head}")" = \
            "${expected_subject}"
          git -C target merge-base --is-ancestor "${expected_source}" "${expected_anchor_head}"
          git -C target merge-base --is-ancestor "${expected_anchor_head}" "${expected_develop}"
          unexpected_entry="$(
            git -C target ls-tree -r "${expected_head}" |
              awk '$1 !~ /^100(644|755)$/ || $2 != "blob" { print; exit }'
          )"
          test -z "${unexpected_entry}"
          patch_bytes="$(git -C target diff --binary --full-index \
            "${expected_base}" "${expected_head}" | wc -c | tr -d ' ')"
          patch_sha="$(git -C target diff --binary --full-index \
            "${expected_base}" "${expected_head}" | sha256sum | awk '{print $1}')"
          test "${patch_bytes}" = "${expected_patch_bytes}"
          test "${patch_sha}" = "${expected_patch_sha}"

          source_run_url="${GITHUB_SERVER_URL}/lightning-it/shared-assets-lit/actions/runs/${source_run_id}"
          source_run=''
          for observation in $(seq 1 60); do
            source_run="$(GH_TOKEN="${SOURCE_GH_TOKEN}" gh api \
              "repos/lightning-it/shared-assets-lit/actions/runs/${source_run_id}")"
            source_status="$(jq -er '.status | select(type == "string")' <<<"${source_run}")"
            if [ "${source_status}" = completed ]; then
              break
            fi
            [[ "${source_status}" =~ ^(queued|in_progress|waiting|pending|requested)$ ]]
            test "${observation}" -lt 60
            sleep 2
          done
          jq -e \
            --arg run_url "${source_run_url}" \
            --argjson run_id "${source_run_id}" '
              .id == $run_id
              and .event == "workflow_dispatch"
              and .run_attempt == 1
              and .head_branch == "main"
              and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
              and .path == ".github/workflows/bounded-supplementary-main-catchup.yml"
              and .display_title
                == "REP-60 bounded Supplementary catch-up protected-checkpoint-1-v5-successor"
              and .status == "completed"
              and .conclusion == "success"
              and .html_url == $run_url
              and .actor.login == "litroc"
              and .triggering_actor.login == "litroc"
              and .repository.full_name == "lightning-it/shared-assets-lit"
              and .head_repository.full_name == "lightning-it/shared-assets-lit"
            ' <<<"${source_run}" >/dev/null
          source_sha="$(jq -er '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            <<<"${source_run}")"
          source_main="$(GH_TOKEN="${SOURCE_GH_TOKEN}" gh api \
            repos/lightning-it/shared-assets-lit/branches/main)"
          jq -e --arg source "${source_sha}" '
            .name == "main" and .protected == true
            and (.commit.sha | type == "string" and test("^[0-9a-f]{40}$"))
          ' <<<"${source_main}" >/dev/null
          live_source_main="$(jq -r .commit.sha <<<"${source_main}")"
          source_compare="$(GH_TOKEN="${SOURCE_GH_TOKEN}" gh api \
            "repos/lightning-it/shared-assets-lit/compare/${source_sha}...${live_source_main}")"
          jq -e --arg source "${source_sha}" --arg current "${live_source_main}" '
            .base_commit.sha == $source
            and .merge_base_commit.sha == $source
            and (
              (.status == "identical" and $current == $source
                and .ahead_by == 0 and .behind_by == 0)
              or
              (.status == "ahead" and $current != $source
                and .ahead_by > 0 and .behind_by == 0
                and .head_commit.sha == $current)
            )
          ' <<<"${source_compare}" >/dev/null
          source_workflow="$(GH_TOKEN="${SOURCE_GH_TOKEN}" gh api \
            "repos/lightning-it/shared-assets-lit/contents/.github/workflows/bounded-supplementary-main-catchup.yml?ref=${source_sha}")"
          jq -e --arg blob "${expected_source_workflow_blob}" '
            .type == "file"
            and .path == ".github/workflows/bounded-supplementary-main-catchup.yml"
            and .encoding == "base64"
            and .sha == $blob
            and (.content | type == "string" and length > 0)
          ' <<<"${source_workflow}" >/dev/null
          source_jobs="$(GH_TOKEN="${SOURCE_GH_TOKEN}" gh api \
            "repos/lightning-it/shared-assets-lit/actions/runs/${source_run_id}/attempts/1/jobs?per_page=100")"
          jq -e --arg source "${source_sha}" '
            (.total_count | type == "number" and . > 0 and . <= 100)
            and (.jobs | length) == .total_count
            and ([.jobs[] |
              select(.name == "Prepare exact protected-history catch-up") |
              select(.head_sha == $source and .run_attempt == 1) |
              select(.status == "completed" and .conclusion == "success") |
              select(([
                .steps[] |
                select(.name == "Verify protected controller identity"
                  or .name == "Consume the immutable one-time stage ledger"
                  or .name == "Resolve exact workflow-source App identity"
                  or .name == "Resolve exact release App identity"
                  or .name == "Create exact Release-App catch-up PR"
                  or .name == "Dispatch the one protected Exact-Revision review"
                  or .name == "Finalize exact dispatch binding") |
                select(.status == "completed" and .conclusion == "success")
              ] | length) == 7)] | length) == 1
          ' <<<"${source_jobs}" >/dev/null
          jq -e \
            --arg created "$(jq -r .created_at <<<"${pull}")" \
            --arg started "$(jq -r .run_started_at <<<"${source_run}")" \
            --arg updated "$(jq -r .updated_at <<<"${source_run}")" '
              ($created | fromdateiso8601) >= ($started | fromdateiso8601)
              and ($created | fromdateiso8601) <= ($updated | fromdateiso8601)
            ' <<<null >/dev/null

          environment="$(gh api \
            "repos/${REPOSITORY}/environments/normal-release-promotion-approval")"
          jq -e '
            .name == "normal-release-promotion-approval"
            and .can_admins_bypass == false
            and ([.protection_rules[]? | select(.type == "wait_timer")] | length == 0)
            and ([.protection_rules[]? | select(.type == "required_reviewers")] | length == 1)
            and ([.protection_rules[]? | select(.type == "required_reviewers")][0].prevent_self_review == true)
            and ([.protection_rules[]? | select(.type == "required_reviewers")][0].reviewers | length == 1)
            and ([.protection_rules[]? | select(.type == "required_reviewers")][0].reviewers[0].type == "BusinessTeam")
            and ([.protection_rules[]? | select(.type == "required_reviewers")][0].reviewers[0].reviewer.id == 15545798)
          ' <<<"${environment}" >/dev/null

  verify-protected-current-revision-evidence:
    # Keep the native Required-Workflow job distinct from the API evidence
    # check it verifies. GitHub Actions check runs share one App identity, so
    # identical names would make the producer target this job instead of its
    # immutable evidence check.
    name: Required current-revision workflow
    # Required Workflows do not reliably receive ready_for_review after their
    # initial Draft event. The exact trust-root bootstrap therefore classifies
    # its immutable candidate while Draft and keeps this same protected run
    # alive until the one local pipeline review is final. Other paths keep the
    # reservation alive while boundedly awaiting protected producer evidence;
    # the historical single verifier-only re-evaluation remains verifiable.
    permissions:
      actions: read
      checks: write
      contents: read
      # The App binding exists only on the Issues REST representation of a PR
      # comment, so keep this endpoint-specific permission explicit and read-only.
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BOOTSTRAP_SOURCE_BLOB_PATHS_JSON: >-
        [".github/codex/prompts/review-exact-head.md",
        ".github/codex/schemas/exact-head-review.schema.json",
        ".github/workflows/copilot-review.yml",
        ".github/workflows/current-revision-rerun.yml",
        ".github/workflows/release-bot-exact-head-review.yml",
        "scripts/materialize-exact-revision-review.py"]
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Mint source-read Release Automation App token
        id: source-app
        if: >-
          (
            github.event.pull_request.user.login
              == 'lightning-it-shared-assets-sync[bot]'
            && github.event.pull_request.base.ref == 'develop'
            && github.event.pull_request.head.repo.full_name == github.repository
            && !(
              github.repository == 'lightning-it/.github'
              && startsWith(github.event.pull_request.head.ref, 'backmerge/')
              && endsWith(github.event.pull_request.head.ref, '-main')
              && startsWith(
                github.event.pull_request.title,
                'chore(governance): record main ancestry before '
              )
            )
          ) || (
            github.event.pull_request.user.login == 'litroc'
            && github.event.pull_request.user.type == 'User'
            && github.event.pull_request.base.ref == 'main'
            && github.event.pull_request.head.repo.full_name == github.repository
            && (
              github.event.pull_request.title
                == 'fix(rep60): bootstrap protected main review trust root'
              || github.event.pull_request.title
                == 'fix(rep60): seed protected main review controller'
            )
          )
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: lightning-it
          repositories: shared-assets-lit
          permission-actions: read
          permission-contents: read

      - name: Mint protected-controller read App token
        id: controller-app
        if: >-
          github.event.pull_request.user.login == 'litroc'
          && github.event.pull_request.user.type == 'User'
          && github.event.pull_request.base.ref == 'main'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (
            github.event.pull_request.title
              == 'fix(rep60): bootstrap protected main review trust root'
            || github.event.pull_request.title
              == 'fix(rep60): seed protected main review controller'
          )
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: lightning-it
          repositories: .github
          permission-contents: read

      - name: Classify protected main trust-root bootstrap handoff
        id: bootstrap-handoff
        if: >-
          github.event.pull_request.user.login == 'litroc'
          && github.event.pull_request.user.type == 'User'
          && github.event.pull_request.base.ref == 'main'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.title
            == 'fix(rep60): bootstrap protected main review trust root'
        env:
          CONTROLLER_GH_TOKEN: ${{ steps.controller-app.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_GH_TOKEN: ${{ steps.source-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${CONTROLLER_GH_TOKEN}"
          test -n "${SOURCE_GH_TOKEN}"
          install -d -m 0700 protected-bootstrap
          verifier_payload="$(GH_TOKEN="${CONTROLLER_GH_TOKEN}" gh api \
            "repos/lightning-it/.github/contents/scripts/verify-main-trust-root-bootstrap.py?ref=${WORKFLOW_SHA}")"
          jq -e \
            --arg path scripts/verify-main-trust-root-bootstrap.py \
            --arg url "${GITHUB_API_URL}/repos/lightning-it/.github/contents/scripts/verify-main-trust-root-bootstrap.py?ref=${WORKFLOW_SHA}" '
              .type == "file"
              and .path == $path
              and .url == $url
              and (.sha | type == "string" and test("^[0-9a-f]{40}$"))
              and .encoding == "base64"
              and ((.size | type) == "number" and .size > 0 and .size < 100000)
              and (.content | type == "string" and length > 0)
            ' <<<"${verifier_payload}" >/dev/null
          jq -er .content <<<"${verifier_payload}" \
            | base64 --decode >protected-bootstrap/verify.py
          test "$(git hash-object protected-bootstrap/verify.py)" = \
            "$(jq -r .sha <<<"${verifier_payload}")"
          chmod 0500 protected-bootstrap/verify.py
          classification="$(python3 protected-bootstrap/verify.py \
            --repository "${REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --expected-base "${EVENT_BASE}" \
            --expected-head "${EVENT_HEAD}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --classify-only)"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" \
            --arg workflow "${WORKFLOW_SHA}" \
            --argjson expected_source_blob_paths \
              "${BOOTSTRAP_SOURCE_BLOB_PATHS_JSON}" \
            --argjson pr_number "${PR_NUMBER}" '
              (keys | sort) == ([
                "base_sha", "candidate_tree_sha", "controller_blob_sha",
                "head_ref", "head_sha", "pull_request_number", "repository",
                "schema", "source_blobs", "source_repository", "source_sha",
                "source_tree_sha", "workflow_sha"
              ] | sort)
              and .schema == "rep60-main-trust-root-handoff/v1"
              and .repository == $repository
              and .pull_request_number == $pr_number
              and .base_sha == $base
              and .head_sha == $head
              and .workflow_sha == $workflow
              and .source_repository == "lightning-it/shared-assets-lit"
              and (.head_ref | test("^fix/rep60-main-trust-root-(successor|bootstrap)-v[1-9][0-9]*-[0-9]{8}$"))
              and (.candidate_tree_sha | test("^[0-9a-f]{40}$"))
              and (.controller_blob_sha | test("^[0-9a-f]{40}$"))
              and (.source_sha | test("^[0-9a-f]{40}$"))
              and (.source_tree_sha | test("^[0-9a-f]{40}$"))
              and (.source_blobs | keys | sort)
                == ($expected_source_blob_paths | sort)
              and all(.source_blobs[]; test("^[0-9a-f]{40}$"))
            ' <<<"${classification}" >/dev/null
          echo 'active=true' >>"${GITHUB_OUTPUT}"

      - name: Wait for one bound bootstrap pipeline review ledger
        if: steps.bootstrap-handoff.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bootstrap_api_read() {
            local error_file error_text response status
            error_file="$(mktemp "${RUNNER_TEMP}/bootstrap-gh-api-read.XXXXXX")"
            chmod 0600 "${error_file}"
            if response="$(gh api "$@" 2>"${error_file}")"; then
              rm -f "${error_file}"
              printf '%s' "${response}"
              return 0
            else
              status="$?"
            fi
            error_text="$(<"${error_file}")"
            rm -f "${error_file}"
            printf '%s\n' "${error_text}" >&2
            if grep -Eqi \
                '\(HTTP (408|429|5[0-9][0-9])\)|timed? out|timeout|connection (reset|refused|closed)|TLS handshake timeout|context deadline exceeded|temporary failure|unexpected EOF|broken pipe' \
                <<<"${error_text}"; then
              return 75
            fi
            echo 'Terminal bootstrap API read failure.' >&2
            return "${status}"
          }
          expected_head_ref=''
          for _observation in $(seq 1 300); do
            if [ -z "${expected_head_ref}" ]; then
              candidate_head_ref=''
              if candidate_head_ref="$(bootstrap_api_read \
                  "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.ref)"; then
                :
              else
                read_status="$?"
                if [ "${read_status}" -eq 75 ]; then
                  echo 'Transient bootstrap PR-ref read failure; retrying within the bounded window.' >&2
                  sleep 5
                  continue
                fi
                exit "${read_status}"
              fi
              expected_head_ref="${candidate_head_ref}"
              [[ "${expected_head_ref}" =~ ^fix/rep60-main-trust-root-(successor|bootstrap)-v[1-9][0-9]*-[0-9]{8}$ ]]
            fi
            if pr="$(bootstrap_api_read \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"; then
              :
            else
              read_status="$?"
              if [ "${read_status}" -eq 75 ]; then
                echo 'Transient bootstrap PR read failure; retrying within the bounded window.' >&2
                sleep 5
                continue
              fi
              exit "${read_status}"
            fi
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg head_ref "${expected_head_ref}" \
              --arg repository "${REPOSITORY}" \
              --argjson number "${PR_NUMBER}" '
                .number == $number
                and .state == "open"
                and (.draft | type == "boolean")
                and .title
                  == "fix(rep60): bootstrap protected main review trust root"
                and .user.login == "litroc"
                and .user.type == "User"
                and .base.ref == "main"
                and .base.sha == $base
                and .base.repo.full_name == $repository
                and .head.ref == $head_ref
                and .head.sha == $head
                and .head.repo.full_name == $repository
              ' <<<"${pr}" >/dev/null
            draft="$(jq -er \
              '.draft | select(type == "boolean") | tostring' <<<"${pr}")"
            if [ "${draft}" = true ]; then
              sleep 5
              continue
            fi

            # Every repository that has completed the protected controller
            # seed now runs the immutable base-branch controller. The one-time
            # bootstrap bridge must therefore bind that pull_request_target
            # producer instead of the pre-seed pull_request predecessor.
            producer_event="pull_request_target"
            producer_name="Current revision review gate"

            if review_pages="$(bootstrap_api_read --paginate --slurp \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"; then
              :
            else
              read_status="$?"
              if [ "${read_status}" -eq 75 ]; then
                echo 'Transient bootstrap review read failure; retrying within the bounded window.' >&2
                sleep 5
                continue
              fi
              exit "${read_status}"
            fi
            reviews="$(jq -c \
              --arg head "${EVENT_HEAD}" '
                [add[]? |
                  select(.user.login == "copilot-pull-request-reviewer[bot]") |
                  select(.commit_id == $head)]
              ' <<<"${review_pages}")"
            review_count="$(jq 'length' <<<"${reviews}")"
            if [ "${review_count}" -gt 1 ]; then
              echo 'Multiple Copilot reviews exist for the bootstrap head.' >&2
              exit 1
            fi

            if run_pages="$(bootstrap_api_read --paginate --slurp \
                "repos/${REPOSITORY}/actions/runs?event=${producer_event}&head_sha=${EVENT_HEAD}&per_page=100")"; then
              :
            else
              read_status="$?"
              if [ "${read_status}" -eq 75 ]; then
                echo 'Transient bootstrap run read failure; retrying within the bounded window.' >&2
                sleep 5
                continue
              fi
              exit "${read_status}"
            fi
            matching_runs="$(jq -c \
              --arg base "${EVENT_BASE}" \
              --arg event "${producer_event}" \
              --arg head "${EVENT_HEAD}" \
              --arg head_ref "${expected_head_ref}" \
              --arg name "${producer_name}" \
              --arg repository "${REPOSITORY}" \
              --argjson number "${PR_NUMBER}" '
                [.[].workflow_runs[]? |
                  select(.id | type == "number" and . > 0) |
                  select(.event == $event) |
                  select(.path == ".github/workflows/copilot-review.yml") |
                  select(.name == $name) |
                  select(.head_branch == $head_ref and .head_sha == $head) |
                  select(.repository.full_name == $repository) |
                  select(.head_repository.full_name == $repository) |
                  select(.actor.login == "litroc") |
                  select(.triggering_actor.login == "litroc") |
                  select(.run_attempt == 1) |
                  select((.pull_requests | length) == 1) |
                  select(.pull_requests[0].number == $number) |
                  select(.pull_requests[0].base.ref == "main") |
                  select(.pull_requests[0].base.sha == $base) |
                  select(.pull_requests[0].head.ref == $head_ref) |
                  select(.pull_requests[0].head.sha == $head)]
              ' <<<"${run_pages}")"
            eligible_producers=0
            read_failed=false
            for producer_id in $(jq -r '.[].id' <<<"${matching_runs}"); do
              producer="$(jq -ce --argjson id "${producer_id}" \
                '.[] | select(.id == $id)' <<<"${matching_runs}")"
              if jobs_pages="$(bootstrap_api_read --paginate --slurp \
                  "repos/${REPOSITORY}/actions/runs/${producer_id}/jobs?filter=all&per_page=100")"; then
                :
              else
                read_status="$?"
                if [ "${read_status}" -eq 75 ]; then
                  read_failed=true
                  break
                fi
                exit "${read_status}"
              fi
              producer_jobs="$(jq -c '[.[].jobs[]?]' <<<"${jobs_pages}")"
              producer_status="$(jq -er \
                '.status | select(type == "string")' <<<"${producer}")"
              producer_conclusion="$(jq -er '
                select(has("conclusion"))
                | if .conclusion == null then ""
                  else .conclusion | select(type == "string")
                  end
                ' <<<"${producer}")"
              case "${producer_status}:${producer_conclusion}" in
                queued:|in_progress:|completed:success|completed:failure|completed:skipped) ;;
                *)
                  echo 'A local Copilot producer has an invalid terminal state.' >&2
                  exit 1
                  ;;
              esac
              producer_job_count="$(jq 'length' <<<"${producer_jobs}")"
              if [ "${producer_job_count}" -gt 5 ]; then
                echo 'The local Copilot producer job ledger contains unexpected jobs.' >&2
                exit 1
              fi
              if [ "${producer_job_count}" -lt 5 ]; then
                if [ "${producer_status}" = completed ]; then
                  echo 'A completed local Copilot producer has an incomplete job ledger.' >&2
                  exit 1
                fi
                continue
              fi
              jq -e \
                --arg head "${EVENT_HEAD}" \
                --argjson run_id "${producer_id}" '
                  length == 5
                  and all(.[];
                    .run_id == $run_id
                    and .head_sha == $head
                    and .run_attempt == 1
                    and (.status == "queued"
                      or .status == "in_progress"
                      or .status == "completed")
                    and (.name == "Classify protected main trust-root handoff"
                      or .name == "Request Copilot review for current revision"
                      or .name == "Verify current revision policy"
                      or .name == "Request protected verifier re-evaluation / Re-run the one protected verifier attempt"
                      or .name == "Dispatch protected managed-sync finalizer re-evaluation"))
                  and ([.[].name] | unique | length) == 5
                ' <<<"${producer_jobs}" >/dev/null
              classification_count="$(jq '
                [.[] |
                  select(.name == "Classify protected main trust-root handoff") |
                  select(.status == "completed" and .conclusion == "success")]
                | length
                ' <<<"${producer_jobs}")"
              request_count="$(jq \
                '
                [.[] |
                  select(.name == "Request Copilot review for current revision") |
                  select(.status == "completed" and .conclusion == "success")]
                | length
                ' <<<"${producer_jobs}")"
              gate_count="$(jq \
                '
                [.[] |
                  select(.name == "Verify current revision policy") |
                  select(.status == "completed" and .conclusion == "success")]
                | length
                ' <<<"${producer_jobs}")"
              helper_count="$(jq '
                [.[] |
                  select(.name == "Request protected verifier re-evaluation / Re-run the one protected verifier attempt") |
                  select(
                    ((.status == "queued" or .status == "in_progress")
                      and .conclusion == null)
                    or (.status == "completed"
                      and (.conclusion == "success" or .conclusion == "failure")))]
                | length
                ' <<<"${producer_jobs}")"
              finalizer_count="$(jq '
                [.[] |
                  select(.name == "Dispatch protected managed-sync finalizer re-evaluation") |
                  select(.status == "completed" and .conclusion == "skipped")]
                | length
                ' <<<"${producer_jobs}")"
              skipped_count="$(jq '
                [.[] |
                  select(.status == "completed" and .conclusion == "skipped")]
                | length
                ' <<<"${producer_jobs}")"
              if [ "${classification_count}" -gt 1 ] \
                || [ "${request_count}" -gt 1 ] \
                || [ "${gate_count}" -gt 1 ] \
                || [ "${helper_count}" -gt 1 ] \
                || [ "${finalizer_count}" -gt 1 ]; then
                echo 'The local Copilot producer job ledger is ambiguous.' >&2
                exit 1
              fi
              if [ "${producer_status}:${producer_conclusion}:${skipped_count}" = \
                  completed:skipped:5 ]; then
                continue
              fi
              if [ "${classification_count}" -eq 1 ] \
                && [ "${request_count}" -eq 1 ] \
                && [ "${gate_count}" -eq 1 ] \
                && [ "${helper_count}" -eq 1 ] \
                && [ "${finalizer_count}" -eq 1 ]; then
                case "${producer_status}:${producer_conclusion}" in
                  queued:|in_progress:)
                    eligible_producers=$((eligible_producers + 1))
                    ;;
                  completed:success)
                    test "$(jq '
                      [.[] |
                        select(.name == "Request protected verifier re-evaluation / Re-run the one protected verifier attempt") |
                        select(.status == "completed" and .conclusion == "success")]
                      | length
                      ' <<<"${producer_jobs}")" -eq 1
                    eligible_producers=$((eligible_producers + 1))
                    ;;
                  completed:failure)
                    # Controllers deployed before this deadlock correction can
                    # finish red solely because the helper waits for the
                    # Required Workflow that is observing this ledger. The
                    # exact five-job proof isolates only that helper failure.
                    test "$(jq '
                      [.[] |
                        select(.name == "Request protected verifier re-evaluation / Re-run the one protected verifier attempt") |
                        select(.status == "completed" and .conclusion == "failure")]
                      | length
                      ' <<<"${producer_jobs}")" -eq 1
                    eligible_producers=$((eligible_producers + 1))
                    ;;
                  *)
                    echo 'A local Copilot producer completed without the exact successful job ledger.' >&2
                    exit 1
                    ;;
                esac
              elif [ "${producer_status}" = completed ]; then
                echo 'A local Copilot producer completed without the exact successful job ledger.' >&2
                exit 1
              fi
            done
            if [ "${read_failed}" = true ]; then
              echo 'Transient bootstrap job read failure; retrying within the bounded window.' >&2
              sleep 5
              continue
            fi
            if [ "${eligible_producers}" -gt 1 ]; then
              echo 'Multiple successful local Copilot producer ledgers exist for the bootstrap head.' >&2
              exit 1
            fi
            if [ "${eligible_producers}" -eq 1 ] \
              && [ "${review_count}" -eq 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'The finalized bootstrap pipeline review did not converge.' >&2
          exit 1

      - name: Validate one immutable Shared Assets promotion handoff
        id: release-transition
        if: >-
