# Organization-owned REP-60 trust root for the public Supplementary repository.
# An organization ruleset binds this exact public source path and protected main
# ref. Ruleset workflow event filters are intentionally omitted because GitHub
# ignores them and uses the supported event's default activity types.
# yamllint disable rule:truthy rule:line-length
---
name: Protected Supplementary current-revision evidence verifier

run-name: >-
  Protected current revision PR #${{ github.event.pull_request.number }}
  ${{ github.event.action }} ${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: >-
    protected-current-revision-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify-protected-current-revision-evidence:
    name: Verify protected current-revision evidence
    if: github.repository == 'lightning-it/ansible-collection-supplementary'
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Verify one protected result for the exact live revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${REPOSITORY}" = lightning-it/ansible-collection-supplementary
          test "${WORKFLOW_REF}" = \
            'lightning-it/.github/.github/workflows/supplementary-current-revision-required.yml@refs/heads/main'
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          source_sha="$(gh api repos/lightning-it/.github/commits/main --jq .sha)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          source_compare="$(gh api \
            "repos/lightning-it/.github/compare/${WORKFLOW_SHA}...${source_sha}")"
          jq -e \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg source_sha "${source_sha}" '
              (.status == "ahead" or .status == "identical")
              and .base_commit.sha == $workflow_sha
              and .merge_base_commit.sha == $workflow_sha
              and .head_commit.sha == $source_sha
            ' <<<"${source_compare}" >/dev/null
          test "${GITHUB_RUN_ATTEMPT}" -eq 1 || test "${GITHUB_RUN_ATTEMPT}" -eq 2
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]

          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .base.sha == $base
              and .head.sha == $head
              and .base.repo.full_name == $repository
              and (.head.repo.full_name | type == "string" and length > 0)
              and (.base.ref == "develop" or .base.ref == "main")
            ' <<<"${pr}" >/dev/null
          base_ref="$(jq -r .base.ref <<<"${pr}")"
          author="$(jq -er '.user.login | select(type == "string" and length > 0)' <<<"${pr}")"
          draft="$(jq -er '.draft | select(type == "boolean")' <<<"${pr}")"
          head_repository="$(jq -er '.head.repo.full_name | select(type == "string" and length > 0)' <<<"${pr}")"
          [[ "${head_repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          head_commit="$(gh api "repos/${head_repository}/commits/${EVENT_HEAD}")"
          target_commit="$(gh api "repos/${REPOSITORY}/commits/${EVENT_HEAD}")"
          test "$(jq -r .sha <<<"${head_commit}")" = "${EVENT_HEAD}"
          test "$(jq -r .sha <<<"${target_commit}")" = "${EVENT_HEAD}"
          if [ "${author}" = 'lightning-it-release-automation[bot]' ]; then
            test "${head_repository}" = "${REPOSITORY}"
          fi

          reservation_external_id="rep60-required-workflow:v1:${PR_NUMBER}:${EVENT_HEAD}"
          reservation_name='Protected current-revision verifier'
          reservation_checks="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Protected%20current-revision%20verifier&per_page=100")"
          reservations="$(jq -c \
            --arg external_id "${reservation_external_id}" \
            --arg name "${reservation_name}" '
              [.[].check_runs[]? |
                select(.name == $name) |
                select(.app.id == 15368 and .app.slug == "github-actions") |
                select(.external_id == $external_id)]
            ' <<<"${reservation_checks}")"
          reservation_count="$(jq 'length' <<<"${reservations}")"
          if [ "${reservation_count}" -gt 1 ]; then
            echo "Multiple protected verifier reservations exist for the same PR/head." >&2
            exit 1
          fi
          if [ "${reservation_count}" -eq 1 ]; then
            reservation_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${reservations}")"
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is re-evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          else
            reservation="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
              -f name="${reservation_name}" \
              -f head_sha="${EVENT_HEAD}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            reservation_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${reservation}")"
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "in_progress"
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          fi

          finalize_failure() {
            set +e
            gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=failure \
              -f 'output[title]=Protected current-revision evidence is absent or invalid' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}; fail-closed." >/dev/null
          }
          trap finalize_failure ERR

          test "${draft}" = false
          neutral_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&per_page=100")"
          neutral="$(jq -c '
            [.[].check_runs[]? | select(.name == "Current revision review")]
          ' <<<"${neutral_pages}")"
          test "$(jq 'length' <<<"${neutral}")" -eq 1
          check="$(jq -c '.[0]' <<<"${neutral}")"
          jq -e '
            .app.id == 15368
            and .app.slug == "github-actions"
            and .status == "completed"
            and .conclusion == "success"
          ' <<<"${check}" >/dev/null
          check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${check}")"
          details_url="$(jq -r '.details_url // empty' <<<"${check}")"
          test "${details_url}" = "${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
          external_id="$(jq -r '.external_id // empty' <<<"${check}")"
          summary="$(jq -r '.output.summary // empty' <<<"${check}")"
          test -n "${summary}"
          if [ "${author}" = 'lightning-it-release-automation[bot]' ]; then
            [[ "${external_id}" =~ ^mlx90-current-revision:v4:([1-9][0-9]*):[0-9a-f]{64}$ ]]
            producer_run_id="${BASH_REMATCH[1]}"
            expected_title="Exact-Revision Codex PR #${PR_NUMBER} ${EVENT_BASE}..${EVENT_HEAD}"
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
            producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            jq -e \
              --arg actor "${author}" \
              --arg base_ref "${base_ref}" \
              --arg base_sha "${EVENT_BASE}" \
              --arg run_url "${producer_run_url}" \
              --arg title "${expected_title}" '
                .event == "workflow_dispatch"
                and .status == "completed"
                and .conclusion == "success"
                and .head_branch == $base_ref
                and .head_sha == $base_sha
                and .path == ".github/workflows/release-bot-exact-head-review.yml"
                and .display_title == $title
                and .html_url == $run_url
                and .actor.login == $actor
                and .triggering_actor.login == $actor
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and (.merge_base_sha | test("^[0-9a-f]{40}$"))
                and (.integration_tree_sha | test("^[0-9a-f]{40}$"))
                and (.diff_sha256 | test("^[0-9a-f]{64}$"))
                and (.input_sha256 | test("^[0-9a-f]{64}$"))
              ' <<<"${summary}" >/dev/null
          else
            [[ "${external_id}" =~ ^mlx90-current-revision:copilot:v4:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]
            producer_run_id="${BASH_REMATCH[1]}"
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
            producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            jq -e '
              .event == "pull_request_target"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/copilot-review.yml"
              and .name == "Current revision review gate"
            ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base_ref "${base_ref}" \
              --arg base_sha "${EVENT_BASE}" \
              --arg run_url "${producer_run_url}" '
                .head_branch == $base_ref
                and .head_sha == $base_sha
                and .html_url == $run_url
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and .review_path == "applicable Copilot or governed automation exemption"
              ' <<<"${summary}" >/dev/null
          fi

          trap - ERR
          gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Protected current-revision evidence verified' \
            -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; producer ${producer_run_url}." >/dev/null
