            [{"id":98498876339,"name":"Protected current-revision verifier","app_id":15368,"app_slug":"github-actions","head_sha":"5dc048e43ae2fd933c92af418f7b13e47a05f586","status":"completed","conclusion":"failure","external_id":"rep60-required-workflow:v3:33066823226:1498:b978d446c336ff2e6d86bef303f2dec5faad612c:5dc048e43ae2fd933c92af418f7b13e47a05f586","details_url":"https://github.com/lightning-it/shared-assets-lit/runs/98498876339","started_at":"2026-08-27T11:19:05Z","completed_at":"2026-08-27T11:19:07Z","output_title":"Protected current-revision evidence is absent or invalid","output_summary":"PR #1498; head 5dc048e43ae2fd933c92af418f7b13e47a05f586; stage permanent-producer-inventory; fail-closed."},{"id":98499001131,"name":"Protected current-revision verifier","app_id":15368,"app_slug":"github-actions","head_sha":"5dc048e43ae2fd933c92af418f7b13e47a05f586","status":"completed","conclusion":"failure","external_id":"rep60-required-workflow:v3:33066859444:1502:b978d446c336ff2e6d86bef303f2dec5faad612c:5dc048e43ae2fd933c92af418f7b13e47a05f586","details_url":"https://github.com/lightning-it/shared-assets-lit/runs/98499001131","started_at":"2026-08-27T11:19:36Z","completed_at":"2026-08-27T11:20:27Z","output_title":"Protected current-revision evidence is absent or invalid","output_summary":"PR #1502; head 5dc048e43ae2fd933c92af418f7b13e47a05f586; stage permanent-producer-binding; fail-closed."}]
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
