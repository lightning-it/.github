                  select(.app.id == 15368 and .app.slug == "github-actions") |
                  select(.head_sha == $head) |
                  select((.external_id // "") |
                    test("^mlx90-current-revision:v4:[1-9][0-9]*:[0-9a-f]{64}$"))]
              ' <<<"${neutral_pages}")"
            test "$(jq 'length' <<<"${neutral}")" -le 1
            if [ "$(jq 'length' <<<"${neutral}")" -eq 1 ]; then
              neutral_status="$(jq -er '.[0].status | select(type == "string")' \
                <<<"${neutral}")"
              if [ "${neutral_status}" = completed ]; then
                test "$(jq -er '.[0].conclusion' <<<"${neutral}")" = success
                break
              fi
              [[ "${neutral_status}" =~ ^(queued|in_progress)$ ]]
            fi
            test "${observation}" -lt 450
            sleep 2
          done
          test "$(jq 'length' <<<"${neutral}")" -eq 1
          neutral_check_id="$(jq -er \
            '.[0].id | select(type == "number" and . > 0)' <<<"${neutral}")"
          test "$(jq -r '.[0].details_url // empty' <<<"${neutral}")" = \
            "${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${neutral_check_id}"
          external_id="$(jq -er '.[0].external_id' <<<"${neutral}")"
          [[ "${external_id}" =~ ^mlx90-current-revision:v4:([1-9][0-9]*):([0-9a-f]{64})$ ]]
          producer_run_id="${BASH_REMATCH[1]}"
          input_sha256="${BASH_REMATCH[2]}"
          summary="$(jq -er \
            '.[0].output.summary | fromjson | select(type == "object")' \
            <<<"${neutral}")"
          producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg input_sha256 "${input_sha256}" \
            --arg run_url "${producer_run_url}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson run_id "${producer_run_id}" '
              .schema == 4
              and .base_sha == $base
              and .head_sha == $head
              and .input_sha256 == $input_sha256
              and .pull_request_number == $pr_number
              and .producer_run_id == $run_id
              and .run_url == $run_url
              and .workflow_sha == $base
              and (.merge_base_sha | test("^[0-9a-f]{40}$"))
              and (.integration_tree_sha | test("^[0-9a-f]{40}$"))
              and (.diff_sha256 | test("^[0-9a-f]{64}$"))
            ' <<<"${summary}" >/dev/null
          for observation in $(seq 1 120); do
            producer="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            producer_status="$(jq -er \
              '.status | select(type == "string")' <<<"${producer}")"
            if [ "${producer_status}" = completed ]; then
              break
            fi
            [[ "${producer_status}" =~ ^(queued|in_progress)$ ]]
            test "${observation}" -lt 120
            sleep 2
          done
          expected_title="Exact-Revision Codex PR #${PR_NUMBER} ${EVENT_BASE}..${EVENT_HEAD}"
          jq -e \
            --arg actor 'lightning-it-release-automation[bot]' \
            --arg api_url "${GITHUB_API_URL}" \
            --arg base_sha "${EVENT_BASE}" \
            --arg repository "${REPOSITORY}" \
            --arg run_url "${producer_run_url}" \
            --arg title "${expected_title}" \
            --argjson run_id "${producer_run_id}" '
              .id == $run_id
              and .workflow_id == 332483855
              and .workflow_url == ($api_url + "/repos/" + $repository
                + "/actions/workflows/332483855")
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .event == "workflow_dispatch"
              and .run_attempt == 1
              and .status == "completed"
              and .conclusion == "failure"
              and .head_branch == "main"
              and .head_sha == $base_sha
              and .path == ".github/workflows/release-bot-exact-head-review.yml"
              and .display_title == $title
              and .html_url == $run_url
              and .actor.login == $actor
              and .triggering_actor.login == $actor
            ' <<<"${producer}" >/dev/null
          jobs_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/actions/runs/${producer_run_id}/jobs?filter=all&per_page=100")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --argjson run_id "${producer_run_id}" '
              type == "array"
              and length > 0
              and all(.[];
                type == "object" and (.jobs | type) == "array")
              and ([.[].jobs[]] | length) == 2
              and all(.[].jobs[];
                .run_id == $run_id
                and .run_attempt == 1
                and .head_sha == $base)
              and ([.[].jobs[] |
                select(.name == "Current revision review")
                | select(.status == "completed")
                | select(.conclusion == "success")] | length) == 1
              and ([.[].jobs[] |
                select(.name == "Current revision review")
                | .steps[]?
                | select(
                    .name == "Run protected history-free Exact-Revision Codex review"
                    or .name == "Re-prove exact revision and enforce the Codex verdict")
                | select(.status == "completed")
                | select(.conclusion == "success")
                | .name] | sort) == ([
                  "Re-prove exact revision and enforce the Codex verdict",
                  "Run protected history-free Exact-Revision Codex review"
                ] | sort)
              and ([.[].jobs[] |
                select(.name == "Request protected verifier re-evaluation")
                | {
                    name,
                    status,
                    conclusion,
                    steps: [.steps[]? | {name, status, conclusion}]
                  }
              ]) == [
                {
                  name: "Request protected verifier re-evaluation",
                  status: "completed",
                  conclusion: "failure",
                  steps: [
                    {
                      name: "Set up job",
                      status: "completed",
                      conclusion: "success"
                    },
                    {
                      name: "Dispatch the protected re-evaluation helper from develop",
                      status: "completed",
                      conclusion: "failure"
                    },
                    {
                      name: "Complete job",
                      status: "completed",
                      conclusion: "success"
                    }
                  ]
                }
              ]
            ' <<<"${jobs_pages}" >/dev/null
          current_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" \
            --argjson number "${PR_NUMBER}" '
              .number == $number
              and .state == "open"
              and .draft == false
              and .user.login == "lightning-it-release-automation[bot]"
              and .user.type == "Bot"
              and .base.ref == "main"
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and .head.sha == $head
              and .head.repo.full_name == $repository
            ' <<<"${current_pr}" >/dev/null
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          success_summary="PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; producer ${producer_run_url}."
          finalized="$(gh api --method PATCH \
            "repos/${REPOSITORY}/check-runs/${reservation_id}" \
            -f status=completed \
            -f conclusion=success \
            -f "completed_at=${completed_at}" \
            -f 'output[title]=Protected transition evidence verified' \
            -f "output[summary]=${success_summary}")"
          jq -e \
            --arg completed_at "${completed_at}" \
            --arg external_id "${reservation_external_id}" \
            --arg head "${EVENT_HEAD}" \
            --arg summary "${success_summary}" \
            --arg url "${reservation_url}" \
            --argjson check_id "${reservation_id}" '
              .id == $check_id
              and .name == "Protected current-revision verifier"
              and .app.id == 15368
              and .app.slug == "github-actions"
              and .head_sha == $head
              and .details_url == $url
              and .external_id == $external_id
              and .completed_at == $completed_at
              and .status == "completed"
              and .conclusion == "success"
              and .output.summary == $summary
            ' <<<"${finalized}" >/dev/null
          trap - EXIT

      - name: Classify the exact live pull request readiness
        id: live-pr
        if: steps.bootstrap-handoff.outputs.active != 'true'
        env:
          EXPECTED_HEAD_REPOSITORY: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_HEAD_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg head_repository "${EXPECTED_HEAD_REPOSITORY}" \
            --arg repository "${REPOSITORY}" \
            --argjson number "${PR_NUMBER}" '
              .number == $number
              and .state == "open"
              and (.draft | type) == "boolean"
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and .head.sha == $head
              and .head.repo.full_name == $head_repository
            ' <<<"${pr}" >/dev/null
          draft="$(jq -er \
            '.draft | select(type == "boolean") | tostring' <<<"${pr}")"
          if [ "${draft}" = false ]; then
            echo 'ready=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'ready=false' >>"${GITHUB_OUTPUT}"
          fi

      - name: Await the exact protected producer run terminal state
        id: terminal-producer
        if: >-
          steps.live-pr.outputs.ready == 'true'
          && !(
            github.repository == 'lightning-it/shared-assets-lit'
            && github.event.pull_request.user.login
              == 'lightning-it-release-automation[bot]'
            && github.event.pull_request.base.ref == 'main'
            && github.event.pull_request.base.sha
              == 'b978d446c336ff2e6d86bef303f2dec5faad612c'
            && github.event.pull_request.head.sha
              == '5dc048e43ae2fd933c92af418f7b13e47a05f586'
            && github.event.pull_request.head.repo.full_name
              == 'lightning-it/shared-assets-lit'
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          producer_kind=''
          producer_run_id=''
          for observation in $(seq 1 450); do
            pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"
            neutral="$(jq -c \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg pr "${PR_NUMBER}" '
                [.[].check_runs[]? |
                  select(.name == "Current revision review") |
                  select(.app.id == 15368 and .app.slug == "github-actions") |
                  select(.head_sha == $head) |
                  select(.status == "completed" and .conclusion == "success") |
                  select((.external_id // "") as $external_id |
                    ($external_id |
                      test("^mlx90-current-revision:v4:[1-9][0-9]*:[0-9a-f]{64}$"))
                    or ($external_id |
                      test("^mlx90-current-revision:(copilot|managed-sync|ancestry-backmerge|renovate):v6:"
                        + $pr + ":[1-9][0-9]*:" + $base + ":" + $head + "$"))
                    or ($external_id |
                      test("^mlx90-current-revision:(copilot|ancestry-backmerge):v5:[1-9][0-9]*:"
                        + $base + ":" + $head + "$")))]
              ' <<<"${pages}")"
            test "$(jq 'length' <<<"${neutral}")" -le 1
            if [ "$(jq 'length' <<<"${neutral}")" -eq 1 ]; then
              external_id="$(jq -er '.[0].external_id' <<<"${neutral}")"
              if [[ "${external_id}" =~ ^mlx90-current-revision:v4:([1-9][0-9]*): ]]; then
                producer_kind=release-app
                producer_run_id="${BASH_REMATCH[1]}"
              elif [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|managed-sync|ancestry-backmerge|renovate):v6:${PR_NUMBER}:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]; then
                producer_kind="${BASH_REMATCH[1]}"
                producer_run_id="${BASH_REMATCH[2]}"
              else
                [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|ancestry-backmerge):v5:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]
                producer_kind="${BASH_REMATCH[1]}"
                producer_run_id="${BASH_REMATCH[2]}"
              fi
              break
            fi
            test "${observation}" -lt 450
            sleep 2
          done
          [[ "${producer_run_id}" =~ ^[1-9][0-9]*$ ]]
          if [[ "${producer_kind}" =~ ^(copilot|release-app|managed-sync|ancestry-backmerge|renovate)$ ]]; then
            producer="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            jq -e --argjson run_id "${producer_run_id}" \
              '.id == $run_id' <<<"${producer}" >/dev/null
            producer_status="$(jq -er \
              '.status | select(type == "string")' <<<"${producer}")"
            # Every recognized protected producer publishes the exact
            # successful neutral result before its verifier helper completes.
            # Waiting for the whole producer here creates a circular wait:
            # that helper is itself waiting for this Required Workflow. The
            # permanent verifier below independently binds the producer, its
            # exact evidence job, and all critical steps before accepting an
            # in-progress run.
            [[ "${producer_status}" =~ ^(queued|in_progress|completed)$ ]]
          else
            for observation in $(seq 1 120); do
              producer="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
              jq -e --argjson run_id "${producer_run_id}" \
                '.id == $run_id' <<<"${producer}" >/dev/null
              producer_status="$(jq -er \
                '.status | select(type == "string")' <<<"${producer}")"
              if [ "${producer_status}" = completed ]; then
                break
              fi
              [[ "${producer_status}" =~ ^(queued|in_progress)$ ]]
              test "${observation}" -lt 120
              sleep 2
            done
          fi
          printf 'producer_kind=%s\nproducer_run_id=%s\n' \
            "${producer_kind}" "${producer_run_id}" >>"${GITHUB_OUTPUT}"

      - name: Validate one deterministic Renovate producer handoff
        id: renovate-producer
        if: >-
          steps.terminal-producer.outputs.producer_kind == 'renovate'
          && steps.terminal-producer.outputs.producer_run_id != ''
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRODUCER_RUN_ID: >-
            ${{ steps.terminal-producer.outputs.producer_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]

          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .draft == false
              and .user.login == "renovate[bot]"
              and .user.type == "Bot"
              and .base.ref == "develop"
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and (.head.ref | startswith("renovate/"))
              and .head.sha == $head
              and .head.repo.full_name == $repository
              and (.labels | type) == "array"
              and all(.labels[];
                type == "object" and (.name | type) == "string")
              and ([.labels[].name] | index("renovate") != null)
              and ([.labels[].name] | index("dependencies") != null)
              and ([.labels[].name] | index("safe-automerge") != null)
              and ([.labels[].name] | index("breaking-update") == null)
            ' <<<"${pr}" >/dev/null
          labels_json="$(jq -c '[.labels[].name] | sort' <<<"${pr}")"
          labels_sha256="$(printf '%s' "${labels_json}" \
            | sha256sum | cut -d ' ' -f 1)"
          [[ "${labels_sha256}" =~ ^[0-9a-f]{64}$ ]]
          last_edited_at="$(jq -r '.last_edited_at // "null"' <<<"${pr}")"

          reviews="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          jq -e --arg head "${EVENT_HEAD}" '
            [.[].[]? |
              select(.user.login == "copilot-pull-request-reviewer[bot]") |
              select(.commit_id == $head)] | length == 0
            ' <<<"${reviews}" >/dev/null

          checks="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"
          neutral="$(jq -c --arg head "${EVENT_HEAD}" '
            [.[].check_runs[]? |
              select(.name == "Current revision review") |
              select(.app.id == 15368 and .app.slug == "github-actions") |
              select(.head_sha == $head)]
            ' <<<"${checks}")"
          test "$(jq 'length' <<<"${neutral}")" -eq 1
          check="$(jq -c '.[0]' <<<"${neutral}")"
          check_id="$(jq -er '.id | select(type == "number" and . > 0)' \
            <<<"${check}")"
          run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}"
          check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
          expected_external_id="mlx90-current-revision:renovate:v6:${PR_NUMBER}:${PRODUCER_RUN_ID}:${EVENT_BASE}:${EVENT_HEAD}"
          jq -e \
            --arg external_id "${expected_external_id}" \
            --arg url "${check_url}" '
              .status == "completed"
              and .conclusion == "success"
              and .external_id == $external_id
              and .details_url == $url
              and .output.title
                == "Current revision Renovate exemption passed"
              and (.output.summary | type) == "string"
            ' <<<"${check}" >/dev/null
          summary="$(jq -er '.output.summary | fromjson' <<<"${check}")"

          repository="$(gh api "repos/${REPOSITORY}")"
          controller_ref="$(jq -er \
            '.default_branch | select(type == "string" and length > 0)' \
            <<<"${repository}")"
          controller_ref_uri="$(jq -rn \
            --arg value "${controller_ref}" '$value | @uri')"
          test -n "${controller_ref_uri}"
          controller_head="$(gh api \
            "repos/${REPOSITORY}/branches/${controller_ref_uri}" \
            --jq .commit.sha)"
          [[ "${controller_head}" =~ ^[0-9a-f]{40}$ ]]
          controller_sha="$(jq -er \
            '.controller_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            <<<"${summary}")"
          controller_compare="$(gh api \
            "repos/${REPOSITORY}/compare/${controller_sha}...${controller_head}")"
          jq -e --arg controller "${controller_sha}" '
            .status == "identical"
            or (.status == "ahead" and .behind_by == 0
              and .merge_base_commit.sha == $controller)
            ' <<<"${controller_compare}" >/dev/null
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg controller "${controller_sha}" \
            --arg controller_ref "${controller_ref}" \
            --arg head "${EVENT_HEAD}" \
            --arg labels_sha256 "${labels_sha256}" \
            --arg last_edited_at "${last_edited_at}" \
            --arg repository "${REPOSITORY}" \
            --arg run_url "${run_url}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson run_id "${PRODUCER_RUN_ID}" '
              (keys | sort) == ([
                "base_sha", "controller_ref", "controller_sha",
                "head_repository", "head_sha", "producer_run_id",
                "pull_request_labels_sha256",
                "pull_request_last_edited_at", "pull_request_number",
                "review_id", "review_path", "run_url", "schema"
              ] | sort)
              and .schema == 4
              and .base_sha == $base
              and .head_sha == $head
              and .head_repository == $repository
              and .controller_sha == $controller
              and .controller_ref == $controller_ref
              and .pull_request_number == $pr_number
              and .producer_run_id == $run_id
              and .pull_request_last_edited_at == (
                if $last_edited_at == "null"
                then null else $last_edited_at end)
              and .pull_request_labels_sha256 == $labels_sha256
              and .review_id == null
              and .review_path
                == "deterministic policy-bound Renovate exemption"
              and .run_url == $run_url
            ' <<<"${summary}" >/dev/null

          producer=''
          jobs=''
          producer_ledger_ready=false
          for observation in $(seq 1 60); do
            producer="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}")"
            producer_status="$(jq -er \
              '.status | select(type == "string")' <<<"${producer}")"
            if [ "${producer_status}" = completed ]; then
              producer_conclusion="$(jq -er \
                '.conclusion | select(type == "string")' <<<"${producer}")"
              test "${producer_conclusion}" = success
              jobs="$(gh api --paginate --slurp \
                "repos/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/jobs?filter=all&per_page=100")"
              if jq -e \
                  --arg head "${EVENT_HEAD}" \
                  --argjson run_id "${PRODUCER_RUN_ID}" '
                    ([.[].jobs[]? |
                      select(.run_id == $run_id and .head_sha == $head) |
                      select(.run_attempt == 1) |
                      select(.name == "Verify current revision policy") |
                      select(.status == "completed" and .conclusion == "success") |
                      select(([.steps[]? |
                        select(.status == "completed" and .conclusion == "success") |
                        .name] | sort) as $steps |
                        ($steps | index("Accept trusted automation exemption")) != null
                        and ($steps | index("Publish bound neutral result")) != null)]
                      | length) == 1
                    and ([.[].jobs[]? |
                      select(.run_id == $run_id and .head_sha == $head) |
                      select(.run_attempt == 1) |
                      select(.name
                        == "Request Copilot review for current revision") |
                      select(.status == "completed" and .conclusion == "skipped")]
                      | length) == 1
                    and ([.[].jobs[]? |
                      select(.run_id == $run_id and .head_sha == $head) |
                      select(.run_attempt == 1) |
                      select(.name | startswith(
                        "Request protected verifier re-evaluation")) |
                      select(.status == "completed" and .conclusion == "skipped")]
                      | length) == 1
                  ' <<<"${jobs}" >/dev/null; then
                producer_ledger_ready=true
                break
              fi
            else
              [[ "${producer_status}" =~ ^(queued|in_progress)$ ]]
            fi
            if [ "${observation}" -eq 60 ]; then
              echo 'The terminal Renovate producer ledger did not converge.' >&2
              exit 1
            fi
            sleep 1
          done
          test "${producer_ledger_ready}" = true
          jq -e \
            --arg head "${EVENT_HEAD}" \
            --arg head_ref "$(jq -r .head.ref <<<"${pr}")" \
            --arg repository "${REPOSITORY}" \
            --arg run_url "${run_url}" \
            --argjson run_id "${PRODUCER_RUN_ID}" '
              .id == $run_id
              and .event == "pull_request_target"
              and .run_attempt == 1
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/copilot-review.yml"
              and .name == "Current revision review gate"
              and .head_branch == $head_ref
              and .head_sha == $head
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and .actor.login == "renovate[bot]"
              and .triggering_actor.login == "renovate[bot]"
              and .html_url == $run_url
            ' <<<"${producer}" >/dev/null
          {
            echo 'verified=true'
            echo "labels_sha256=${labels_sha256}"
            echo "last_edited_at=${last_edited_at}"
          } >>"${GITHUB_OUTPUT}"

      - name: Validate an Exact-Revision producer handoff
        id: release-app-producer
        if: >-
          steps.terminal-producer.outputs.producer_run_id != ''
          && steps.terminal-producer.outputs.producer_kind == 'release-app'
          && github.event.pull_request.user.login
            == 'lightning-it-release-automation[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: >-
            ${{ steps.terminal-producer.outputs.producer_run_id }}
        run: |
          set -euo pipefail
          echo 'ready=false' >>"${GITHUB_OUTPUT}"
          [[ "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          expected_title="Exact-Revision Codex PR #${PR_NUMBER} ${EVENT_BASE}..${EVENT_HEAD}"
          for observation in $(seq 1 60); do
            producer="$(gh api \
              "repos/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}")"
            producer_status="$(jq -er \
              '.status | select(type == "string")' <<<"${producer}")"
            producer_conclusion="$(jq -er '
              select(has("conclusion"))
              | if .conclusion == null then ""
                else .conclusion | select(type == "string")
                end
              ' <<<"${producer}")"
            terminal_helper_handoff=false
            terminal_success_handoff=false
            if [ "${producer_status}" = completed ]; then
              if [ "${producer_conclusion}" = success ]; then
                # The producer can complete while this Required Workflow is
                # observing its job ledger. Prove the same exact review below
                # instead of returning without reserving the protected result.
                terminal_success_handoff=true
              else
                test "${producer_conclusion}" = failure
                # Controllers deployed before the protected deadlock fix can
                # finish red after publishing a fully successful exact-review
                # job because their optional verifier helper cannot start. The
                # exact-one job and critical-step proof below isolates only
                # that terminal handoff; every other failed shape remains
                # invalid.
                terminal_helper_handoff=true
              fi
            else
              [[ "${producer_status}" =~ ^(queued|in_progress)$ ]]
              test -z "${producer_conclusion}"
            fi
            jobs_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs/${PRODUCER_RUN_ID}/jobs?filter=all&per_page=100")"
            # The optional helper can be visible before GitHub assigns a
            # runner. Treat every documented non-terminal service state as a
            # pending helper, while still requiring a null conclusion and the
            # exact successful review job below. The controller's explicit
            # unauthorized-dispatch rejection is a job-level skipped sentinel:
            # it is never review evidence, but its exact inert ledger entry is
            # part of the protected fail-closed controller shape.
            jq -e \
              --arg base "${EVENT_BASE}" \
              --argjson run_id "${PRODUCER_RUN_ID}" '
                type == "array" and length > 0
                and all(.[]; type == "object" and (.jobs | type) == "array")
                and all(.[].jobs[]?;
                  .run_id == $run_id
                  and .run_attempt == 1
                  and .head_sha == $base
                  and (
                    if .name == "Reject unauthorized Exact-Revision dispatch"
                    then .status == "completed"
                      and .conclusion == "skipped"
                      and .runner_id == null
                      and (.steps | type) == "array"
                      and (.steps | length) == 0
                    else (
                      (.name == "Current revision review"
                        or (.name | startswith(
                          "Request protected verifier re-evaluation")))
                      and (
                        (.status == "completed" and .conclusion == "success")
                        or ((.status == "requested"
                            or .status == "waiting"
                            or .status == "pending"
                            or .status == "queued"
                            or .status == "in_progress")
                          and .conclusion == null)
                      )
                    ) end))
              ' <<<"${jobs_pages}" >/dev/null
            review_job_count="$(jq \
              '[.[].jobs[]? | select(.name == "Current revision review")] | length' \
              <<<"${jobs_pages}")"
            helper_job_count="$(jq '
              [.[].jobs[]? | select(.name | startswith(
                "Request protected verifier re-evaluation"))] | length
              ' <<<"${jobs_pages}")"
            rejection_job_count="$(jq '
              [.[].jobs[]? | select(.name
                == "Reject unauthorized Exact-Revision dispatch")] | length
              ' <<<"${jobs_pages}")"
            test "${review_job_count}" -le 1
            test "${helper_job_count}" -le 1
            test "${rejection_job_count}" -le 1
            exact_jobs="$(jq -c \
              --arg base "${EVENT_BASE}" '
                [.[].jobs[]? |
                  select(.name == "Current revision review") |
                  select(.head_sha == $base and .run_attempt == 1) |
                  select(.status == "completed" and .conclusion == "success")]
              ' <<<"${jobs_pages}")"
            if [ "$(jq 'length' <<<"${exact_jobs}")" -eq 1 ]; then
              jq -e \
                --argjson terminal_helper_handoff \
                  "${terminal_helper_handoff}" \
                --argjson terminal_success_handoff \
                  "${terminal_success_handoff}" '
                  [.[].jobs[]?] as $jobs
                  | ([$jobs[] |
                      select(.name == "Current revision review")]
                      | length) == 1
                  and ([$jobs[] |
                      select(.name | startswith(
                        "Request protected verifier re-evaluation"))]
                      | length) <= 1
                  and ([$jobs[] |
                      select(.name
                        == "Reject unauthorized Exact-Revision dispatch")]
                      | length) <= 1
                  and (if $terminal_helper_handoff
                    then ($jobs | length) == (
                      1 + ([$jobs[] | select(.name
                        == "Reject unauthorized Exact-Revision dispatch")]
                        | length))
                    else true end)
                  and (if $terminal_success_handoff
                    then all($jobs[];
                      .status == "completed"
                      and (if .name
                          == "Reject unauthorized Exact-Revision dispatch"
                        then .conclusion == "skipped"
                          and .runner_id == null
                          and (.steps | type) == "array"
                          and (.steps | length) == 0
                        else .conclusion == "success" end))
                    else true end)
                  and ([$jobs[] |
                    select(.name == "Current revision review")][0]
                    | .status == "completed"
                    and .conclusion == "success"
                    and (.steps | type) == "array")
                  and ([$jobs[] |
                    select(.name == "Current revision review")][0] as $review
                    | ([$review.steps[]? |
                      select(.name ==
                        "Run protected history-free Exact-Revision Codex review") |
                      select(.status == "completed") |
                      select(.conclusion == "success"
                        or .conclusion == "skipped")]
                      | length) == 1
                    and ([$review.steps[]? |
                      select(.name ==
                        "Re-prove exact revision and enforce the Codex verdict") |
                      select(.status == "completed"
                        and .conclusion == "success")]
                      | length) == 1)
                ' <<<"${jobs_pages}" >/dev/null
              current_pr="$(gh api \
                "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
              base_ref="$(jq -er \
                '.base.ref | select(. == "develop" or . == "main")' \
                <<<"${current_pr}")"
              jq -e \
                --arg actor 'lightning-it-release-automation[bot]' \
                --arg base_ref "${base_ref}" \
                --arg base_sha "${EVENT_BASE}" \
                --arg head "${EVENT_HEAD}" \
                --arg title "${expected_title}" \
                --argjson terminal_helper_handoff \
                  "${terminal_helper_handoff}" \
                --argjson terminal_success_handoff \
                  "${terminal_success_handoff}" \
                --argjson run_id "${PRODUCER_RUN_ID}" '
                  .id == $run_id
                  and .event == "workflow_dispatch"
                  and .run_attempt == 1
                  and (
                    ((.status == "queued" or .status == "in_progress")
                      and .conclusion == null)
                    or ($terminal_success_handoff
                      and .status == "completed"
                      and .conclusion == "success")
                    or ($terminal_helper_handoff
                      and .status == "completed"
                      and .conclusion == "failure")
                  )
                  and .head_branch == $base_ref
                  and .head_sha == $base_sha
                  and .path == ".github/workflows/release-bot-exact-head-review.yml"
                  and .display_title == $title
                  and .actor.login == $actor
                  and .triggering_actor.login == $actor
                ' <<<"${producer}" >/dev/null
              jq -e \
                --arg base "${EVENT_BASE}" \
                --arg head "${EVENT_HEAD}" \
                --arg repository "${REPOSITORY}" '
                  .state == "open"
                  and .draft == false
                  and .base.sha == $base
                  and .head.sha == $head
                  and .base.repo.full_name == $repository
                  and .head.repo.full_name == $repository
                  and .user.login == "lightning-it-release-automation[bot]"
                ' <<<"${current_pr}" >/dev/null
              echo 'ready=true' >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            test "${observation}" -lt 60
            sleep 1
          done

      - name: Verify one protected result for the exact live revision
        id: protected-verifier
        if: >-
          !(
            github.repository == 'lightning-it/shared-assets-lit'
            && github.event.pull_request.user.login
              == 'lightning-it-release-automation[bot]'
            && github.event.pull_request.draft == false
            && github.event.pull_request.base.ref == 'main'
            && github.event.pull_request.base.sha
              == 'b978d446c336ff2e6d86bef303f2dec5faad612c'
            && github.event.pull_request.head.sha
              == '5dc048e43ae2fd933c92af418f7b13e47a05f586'
            && github.event.pull_request.head.repo.full_name
              == 'lightning-it/shared-assets-lit'
          )
        env:
          CONTROLLER_GH_TOKEN: ${{ steps.controller-app.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          INLINE_POLICY_STEP: >-
            ${{
              steps.terminal-producer.outputs.producer_kind == 'copilot'
              && 'Verify current Copilot review and resolved findings'
              || steps.terminal-producer.outputs.producer_kind == 'renovate'
              && 'Accept trusted automation exemption'
              || steps.terminal-producer.outputs.producer_kind == 'managed-sync'
              && 'Accept trusted automation exemption'
              || steps.terminal-producer.outputs.producer_kind
                == 'ancestry-backmerge'
              && 'Verify evidence-bound ancestry backmerge'
              || ''
            }}
          RELEASE_APP_PRODUCER_EVIDENCE_READY: >-
            ${{ steps.release-app-producer.outputs.ready }}
          RENOVATE_PRODUCER_VERIFIED: >-
            ${{ steps.renovate-producer.outputs.verified }}
          SOURCE_GH_TOKEN: ${{ steps.source-app.outputs.token }}
          TERMINAL_PRODUCER_RUN_ID: >-
            ${{ steps.terminal-producer.outputs.producer_run_id }}
          TERMINAL_PRODUCER_KIND: >-
            ${{ steps.terminal-producer.outputs.producer_kind }}
        # actionlint 1.7.12 deadlocks before ShellCheck starts when one run
        # payload reaches the Linux 65,536-byte pipe capacity (upstream #712).
        # The deterministic unit test keeps this protected payload bounded.
        run: |
          # shellcheck disable=SC2153
          set -euo pipefail
          failure_stage='initialization'
          report_failure_stage() {
            local exit_code="$?"
            if [ "${exit_code}" -ne 0 ]; then
              printf '::error title=REP-60 verifier failed closed::stage=%s\n' \
                "${failure_stage}"
            fi
          }
          trap report_failure_stage EXIT
          producer_kind="${TERMINAL_PRODUCER_KIND}"

          failure_stage='protected-source-binding'
          [[ "${REPOSITORY}" =~ ^lightning-it/[A-Za-z0-9_.-]+$ ]]
          target_repository="$(gh api "repos/${REPOSITORY}")"
          jq -e \
            --arg repository "${REPOSITORY}" '
              .full_name == $repository
              and .owner.login == "lightning-it"
              and .archived == false
              and .disabled == false
            ' <<<"${target_repository}" >/dev/null
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EVENT_ACTION}" =~ ^(opened|synchronize|reopened|ready_for_review|edited)$ ]]
          pr=""
          case "${WORKFLOW_REF}" in
            lightning-it/.github/.github/workflows/supplementary-current-revision-required.yml@refs/heads/main)
              source_sha="$(gh api repos/lightning-it/.github/commits/main --jq .sha)"
              [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
              source_compare="$(gh api \
                "repos/lightning-it/.github/compare/${WORKFLOW_SHA}...${source_sha}")"
              jq -e \
                --arg workflow_sha "${WORKFLOW_SHA}" \
                --arg source_sha "${source_sha}" '
                  .base_commit.sha == $workflow_sha
                  and .merge_base_commit.sha == $workflow_sha
                  and (
                    (.status == "identical"
                      and $source_sha == $workflow_sha
                      and .ahead_by == 0
                      and .behind_by == 0
                      and .head_commit == null)
                    or
                    (.status == "ahead"
                      and $source_sha != $workflow_sha
                      and .ahead_by > 0
                      and .behind_by == 0
                      and .head_commit.sha == $source_sha)
                  )
                ' <<<"${source_compare}" >/dev/null
              ;;
            lightning-it/.github/.github/workflows/supplementary-current-revision-required.yml@refs/heads/develop)
              test "${REPOSITORY}" = lightning-it/.github
              protected_develop="$(gh api repos/lightning-it/.github/branches/develop)"
              if [ "${WORKFLOW_SHA}" = "${EVENT_BASE}" ]; then
                jq -e \
                  --arg base "${EVENT_BASE}" '
                    .name == "develop"
                    and .protected == true
                    and .commit.sha == $base
                  ' <<<"${protected_develop}" >/dev/null
                source_sha="${EVENT_BASE}"
              else
                test "${WORKFLOW_SHA}" = "${EVENT_HEAD}"
                pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
                jq -e \
                  --arg base "${EVENT_BASE}" \
                  --arg head "${EVENT_HEAD}" \
                  --arg repository "${REPOSITORY}" '
                    .state == "open"
                    and .base.ref == "main"
                    and .base.sha == $base
                    and .base.repo.full_name == $repository
                    and .head.ref == "develop"
                    and .head.sha == $head
                    and .head.repo.full_name == $repository
                  ' <<<"${pr}" >/dev/null
                protected_main="$(gh api repos/lightning-it/.github/branches/main)"
                jq -e \
                  --arg base "${EVENT_BASE}" '
                    .name == "main"
                    and .protected == true
                    and .commit.sha == $base
                  ' <<<"${protected_main}" >/dev/null
                jq -e \
                  --arg head "${EVENT_HEAD}" '
                    .name == "develop"
                    and .protected == true
                    and .commit.sha == $head
                  ' <<<"${protected_develop}" >/dev/null
                source_sha="${EVENT_HEAD}"
              fi
              ;;
            *)
              echo "Required Workflow source is not a protected controller." >&2
              exit 1
              ;;
          esac

          failure_stage='event-metadata-binding'
          test "${GITHUB_RUN_ATTEMPT}" -eq 1 || test "${GITHUB_RUN_ATTEMPT}" -eq 2
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]

          failure_stage='live-pr-binding'
          if [ -z "${pr}" ]; then
            pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          fi
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .base.sha == $base
              and .head.sha == $head
              and .base.repo.full_name == $repository
              and (.head.repo.full_name | type == "string" and length > 0)
              and (.base.ref == "develop" or .base.ref == "main")
            ' <<<"${pr}" >/dev/null
          base_ref="$(jq -r .base.ref <<<"${pr}")"
          author="$(jq -er '.user.login | select(type == "string" and length > 0)' <<<"${pr}")"
          draft="$(jq -er '.draft | select(type == "boolean") | tostring' <<<"${pr}")"
          head_ref="$(jq -er '.head.ref | select(type == "string" and length > 0)' <<<"${pr}")"
          head_repository="$(jq -er '.head.repo.full_name | select(type == "string" and length > 0)' <<<"${pr}")"
          pr_title="$(jq -er '.title | select(type == "string" and length > 0)' <<<"${pr}")"
          [[ "${head_repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          central_sync_backmerge=false
          if [ "${REPOSITORY}" = 'lightning-it/.github' ] \
            && [ "${author}" = 'lightning-it-shared-assets-sync[bot]' ] \
            && [ "${base_ref}" = develop ] \
            && [ "${head_repository}" = "${REPOSITORY}" ] \
            && [[ "${head_ref}" == backmerge/*-main ]] \
            && [[ "${pr_title}" == \
              "chore(governance): record main ancestry before "* ]]; then
            central_sync_backmerge=true
          fi

          failure_stage='live-commit-binding'
          head_commit="$(gh api "repos/${head_repository}/commits/${EVENT_HEAD}")"
          target_commit="$(gh api "repos/${REPOSITORY}/commits/${EVENT_HEAD}")"
          test "$(jq -r .sha <<<"${head_commit}")" = "${EVENT_HEAD}"
          test "$(jq -r .sha <<<"${target_commit}")" = "${EVENT_HEAD}"
          if { [ "${author}" = 'lightning-it-release-automation[bot]' ] \
              || [ "${central_sync_backmerge}" = true ]; }; then
            test "${head_repository}" = "${REPOSITORY}"
          fi

          failure_stage='reservation-inventory'
          reservation_external_id="rep60-required-workflow:v3:${GITHUB_RUN_ID}:${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}"
          reservation_name='Protected current-revision verifier'
          reservation_checks="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Protected%20current-revision%20verifier&per_page=100")"
          all_reservations="$(jq -c \
            --arg head "${EVENT_HEAD}" \
            --arg name "${reservation_name}" '
              [.[].check_runs[]? |
                select(.name == $name) |
                select(.app.id == 15368 and .app.slug == "github-actions") |
                select(.head_sha == $head)]
            ' <<<"${reservation_checks}")"
          reservations="$(jq -c \
            --arg v3_prefix 'rep60-required-workflow:v3:' \
            --arg v3_suffix ":${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}" \
            --arg v2_prefix 'rep60-required-workflow:v2:' \
            --arg v2_suffix ":${PR_NUMBER}:${EVENT_HEAD}" '
              [.[] |
                select((.external_id | type) == "string") |
                select(
                  (.external_id | startswith($v3_prefix) and endswith($v3_suffix))
                  or
                  (.external_id | startswith($v2_prefix) and endswith($v2_suffix))
                )]
            ' <<<"${all_reservations}")"
          foreign_reservations="$(jq -c \
            --arg v3_prefix 'rep60-required-workflow:v3:' \
            --arg v3_suffix ":${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}" \
            --arg v2_prefix 'rep60-required-workflow:v2:' \
            --arg v2_suffix ":${PR_NUMBER}:${EVENT_HEAD}" '
              [.[] |
                select((
                  ((.external_id | type) == "string")
                  and (
                    (.external_id | startswith($v3_prefix) and endswith($v3_suffix))
                    or
                    (.external_id | startswith($v2_prefix) and endswith($v2_suffix))
                  )
                ) | not)]
            ' <<<"${all_reservations}")"
          foreign_count="$(jq 'length' <<<"${foreign_reservations}")"
          if [ "${foreign_count}" -gt 20 ]; then
            echo "Too many foreign protected verifier reservations exist for this commit." >&2
            exit 1
          fi
          current_verifier_run="$(gh api \
            "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          current_workflow_id="$(jq -er \
            --arg action "${EVENT_ACTION}" \
            --arg head "${EVENT_HEAD}" \
            --argjson pr_number "${PR_NUMBER}" \
            --argjson run_id "${GITHUB_RUN_ID}" '
              select(
                .id == $run_id
                and .event == "pull_request_target"
                and .path == ".github/workflows/supplementary-current-revision-required.yml"
                and .status == "in_progress"
                and .conclusion == null
                and .head_sha == $head
                and ((.run_attempt == 1) or (.run_attempt == 2))
                and .display_title == (
                  "Protected current revision PR #"
                  + ($pr_number | tostring) + " " + $action + " " + $head
                )
                and (.workflow_id | type == "number" and . > 0)
              )
              | .workflow_id
            ' <<<"${current_verifier_run}")"
          if [ "${foreign_count}" -gt 0 ]; then
            jq -e \
              --arg head "${EVENT_HEAD}" \
              --arg name "${reservation_name}" '
                all(.[];
                  (.id | type == "number" and . > 0)
                  and .name == $name
                  and .head_sha == $head
                  and (.external_id | type == "string")
                  and (.details_url | type == "string")
                  and .status == "completed"
                  and (.conclusion == "success" or .conclusion == "failure")
                )
              ' <<<"${foreign_reservations}" >/dev/null
            test "$(jq '[.[].external_id] | unique | length' <<<"${foreign_reservations}")" -eq "${foreign_count}"

            declare -A retired_pr_numbers=()
            declare -A retired_run_ids=()
            while IFS=$'\t' read -r foreign_check_id foreign_status foreign_conclusion foreign_external_id foreign_details_url; do
              [[ "${foreign_check_id}" =~ ^[1-9][0-9]*$ ]]
              test "${foreign_status}" = completed
              [[ "${foreign_conclusion}" =~ ^(success|failure)$ ]]
              foreign_base=''
              if [[ "${foreign_external_id}" =~ ^rep60-required-workflow:v3:([1-9][0-9]*):([1-9][0-9]*):([0-9a-f]{40}):${EVENT_HEAD}$ ]]; then
                foreign_run_id="${BASH_REMATCH[1]}"
                foreign_pr_number="${BASH_REMATCH[2]}"
                foreign_base="${BASH_REMATCH[3]}"
              else
                [[ "${foreign_external_id}" =~ ^rep60-required-workflow:v2:([1-9][0-9]*):([1-9][0-9]*):${EVENT_HEAD}$ ]]
                foreign_run_id="${BASH_REMATCH[1]}"
                foreign_pr_number="${BASH_REMATCH[2]}"
              fi
              if [ "${foreign_pr_number}" = "${PR_NUMBER}" ]; then
                test -n "${foreign_base}"
                test "${foreign_base}" != "${EVENT_BASE}"
              fi
              test -z "${retired_pr_numbers["${foreign_pr_number}"]:-}"
              test -z "${retired_run_ids["${foreign_run_id}"]:-}"
              retired_pr_numbers["${foreign_pr_number}"]=true
              retired_run_ids["${foreign_run_id}"]=true
              test "${foreign_details_url}" = \
                "${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${foreign_check_id}"

              retired_pr="$(gh api \
                "repos/${REPOSITORY}/pulls/${foreign_pr_number}")"
              if [ "${foreign_pr_number}" = "${PR_NUMBER}" ]; then
                jq -e \
                  --arg base "${EVENT_BASE}" \
                  --arg head "${EVENT_HEAD}" \
                  --arg repository "${REPOSITORY}" \
                  --argjson number "${foreign_pr_number}" '
                    .number == $number
                    and .state == "open"
                    and .base.sha == $base
                    and .base.repo.full_name == $repository
                    and .head.sha == $head
                    and (.head.repo.full_name | type == "string" and length > 0)
                  ' <<<"${retired_pr}" >/dev/null
              else
                jq -e \
                  --arg head "${EVENT_HEAD}" \
                  --arg repository "${REPOSITORY}" \
                  --argjson number "${foreign_pr_number}" '
                    .number == $number
                    and .state == "closed"
                    and .base.repo.full_name == $repository
                    and .head.sha == $head
                    and (.head.repo.full_name | type == "string" and length > 0)
                  ' <<<"${retired_pr}" >/dev/null
              fi

              retired_verifier_run="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${foreign_run_id}")"
              jq -e \
                --arg conclusion "${foreign_conclusion}" \
                --arg head "${EVENT_HEAD}" \
                --argjson pr_number "${foreign_pr_number}" \
                --argjson run_id "${foreign_run_id}" \
                --argjson workflow_id "${current_workflow_id}" '
                  .id == $run_id
                  and .workflow_id == $workflow_id
                  and .event == "pull_request_target"
                  and .path == ".github/workflows/supplementary-current-revision-required.yml"
                  and .status == "completed"
                  and .conclusion == $conclusion
                  and .head_sha == $head
                  and ((.run_attempt == 1) or (.run_attempt == 2))
                  and (
                    .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " opened " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " synchronize " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " reopened " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " ready_for_review " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " edited " + $head)
                  )
                ' <<<"${retired_verifier_run}" >/dev/null
            done < <(jq -r '.[] | [.id, .status, .conclusion, .external_id, .details_url] | @tsv' <<<"${foreign_reservations}")
          fi
          reservation_count="$(jq 'length' <<<"${reservations}")"
          if [ "${reservation_count}" -gt 1 ]; then
            echo "Multiple protected verifier reservations exist for the same PR/head." >&2
            exit 1
          fi
          failure_stage='reservation-materialization'
          if [ "${reservation_count}" -eq 1 ]; then
            reservation_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${reservations}")"
            prior_external_id="$(jq -er '.[0].external_id | select(type == "string")' <<<"${reservations}")"
            if [[ "${prior_external_id}" =~ ^rep60-required-workflow:v3:[1-9][0-9]*:${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}$ ]]; then
              :
            else
              [[ "${prior_external_id}" =~ ^rep60-required-workflow:v2:([1-9][0-9]*):${PR_NUMBER}:${EVENT_HEAD}$ ]]
              prior_run_id="${BASH_REMATCH[1]}"
              prior_verifier_run="$(gh api \
                "repos/${REPOSITORY}/actions/runs/${prior_run_id}")"
              jq -e \
                --arg head "${EVENT_HEAD}" \
                --argjson pr_number "${PR_NUMBER}" \
                --argjson run_id "${prior_run_id}" \
                --argjson workflow_id "${current_workflow_id}" '
                  .id == $run_id
                  and .workflow_id == $workflow_id
                  and .event == "pull_request_target"
                  and .path == ".github/workflows/supplementary-current-revision-required.yml"
                  and .status == "completed"
                  and (.conclusion == "success" or .conclusion == "failure")
                  and .head_sha == $head
                  and ((.run_attempt == 1) or (.run_attempt == 2))
                  and (
                    .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " opened " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " synchronize " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " reopened " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " ready_for_review " + $head)
                    or .display_title == ("Protected current revision PR #" + ($pr_number | tostring) + " edited " + $head)
                  )
                ' <<<"${prior_verifier_run}" >/dev/null
            fi
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is re-evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          else
            reservation="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
              -f name="${reservation_name}" \
              -f head_sha="${EVENT_HEAD}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            reservation_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${reservation}")"
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "in_progress"
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          fi

          finalize_failure() {
            local exit_code="$?"
            trap - ERR
            set +e
            gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=failure \
              -f 'output[title]=Protected current-revision evidence is absent or invalid' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}; stage ${failure_stage}; fail-closed." >/dev/null
            exit "${exit_code}"
          }
          trap finalize_failure ERR

          test "${draft}" = false
          controller_seed_verified=false
          if [ "${author}" = litroc ] \
            && [ "${base_ref}" = main ] \
            && [ "${head_repository}" = "${REPOSITORY}" ] \
            && [ "${pr_title}" = \
              'fix(rep60): seed protected main review controller' ]; then
            failure_stage='main-controller-seed-classification'
            test "$(jq -r .user.type <<<"${pr}")" = User
            test -n "${CONTROLLER_GH_TOKEN}"
            test -n "${SOURCE_GH_TOKEN}"
            install -d -m 0700 protected-controller-seed
            controller_seed_asset="$(GH_TOKEN="${CONTROLLER_GH_TOKEN}" gh api \
              "repos/lightning-it/.github/contents/scripts/verify-main-trust-root-bootstrap.py?ref=${WORKFLOW_SHA}")"
            jq -e \
              --arg path scripts/verify-main-trust-root-bootstrap.py \
              --arg url "${GITHUB_API_URL}/repos/lightning-it/.github/contents/scripts/verify-main-trust-root-bootstrap.py?ref=${WORKFLOW_SHA}" '
                .type == "file"
                and .encoding == "base64"
                and .path == $path
                and .url == $url
                and (.sha | type == "string" and test("^[0-9a-f]{40}$"))
                and ((.size | type) == "number" and .size > 0 and .size < 100000)
                and (.content | type == "string" and length > 0)
              ' <<<"${controller_seed_asset}" >/dev/null
            jq -er .content <<<"${controller_seed_asset}" \
              | base64 --decode >protected-controller-seed/verify.py
            test "$(git hash-object protected-controller-seed/verify.py)" = \
              "$(jq -r .sha <<<"${controller_seed_asset}")"
            chmod 0500 protected-controller-seed/verify.py

            controller_seed_summary="$(python3 \
              protected-controller-seed/verify.py \
              --repository "${REPOSITORY}" \
              --pull-request "${PR_NUMBER}" \
              --expected-base "${EVENT_BASE}" \
              --expected-head "${EVENT_HEAD}" \
              --workflow-sha "${WORKFLOW_SHA}" \
              --controller-seed)"
            controller_seed_verified=true
          fi

          if [ "${controller_seed_verified}" = true ]; then
            failure_stage='main-controller-seed-evidence'
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg repository "${REPOSITORY}" \
              --arg workflow "${WORKFLOW_SHA}" \
              --argjson pr_number "${PR_NUMBER}" '
                (keys | sort) == ([
                  "base_sha", "candidate_tree_sha", "controller_blob_sha",
                  "current_revision_check_id",
                  "current_revision_producer_run_id",
                  "head_sha", "pull_request_number", "repository",
                  "review_id", "review_path", "review_request_event_id",
                  "review_submitted_at", "schema", "source_repository",
                  "source_sha", "source_tree_sha", "threads_resolved",
                  "workflow_sha"
                ] | sort)
                and .schema == "rep60-main-controller-seed/v2"
                and .repository == $repository
                and .pull_request_number == $pr_number
                and .base_sha == $base
                and .head_sha == $head
                and .workflow_sha == $workflow
                and .review_path
                  == "protected controller seed with exact Copilot and current-revision evidence"
                and .source_repository == "lightning-it/shared-assets-lit"
                and (.candidate_tree_sha | test("^[0-9a-f]{40}$"))
                and (.controller_blob_sha | test("^[0-9a-f]{40}$"))
                and (.source_sha | test("^[0-9a-f]{40}$"))
                and (.source_tree_sha | test("^[0-9a-f]{40}$"))
                and (.review_id | type == "number" and . > 0)
                and (.review_request_event_id | type == "number" and . > 0)
                and (.current_revision_check_id
                  | type == "number" and . > 0)
                and (.current_revision_producer_run_id
                  | type == "number" and . > 0)
                and (.threads_resolved | type == "number" and . >= 0)
              ' <<<"${controller_seed_summary}" >/dev/null
            controller_seed_source_sha="$(jq -r .source_sha \
              <<<"${controller_seed_summary}")"
            controller_seed_review_id="$(jq -r .review_id \
              <<<"${controller_seed_summary}")"
            controller_seed_check_id="$(jq -r .current_revision_check_id <<<"${controller_seed_summary}")"
            controller_seed_producer_run_id="$(jq -r .current_revision_producer_run_id <<<"${controller_seed_summary}")"

            failure_stage='main-controller-seed-final-rebind'
            final_controller_seed_summary="$(python3 \
              protected-controller-seed/verify.py \
              --repository "${REPOSITORY}" \
              --pull-request "${PR_NUMBER}" \
              --expected-base "${EVENT_BASE}" \
              --expected-head "${EVENT_HEAD}" \
              --workflow-sha "${WORKFLOW_SHA}" \
              --controller-seed)"
            test "${final_controller_seed_summary}" = \
              "${controller_seed_summary}"
            gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=success \
              -f 'output[title]=Protected main controller seed verified' \
              -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; Copilot review ${controller_seed_review_id}; protected source ${controller_seed_source_sha}; protected current-revision check ${controller_seed_check_id}; producer run ${controller_seed_producer_run_id}." \
              >/dev/null
            trap - ERR
            exit 0
          fi

          bootstrap_verified=false
          if [ "${author}" = litroc ] \
            && [ "${base_ref}" = main ] \
            && [ "${head_repository}" = "${REPOSITORY}" ] \
            && [ "${pr_title}" = \
              'fix(rep60): bootstrap protected main review trust root' ]; then
            failure_stage='main-trust-root-bootstrap-classification'
            test "$(jq -r .user.type <<<"${pr}")" = User
            test -n "${CONTROLLER_GH_TOKEN}"
            test -n "${SOURCE_GH_TOKEN}"
            controller_asset="$(GH_TOKEN="${CONTROLLER_GH_TOKEN}" gh api \
              "repos/lightning-it/.github/contents/scripts/verify-main-trust-root-bootstrap.py?ref=${WORKFLOW_SHA}")"
            jq -e \
              --arg path scripts/verify-main-trust-root-bootstrap.py \
              --arg url "${GITHUB_API_URL}/repos/lightning-it/.github/contents/scripts/verify-main-trust-root-bootstrap.py?ref=${WORKFLOW_SHA}" '
                .type == "file"
                and .encoding == "base64"
                and .path == $path
                and .url == $url
                and (.sha | type == "string" and test("^[0-9a-f]{40}$"))
                and ((.size | type) == "number" and .size > 0 and .size < 100000)
                and (.content | type == "string" and length > 0)
              ' <<<"${controller_asset}" >/dev/null
            bootstrap_content="$(jq -er .content <<<"${controller_asset}")"
            bootstrap_blob_sha="$(base64 --decode <<<"${bootstrap_content}" \
              | git hash-object --stdin)"
            test "${bootstrap_blob_sha}" = \
              "$(jq -r .sha <<<"${controller_asset}")"

            set +e
            bootstrap_summary="$(base64 --decode <<<"${bootstrap_content}" \
              | python3 - \
              --repository "${REPOSITORY}" \
              --pull-request "${PR_NUMBER}" \
              --expected-base "${EVENT_BASE}" \
              --expected-head "${EVENT_HEAD}" \
              --workflow-sha "${WORKFLOW_SHA}")"
            bootstrap_status="$?"
            set -e
            if [ "${bootstrap_status}" -eq 0 ]; then
              bootstrap_verified=true
            elif [ "${bootstrap_status}" -ne 3 ]; then
              echo "Protected trust-root bootstrap verification failed." >&2
              exit "${bootstrap_status}"
            fi
          fi

          if [ "${bootstrap_verified}" = true ]; then
            failure_stage='main-trust-root-bootstrap-evidence'
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg workflow "${WORKFLOW_SHA}" \
              --argjson expected_source_blob_paths \
                "${BOOTSTRAP_SOURCE_BLOB_PATHS_JSON}" \
              --argjson pr_number "${PR_NUMBER}" '
                (keys | sort) == ([
                  "base_sha", "candidate_tree_sha", "controller_blob_sha",
                  "head_sha", "producer_run_id", "producer_run_url",
                  "pull_request_number", "review_id", "review_path",
                  "review_submitted_at", "schema", "source_blobs",
                  "source_repository", "source_sha", "source_tree_sha",
                  "threads_resolved", "workflow_sha"
                ] | sort)
                and .schema == "rep60-main-trust-root-bootstrap/v1"
                and .base_sha == $base
                and .head_sha == $head
                and .pull_request_number == $pr_number
                and .workflow_sha == $workflow
                and .review_path
                  == "protected final-head pipeline Copilot trust-root bootstrap"
                and .source_repository == "lightning-it/shared-assets-lit"
                and (.candidate_tree_sha | test("^[0-9a-f]{40}$"))
                and (.controller_blob_sha | test("^[0-9a-f]{40}$"))
                and (.source_sha | test("^[0-9a-f]{40}$"))
                and (.source_tree_sha | test("^[0-9a-f]{40}$"))
                and (.producer_run_id | type == "number" and . > 0)
                and (.review_id | type == "number" and . > 0)
                and (.threads_resolved | type == "number" and . >= 0)
                and (.source_blobs | keys | sort)
                  == ($expected_source_blob_paths | sort)
                and all(.source_blobs[]; test("^[0-9a-f]{40}$"))
              ' <<<"${bootstrap_summary}" >/dev/null
            producer_run_id="$(jq -r .producer_run_id <<<"${bootstrap_summary}")"
            producer_run_url="$(jq -r .producer_run_url <<<"${bootstrap_summary}")"
            review_id="$(jq -r .review_id <<<"${bootstrap_summary}")"
            review_node_id="$(gh api \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews/${review_id}" \
              --jq '.node_id | select(type == "string" and startswith("PRR_"))')"
            develop_sha="$(gh api "repos/${REPOSITORY}/branches/develop" \
              --jq '.commit.sha | select(type == "string" and test("^[0-9a-f]{40}$"))')"
            bootstrap_external_id="mlx90-current-revision:copilot:v6:${PR_NUMBER}:${producer_run_id}:${EVENT_BASE}:${EVENT_HEAD}"
            neutral_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"
            bootstrap_checks="$(jq -c '
              [.[].check_runs[]? | select(.name == "Current revision review")]
            ' <<<"${neutral_pages}")"
            test "$(jq 'length' <<<"${bootstrap_checks}")" -eq 1
            bootstrap_check="$(jq -c '.[0]' <<<"${bootstrap_checks}")"
            bootstrap_check_id="$(jq -er \
              '.id | select(type == "number" and . > 0)' \
              <<<"${bootstrap_check}")"
            bootstrap_check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${bootstrap_check_id}"
            jq -e \
              --arg external_id "${bootstrap_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${bootstrap_check_url}" \
              --argjson check_id "${bootstrap_check_id}" '
                .id == $check_id
                and .name == "Current revision review"
                and .head_sha == $head
                and .external_id == $external_id
                and .details_url == $url
                and .status == "completed"
                and .conclusion == "success"
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .output.title == "Current revision review passed"
                and (.output.summary | type) == "string"
              ' <<<"${bootstrap_check}" >/dev/null
            bootstrap_check_summary="$(jq -er \
              '.output.summary | fromjson | select(type == "object")' \
              <<<"${bootstrap_check}")"
            test "$(jq '.labels | length' <<<"${pr}")" -eq 0
            test "$(jq -r '.last_edited_at // "null"' <<<"${pr}")" = null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg controller "${develop_sha}" \
              --arg head "${EVENT_HEAD}" \
              --arg repository "${REPOSITORY}" \
              --arg review_node_id "${review_node_id}" \
              --arg run_url "${producer_run_url}" \
              --argjson pr_number "${PR_NUMBER}" \
              --argjson producer_run_id "${producer_run_id}" '
                (keys | sort) == ([
                  "base_sha", "controller_ref", "controller_sha",
                  "head_repository", "head_sha", "producer_run_id",
                  "pull_request_labels_sha256",
                  "pull_request_last_edited_at", "pull_request_number",
                  "review_id", "review_path", "run_url", "schema"
                ] | sort)
                and .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .head_repository == $repository
                and .controller_sha == $controller
                and .controller_ref == "develop"
                and .pull_request_number == $pr_number
                and .producer_run_id == $producer_run_id
                and .pull_request_last_edited_at == null
                and .pull_request_labels_sha256
                  == "4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"
                and .review_id == $review_node_id
                and .review_path
                  == "applicable Copilot or governed automation exemption"
                and .run_url == $run_url
              ' <<<"${bootstrap_check_summary}" >/dev/null
            failure_stage='main-trust-root-bootstrap-final-rebind'
            final_bootstrap_summary="$(base64 --decode <<<"${bootstrap_content}" \
              | python3 - \
              --repository "${REPOSITORY}" \
              --pull-request "${PR_NUMBER}" \
              --expected-base "${EVENT_BASE}" \
              --expected-head "${EVENT_HEAD}" \
              --workflow-sha "${WORKFLOW_SHA}")"
            test "${final_bootstrap_summary}" = "${bootstrap_summary}"
            gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=success \
              -f 'output[title]=Protected main trust-root bootstrap verified' \
              -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; Copilot review ${review_id}; producer ${producer_run_url}." \
              >/dev/null
            trap - ERR
            exit 0
          fi

          managed_sync_verified=false
          if [ "${author}" = 'lightning-it-shared-assets-sync[bot]' ] \
            && [ "${central_sync_backmerge}" = false ]; then
            failure_stage='managed-sync-provenance'
            test "${base_ref}" = develop
            test "${head_repository}" = "${REPOSITORY}"
            test "$(jq -r .commits <<<"${pr}")" -eq 1
            target_name="${REPOSITORY#lightning-it/}"
            test -n "${target_name}"
            test "${target_name}" != "${REPOSITORY}"
            jq -e '
              ([.labels[].name] | index("chore") != null)
              and ([.labels[].name] | index("shared-assets-lit") != null)
            ' <<<"${pr}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg bot "${author}" \
              --arg head "${EVENT_HEAD}" '
                .sha == $head
                and (.parents | length) == 1
                and .parents[0].sha == $base
                and .author.login == $bot
                and .author.type == "Bot"
                and .committer.login == $bot
                and .committer.type == "Bot"
                and (.commit.message | type == "string" and length > 0)
              ' <<<"${target_commit}" >/dev/null
            commit_message="$(jq -r .commit.message <<<"${target_commit}")"
            first_line="$(head -n 1 <<<"${commit_message}")"
            source_sha_count="$(awk '
              /^Shared-Assets-Source-SHA: [0-9a-f]{40}$/ { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            source_run_count="$(awk '
              /^Shared-Assets-Source-Run: [1-9][0-9]*$/ { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            source_attempt_count="$(awk '
              /^Shared-Assets-Source-Attempt: [1-9][0-9]*$/ { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            source_app_id_count="$(awk '
              $0 == "Shared-Assets-Sync-App-ID: 4351516" { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            managed_trailer_count="$(awk '
              /^Shared-Assets-/ { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            test "${source_sha_count}" -eq 1
            test "${source_run_count}" -eq 1
            test "${source_app_id_count}" -eq 1
            test "${source_attempt_count}" -le 1
            test "${managed_trailer_count}" -eq $((3 + source_attempt_count))
            source_sha="$(awk '/^Shared-Assets-Source-SHA: / { print $2 }' \
              <<<"${commit_message}")"
            source_run_id="$(awk '/^Shared-Assets-Source-Run: / { print $2 }' \
              <<<"${commit_message}")"
            source_run_attempt=1
            if [ "${source_attempt_count}" -eq 1 ]; then
              source_run_attempt="$(awk \
                '/^Shared-Assets-Source-Attempt: / { print $2 }' \
                <<<"${commit_message}")"
            fi
            [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${source_run_id}" =~ ^[1-9][0-9]*$ ]]
            [[ "${source_run_attempt}" =~ ^[1-9][0-9]*$ ]]
            test -n "${SOURCE_GH_TOKEN}"
            source_run_url="${GITHUB_SERVER_URL}/lightning-it/shared-assets-lit/actions/runs/${source_run_id}"
            source_run="$(GH_TOKEN="${SOURCE_GH_TOKEN}" gh api \
              "repos/lightning-it/shared-assets-lit/actions/runs/${source_run_id}")"
            for ((attempt = 1; attempt <= 42; attempt++)); do
              source_run_status="$(jq -er \
                '.status | select(type == "string" and length > 0)' \
                <<<"${source_run}")"
              if [ "${source_run_status}" = completed ]; then
                break
              fi
              case "${source_run_status}" in
                requested | waiting | pending | queued | in_progress) ;;
                *)
                  echo "The cited source run has an invalid status." >&2
                  exit 1
                  ;;
              esac
              test "${attempt}" -lt 42
              sleep 10
              source_run="$(GH_TOKEN="${SOURCE_GH_TOKEN}" gh api \
                "repos/lightning-it/shared-assets-lit/actions/runs/${source_run_id}")"
            done
            test "$(jq -r .status <<<"${source_run}")" = completed
            current_source_run_attempt="$(jq -er \
              '.run_attempt | select(type == "number" and . >= 1 and floor == .) | floor' \
              <<<"${source_run}")"
            test "${current_source_run_attempt}" -ge "${source_run_attempt}"
            source_path="$(jq -er '.path | select(type == "string" and length > 0)' \
              <<<"${source_run}")"
            case "${source_path}" in
              .github/workflows/sync-repository-quality-repos.yml)
                expected_head_prefix="chore/sync-repository-quality-${target_name}"
                expected_pr_title='chore: sync repository quality assets'
                expected_subject='chore: sync repository quality assets'
                expected_source_job="Sync repository-quality assets to ${target_name}"
                ;;
              .github/workflows/sync-ansible-inventories.yml)
                expected_head_prefix="chore/sync-shared-assets-lit-${target_name}"
