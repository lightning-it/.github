# Organization-owned REP-60 trust root for managed Lightning IT repositories.
# Organization rulesets bind this stable legacy source path and protected main
# ref. The path keeps its historical name so the existing Supplementary gate is
# never interrupted during the organization-wide rollout. Ruleset workflow
# event filters are intentionally omitted because GitHub ignores them and uses
# the supported event's default activity types.
# yamllint disable rule:truthy rule:line-length
---
name: Protected current-revision evidence verifier

run-name: >-
  Protected current revision PR #${{ github.event.pull_request.number }}
  ${{ github.event.action }} ${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: >-
    protected-current-revision-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify-protected-current-revision-evidence:
    # Keep the native Required-Workflow job distinct from the API evidence
    # check it verifies. GitHub Actions check runs share one App identity, so
    # identical names would make the producer target this job instead of its
    # immutable evidence check.
    name: Required current-revision workflow
    permissions:
      actions: read
      checks: write
      contents: read
      # The App binding exists only on the Issues REST representation of a PR
      # comment, so keep this endpoint-specific permission explicit and read-only.
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Verify one protected result for the exact live revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The job environment maps github.repository into REPOSITORY.
          # shellcheck disable=SC2153
          set -euo pipefail
          failure_stage='initialization'
          report_failure_stage() {
            local exit_code="$?"
            if [ "${exit_code}" -ne 0 ]; then
              printf '::error title=REP-60 verifier failed closed::stage=%s\n' \
                "${failure_stage}"
            fi
          }
          trap report_failure_stage EXIT

          failure_stage='protected-source-binding'
          [[ "${REPOSITORY}" =~ ^lightning-it/[A-Za-z0-9_.-]+$ ]]
          target_repository="$(gh api "repos/${REPOSITORY}")"
          jq -e \
            --arg repository "${REPOSITORY}" '
              .full_name == $repository
              and .owner.login == "lightning-it"
              and .archived == false
              and .disabled == false
            ' <<<"${target_repository}" >/dev/null
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          case "${WORKFLOW_REF}" in
            lightning-it/.github/.github/workflows/supplementary-current-revision-required.yml@refs/heads/main)
              source_sha="$(gh api repos/lightning-it/.github/commits/main --jq .sha)"
              [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
              source_compare="$(gh api \
                "repos/lightning-it/.github/compare/${WORKFLOW_SHA}...${source_sha}")"
              jq -e \
                --arg workflow_sha "${WORKFLOW_SHA}" \
                --arg source_sha "${source_sha}" '
                  .base_commit.sha == $workflow_sha
                  and .merge_base_commit.sha == $workflow_sha
                  and (
                    (.status == "identical"
                      and $source_sha == $workflow_sha
                      and .ahead_by == 0
                      and .behind_by == 0
                      and .head_commit == null)
                    or
                    (.status == "ahead"
                      and $source_sha != $workflow_sha
                      and .ahead_by > 0
                      and .behind_by == 0
                      and .head_commit.sha == $source_sha)
                  )
                ' <<<"${source_compare}" >/dev/null
              ;;
            lightning-it/.github/.github/workflows/supplementary-current-revision-required.yml@refs/heads/develop)
              # A .github PR to develop is evaluated by the already-protected
              # base copy, never by its candidate workflow. Bind that special
              # self-hosted controller to both the event base and the live
              # protected develop head. Other repositories remain main-only.
              test "${REPOSITORY}" = lightning-it/.github
              test "${WORKFLOW_SHA}" = "${EVENT_BASE}"
              protected_develop="$(gh api repos/lightning-it/.github/branches/develop)"
              jq -e \
                --arg base "${EVENT_BASE}" '
                  .name == "develop"
                  and .protected == true
                  and .commit.sha == $base
                ' <<<"${protected_develop}" >/dev/null
              source_sha="${EVENT_BASE}"
              ;;
            *)
              echo "Required Workflow source is not a protected controller." >&2
              exit 1
              ;;
          esac

          failure_stage='event-metadata-binding'
          test "${GITHUB_RUN_ATTEMPT}" -eq 1 || test "${GITHUB_RUN_ATTEMPT}" -eq 2
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]

          failure_stage='live-pr-binding'
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .base.sha == $base
              and .head.sha == $head
              and .base.repo.full_name == $repository
              and (.head.repo.full_name | type == "string" and length > 0)
              and (.base.ref == "develop" or .base.ref == "main")
            ' <<<"${pr}" >/dev/null
          base_ref="$(jq -r .base.ref <<<"${pr}")"
          author="$(jq -er '.user.login | select(type == "string" and length > 0)' <<<"${pr}")"
          draft="$(jq -er '.draft | select(type == "boolean") | tostring' <<<"${pr}")"
          head_ref="$(jq -er '.head.ref | select(type == "string" and length > 0)' <<<"${pr}")"
          head_repository="$(jq -er '.head.repo.full_name | select(type == "string" and length > 0)' <<<"${pr}")"
          [[ "${head_repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          failure_stage='live-commit-binding'
          head_commit="$(gh api "repos/${head_repository}/commits/${EVENT_HEAD}")"
          target_commit="$(gh api "repos/${REPOSITORY}/commits/${EVENT_HEAD}")"
          test "$(jq -r .sha <<<"${head_commit}")" = "${EVENT_HEAD}"
          test "$(jq -r .sha <<<"${target_commit}")" = "${EVENT_HEAD}"
          if { [ "${author}" = 'lightning-it-release-automation[bot]' ] \
              || { [ "${REPOSITORY}" = 'lightning-it/.github' ] \
                && [ "${author}" = 'lightning-it-shared-assets-sync[bot]' ]; }; }; then
            test "${head_repository}" = "${REPOSITORY}"
          fi

          failure_stage='reservation-inventory'
          reservation_external_id="rep60-required-workflow:v2:${GITHUB_RUN_ID}:${PR_NUMBER}:${EVENT_HEAD}"
          reservation_name='Protected current-revision verifier'
          reservation_checks="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Protected%20current-revision%20verifier&per_page=100")"
          all_reservations="$(jq -c \
            --arg head "${EVENT_HEAD}" \
            --arg name "${reservation_name}" '
              [.[].check_runs[]? |
                select(.name == $name) |
                select(.app.id == 15368 and .app.slug == "github-actions") |
                select(.head_sha == $head)]
            ' <<<"${reservation_checks}")"
          reservations="$(jq -c \
            --arg prefix 'rep60-required-workflow:v2:' \
            --arg suffix ":${PR_NUMBER}:${EVENT_HEAD}" '
              [.[] |
                select((.external_id | type) == "string") |
                select(.external_id | startswith($prefix) and endswith($suffix))]
            ' <<<"${all_reservations}")"
          if [ "$(jq 'length' <<<"${all_reservations}")" -ne "$(jq 'length' <<<"${reservations}")" ]; then
            echo "A protected verifier reservation for this commit belongs to a different PR/head binding." >&2
            exit 1
          fi
          reservation_count="$(jq 'length' <<<"${reservations}")"
          if [ "${reservation_count}" -gt 1 ]; then
            echo "Multiple protected verifier reservations exist for the same PR/head." >&2
            exit 1
          fi
          failure_stage='reservation-materialization'
          if [ "${reservation_count}" -eq 1 ]; then
            reservation_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${reservations}")"
            prior_external_id="$(jq -er '.[0].external_id | select(type == "string")' <<<"${reservations}")"
            [[ "${prior_external_id}" =~ ^rep60-required-workflow:v2:[1-9][0-9]*:${PR_NUMBER}:${EVENT_HEAD}$ ]]
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is re-evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          else
            reservation="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
              -f name="${reservation_name}" \
              -f head_sha="${EVENT_HEAD}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            reservation_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${reservation}")"
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "in_progress"
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          fi

          finalize_failure() {
            local exit_code="$?"
            trap - ERR
            set +e
            gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=failure \
              -f 'output[title]=Protected current-revision evidence is absent or invalid' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}; stage ${failure_stage}; fail-closed." >/dev/null
            exit "${exit_code}"
          }
          trap finalize_failure ERR

          test "${draft}" = false
          managed_sync_verified=false
          if [ "${author}" = 'lightning-it-shared-assets-sync[bot]' ]; then
            failure_stage='managed-sync-provenance'
            test "${base_ref}" = develop
            test "${head_repository}" = "${REPOSITORY}"
            test "$(jq -r .commits <<<"${pr}")" -eq 1
            target_name="${REPOSITORY#lightning-it/}"
            test -n "${target_name}"
            test "${target_name}" != "${REPOSITORY}"
            jq -e '
              ([.labels[].name] | index("chore") != null)
              and ([.labels[].name] | index("shared-assets-lit") != null)
            ' <<<"${pr}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg bot "${author}" \
              --arg head "${EVENT_HEAD}" '
                .sha == $head
                and (.parents | length) == 1
                and .parents[0].sha == $base
                and .author.login == $bot
                and .author.type == "Bot"
                and .committer.login == $bot
                and .committer.type == "Bot"
                and (.commit.message | type == "string" and length > 0)
              ' <<<"${target_commit}" >/dev/null
            commit_message="$(jq -r .commit.message <<<"${target_commit}")"
            first_line="$(head -n 1 <<<"${commit_message}")"
            source_sha_count="$(awk '
              /^Shared-Assets-Source-SHA: [0-9a-f]{40}$/ { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            source_run_count="$(awk '
              /^Shared-Assets-Source-Run: [1-9][0-9]*$/ { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            source_app_id_count="$(awk '
              $0 == "Shared-Assets-Sync-App-ID: 4351516" { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            managed_trailer_count="$(awk '
              /^Shared-Assets-/ { count++ }
              END { print count + 0 }
            ' <<<"${commit_message}")"
            test "${source_sha_count}" -eq 1
            test "${source_run_count}" -eq 1
            test "${source_app_id_count}" -eq 1
            test "${managed_trailer_count}" -eq 3
            source_sha="$(awk '/^Shared-Assets-Source-SHA: / { print $2 }' \
              <<<"${commit_message}")"
            source_run_id="$(awk '/^Shared-Assets-Source-Run: / { print $2 }' \
              <<<"${commit_message}")"
            [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${source_run_id}" =~ ^[1-9][0-9]*$ ]]
            source_run_url="${GITHUB_SERVER_URL}/lightning-it/shared-assets-lit/actions/runs/${source_run_id}"
            source_run="$(gh api \
              "repos/lightning-it/shared-assets-lit/actions/runs/${source_run_id}")"
            for ((attempt = 1; attempt <= 42; attempt++)); do
              source_run_status="$(jq -er \
                '.status | select(type == "string" and length > 0)' \
                <<<"${source_run}")"
              if [ "${source_run_status}" = completed ]; then
                break
              fi
              case "${source_run_status}" in
                requested | waiting | pending | queued | in_progress) ;;
                *)
                  echo "The cited source run has an invalid status." >&2
                  exit 1
                  ;;
              esac
              test "${attempt}" -lt 42
              sleep 10
              source_run="$(gh api \
                "repos/lightning-it/shared-assets-lit/actions/runs/${source_run_id}")"
            done
            test "$(jq -r .status <<<"${source_run}")" = completed
            source_path="$(jq -er '.path | select(type == "string" and length > 0)' \
              <<<"${source_run}")"
            case "${source_path}" in
              .github/workflows/sync-repository-quality-repos.yml)
                expected_head_ref="chore/sync-repository-quality-${target_name}"
                expected_pr_title='chore: sync repository quality assets'
                expected_subject='chore: sync repository quality assets'
                expected_source_job="Sync repository-quality assets to ${target_name}"
                ;;
              .github/workflows/sync-ansible-inventories.yml)
                expected_head_ref="chore/sync-shared-assets-lit-${target_name}"
                expected_pr_title='chore: sync shared assets'
                expected_subject='chore: sync shared assets from lightning-it/shared-assets-lit'
                expected_source_job="Sync shared assets → ${target_name}"
                ;;
              .github/workflows/sync-ansible-collections.yml | \
              .github/workflows/sync-ee-containers.yml | \
              .github/workflows/sync-playbook-runbook-repos.yml)
                expected_head_ref="chore/sync-shared-assets-lit-${target_name}"
                expected_pr_title='chore: sync shared-assets-lit'
                expected_subject='chore: sync shared assets from lightning-it/shared-assets-lit'
                expected_source_job="Sync shared-assets-lit to ${target_name}"
                ;;
              *)
                echo "The cited source run is not an approved shared-assets distribution workflow." >&2
                exit 1
                ;;
            esac
            test "${head_ref}" = "${expected_head_ref}"
            test "$(jq -r .title <<<"${pr}")" = "${expected_pr_title}"
            test "${first_line}" = "${expected_subject}"
            jq -e \
              --arg head "${source_sha}" \
              --arg path "${source_path}" \
              --arg repository 'lightning-it/shared-assets-lit' \
              --arg run_url "${source_run_url}" \
              --argjson run_id "${source_run_id}" '
                .id == $run_id
                and .event == "push"
                and .head_branch == "main"
                and .head_sha == $head
                and .path == $path
                and .status == "completed"
                and .conclusion == "success"
                and .html_url == $run_url
                and .repository.full_name == $repository
                and .head_repository.full_name == $repository
                and ((.run_attempt | type) == "number")
                and .run_attempt == 1
              ' <<<"${source_run}" >/dev/null
            source_commit="$(gh api \
              "repos/lightning-it/shared-assets-lit/commits/${source_sha}")"
            test "$(jq -r .sha <<<"${source_commit}")" = "${source_sha}"
            source_main="$(gh api \
              repos/lightning-it/shared-assets-lit/branches/main --jq .commit.sha)"
            [[ "${source_main}" =~ ^[0-9a-f]{40}$ ]]
            source_compare="$(gh api \
              "repos/lightning-it/shared-assets-lit/compare/${source_sha}...${source_main}")"
            jq -e \
              --arg source "${source_sha}" \
              --arg current "${source_main}" '
                .base_commit.sha == $source
                and .merge_base_commit.sha == $source
                and (
                  (.status == "identical"
                    and $current == $source
                    and .ahead_by == 0
                    and .behind_by == 0)
                  or
                  (.status == "ahead"
                    and $current != $source
                    and .ahead_by > 0
                    and .behind_by == 0
                    and .head_commit.sha == $current)
                )
              ' <<<"${source_compare}" >/dev/null
            source_jobs="$(gh api \
              "repos/lightning-it/shared-assets-lit/actions/runs/${source_run_id}/jobs?per_page=100")"
            jq -e \
              --arg expected "${expected_source_job}" '
                (.total_count | type == "number" and . > 0 and . <= 100)
                and (.jobs | length) == .total_count
                and ([.jobs[] |
                  select(.name == $expected)
                  | select(.status == "completed" and .conclusion == "success")]
                  | length) == 1
              ' <<<"${source_jobs}" >/dev/null
            target_tree_sha="$(jq -er '
              .commit.tree.sha
              | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<<"${target_commit}")"
            sync_comment_marker='<!-- lit-shared-assets-sync-provenance:v1 -->'
            sync_comment_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
            sync_comments="$(jq -c \
              --arg marker "${sync_comment_marker}" '
                [.[].[]? |
                  select((.body | type) == "string") |
                  select((.body | sub("^[[:space:]]+"; ""))
                    | startswith($marker))]
              ' <<<"${sync_comment_pages}")"
            # Any second marker is ambiguous evidence, even if its payload or
            # actor is invalid. Exactly one marker must exist before validating
            # the App identity and immutable bindings below.
            test "$(jq 'length' <<<"${sync_comments}")" -eq 1
            sync_app_comments="$(jq -c \
              --arg api_url "${GITHUB_API_URL}" \
              --arg base "${EVENT_BASE}" \
              --arg bot "${author}" \
              --arg head "${EVENT_HEAD}" \
              --arg job "${expected_source_job}" \
              --arg marker "${sync_comment_marker}" \
              --arg repository "${REPOSITORY}" \
              --arg run_started "$(jq -r .run_started_at <<<"${source_run}")" \
              --arg run_updated "$(jq -r .updated_at <<<"${source_run}")" \
              --arg run_url "${source_run_url}" \
              --arg source "${source_sha}" \
              --arg source_path "${source_path}" \
              --arg tree "${target_tree_sha}" \
              --arg web_url "${GITHUB_SERVER_URL}" \
              --argjson app_id 4351516 \
              --argjson pr_number "${PR_NUMBER}" \
              --argjson run_id "${source_run_id}" '
                [.[] as $comment |
                  ($comment.body | split("\n")) as $lines |
                  select(($lines | length) == 2) |
                  select($lines[0] == $marker) |
                  ($lines[1] | fromjson?) as $evidence |
                  select($evidence != null) |
                  select($comment.user.login == $bot) |
                  select($comment.user.id == 307342877) |
                  select($comment.user.type == "Bot") |
                  select($comment.performed_via_github_app.id == $app_id) |
                  select($comment.performed_via_github_app.slug
                    == "lightning-it-shared-assets-sync") |
                  select(($comment.id | type) == "number" and $comment.id > 0) |
                  select($comment.url
                    == ($api_url + "/repos/" + $repository
                      + "/issues/comments/" + ($comment.id | tostring))) |
                  select($comment.html_url
                    == ($web_url + "/" + $repository + "/pull/"
                      + ($pr_number | tostring) + "#issuecomment-"
                      + ($comment.id | tostring))) |
                  select($comment.issue_url
                    == ($api_url + "/repos/" + $repository + "/issues/"
                      + ($pr_number | tostring))) |
                  select($comment.created_at == $comment.updated_at) |
                  select(($comment.updated_at | fromdateiso8601)
                    >= ($run_started | fromdateiso8601)) |
                  select(($comment.updated_at | fromdateiso8601)
                    <= ($run_updated | fromdateiso8601)) |
                  select(($evidence | keys) == [
                    "app_id",
                    "schema",
                    "source_job",
                    "source_repository",
                    "source_run_id",
                    "source_run_url",
                    "source_sha",
                    "source_workflow",
                    "target_base_sha",
                    "target_head_sha",
                    "target_pr",
                    "target_repository",
                    "target_tree_sha"
                  ]) |
                  select($evidence.schema
                    == "lit-shared-assets-sync-provenance/v1") |
                  select($evidence.app_id == $app_id) |
                  select($evidence.source_repository
                    == "lightning-it/shared-assets-lit") |
                  select($evidence.source_sha == $source) |
                  select($evidence.source_run_id == $run_id) |
                  select($evidence.source_run_url == $run_url) |
                  select($evidence.source_workflow == $source_path) |
                  select($evidence.source_job == $job) |
                  select($evidence.target_repository == $repository) |
                  select($evidence.target_pr == $pr_number) |
                  select($evidence.target_base_sha == $base) |
                  select($evidence.target_head_sha == $head) |
                  select($evidence.target_tree_sha == $tree) |
                  $comment]
              ' <<<"${sync_comments}")"
            test "$(jq 'length' <<<"${sync_app_comments}")" -eq 1
            producer_run_url="${source_run_url}"
            managed_sync_verified=true
          fi

          if [ "${managed_sync_verified}" = false ]; then
            failure_stage='permanent-producer-inventory'
          neutral_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&filter=all&per_page=100")"
          neutral="$(jq -c '
            [.[].check_runs[]? |
              select(.name == "Current revision review") |
              select((.external_id | type) == "string") |
              select(
                (.external_id | startswith("mlx90-current-revision:v4:"))
                or (.external_id | startswith("mlx90-current-revision:copilot:v5:"))
                or (.external_id | startswith("mlx90-current-revision:ancestry-backmerge:v5:"))
                or (.external_id | startswith("mlx90-current-revision:copilot:v6:"))
                or (.external_id | startswith("mlx90-current-revision:ancestry-backmerge:v6:"))
              )]
          ' <<<"${neutral_pages}")"
          test "$(jq 'length' <<<"${neutral}")" -eq 1
          check="$(jq -c '.[0]' <<<"${neutral}")"
          jq -e '
            .app.id == 15368
            and .app.slug == "github-actions"
            and .status == "completed"
            and .conclusion == "success"
          ' <<<"${check}" >/dev/null
          check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${check}")"
          details_url="$(jq -r '.details_url // empty' <<<"${check}")"
          test "${details_url}" = "${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
          external_id="$(jq -r '.external_id // empty' <<<"${check}")"
          summary="$(jq -r '.output.summary // empty' <<<"${check}")"
          test -n "${summary}"
          failure_stage='permanent-producer-binding'
          if [ "${author}" = 'lightning-it-release-automation[bot]' ] \
            && [[ "${external_id}" =~ ^mlx90-current-revision:v4: ]]; then
            [[ "${external_id}" =~ ^mlx90-current-revision:v4:([1-9][0-9]*):[0-9a-f]{64}$ ]]
            producer_run_id="${BASH_REMATCH[1]}"
            expected_title="Exact-Revision Codex PR #${PR_NUMBER} ${EVENT_BASE}..${EVENT_HEAD}"
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
            producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            jq -e \
              --arg actor "${author}" \
              --arg base_ref "${base_ref}" \
              --arg base_sha "${EVENT_BASE}" \
              --arg run_url "${producer_run_url}" \
              --arg title "${expected_title}" '
                .event == "workflow_dispatch"
                and .status == "completed"
                and .conclusion == "success"
                and .head_branch == $base_ref
                and .head_sha == $base_sha
                and .path == ".github/workflows/release-bot-exact-head-review.yml"
                and .display_title == $title
                and .html_url == $run_url
                and .actor.login == $actor
                and .triggering_actor.login == $actor
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and (.merge_base_sha | test("^[0-9a-f]{40}$"))
                and (.integration_tree_sha | test("^[0-9a-f]{40}$"))
                and (.diff_sha256 | test("^[0-9a-f]{64}$"))
                and (.input_sha256 | test("^[0-9a-f]{64}$"))
              ' <<<"${summary}" >/dev/null
          else
            if [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|ancestry-backmerge):v6:${PR_NUMBER}:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]; then
              producer_kind="${BASH_REMATCH[1]}"
              producer_run_id="${BASH_REMATCH[2]}"
            else
              # Keep v5 valid only for already-open pull requests during the
              # atomic producer/verifier rollout. Exact-one inventory above
              # prevents v5 and v6 from satisfying the gate together.
              [[ "${external_id}" =~ ^mlx90-current-revision:(copilot|ancestry-backmerge):v5:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]
              producer_kind="${BASH_REMATCH[1]}"
              producer_run_id="${BASH_REMATCH[2]}"
            fi
            if { [ "${author}" = 'lightning-it-release-automation[bot]' ] \
                || { [ "${REPOSITORY}" = 'lightning-it/.github' ] \
                  && [ "${author}" = 'lightning-it-shared-assets-sync[bot]' ]; }; }; then
              test "${producer_kind}" = ancestry-backmerge
              test "${base_ref}" = develop
              [[ "${head_ref}" == backmerge/*-main ]]
              [[ "$(jq -r .title <<<"${pr}")" == \
                "chore(governance): record main ancestry before "* ]]
              expected_review_path="deterministic evidence-bound ancestry exemption"
            else
              test "${producer_kind}" = copilot
              expected_review_path="applicable Copilot or governed automation exemption"
            fi
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
            producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            controller_sha="$(jq -er '.controller_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              <<<"${summary}")"
            # pull_request_target always runs the protected default-branch
            # controller. PR base_ref remains independently valid as main or
            # develop and is already bound to EVENT_BASE above.
            controller_branch="$(jq -er \
              '.default_branch | select(type == "string" and length > 0)' \
              <<<"${target_repository}")"
            controller_branch_uri="$(jq -rn \
              --arg value "${controller_branch}" '$value | @uri')"
            test -n "${controller_branch_uri}"
            controller_head="$(gh api \
              "repos/${REPOSITORY}/branches/${controller_branch_uri}" --jq .commit.sha)"
            [[ "${controller_head}" =~ ^[0-9a-f]{40}$ ]]
            controller_ancestry="$(gh api \
              "repos/${REPOSITORY}/compare/${controller_sha}...${controller_head}")"
            jq -e \
              --arg controller "${controller_sha}" '
                .status == "identical"
                or (.status == "ahead" and .behind_by == 0
                    and .merge_base_commit.sha == $controller)
              ' <<<"${controller_ancestry}" >/dev/null
            jq -e \
              --arg actor "${author}" \
              --arg head_ref "${head_ref}" \
              --arg head_sha "${EVENT_HEAD}" '
              .event == "pull_request_target"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/copilot-review.yml"
              and .name == "Current revision review gate"
              and .head_branch == $head_ref
              and .head_sha == $head_sha
              and .actor.login == $actor
              and .triggering_actor.login == $actor
            ' <<<"${producer}" >/dev/null
            jq -e \
              --arg run_url "${producer_run_url}" '
                .html_url == $run_url
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg controller "${controller_sha}" \
              --arg head "${EVENT_HEAD}" \
              --arg review_path "${expected_review_path}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .controller_sha == $controller
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and .review_path == $review_path
              ' <<<"${summary}" >/dev/null
          fi

          fi

          failure_stage='permanent-finalization'
          gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Protected current-revision evidence verified' \
            -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; producer ${producer_run_url}." >/dev/null
          trap - ERR
