# Organization-owned REP-60 trust root for the public Supplementary repository.
# An organization ruleset binds this exact public source path and protected main
# ref. Ruleset workflow event filters are intentionally omitted because GitHub
# ignores them and uses the supported event's default activity types.
# yamllint disable rule:truthy rule:line-length
---
name: Protected Supplementary current-revision evidence verifier

run-name: >-
  Protected current revision PR #${{ github.event.pull_request.number }}
  ${{ github.event.action }} ${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: >-
    protected-current-revision-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify-protected-current-revision-evidence:
    name: Verify protected current-revision evidence
    if: github.repository == 'lightning-it/ansible-collection-supplementary'
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ github.repository }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Verify one protected result for the exact live revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The job environment maps github.repository into REPOSITORY.
          # shellcheck disable=SC2153
          set -euo pipefail
          failure_stage='initialization'
          report_failure_stage() {
            local exit_code="$?"
            if [ "${exit_code}" -ne 0 ]; then
              printf '::error title=REP-60 verifier failed closed::stage=%s\n' \
                "${failure_stage}"
            fi
          }
          trap report_failure_stage EXIT

          failure_stage='protected-source-binding'
          test "${REPOSITORY}" = lightning-it/ansible-collection-supplementary
          test "${WORKFLOW_REF}" = \
            'lightning-it/.github/.github/workflows/supplementary-current-revision-required.yml@refs/heads/main'
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          source_sha="$(gh api repos/lightning-it/.github/commits/main --jq .sha)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          source_compare="$(gh api \
            "repos/lightning-it/.github/compare/${WORKFLOW_SHA}...${source_sha}")"
          jq -e \
            --arg workflow_sha "${WORKFLOW_SHA}" \
            --arg source_sha "${source_sha}" '
              .base_commit.sha == $workflow_sha
              and .merge_base_commit.sha == $workflow_sha
              and (
                (.status == "identical"
                  and $source_sha == $workflow_sha
                  and .ahead_by == 0
                  and .behind_by == 0
                  and .head_commit == null)
                or
                (.status == "ahead"
                  and $source_sha != $workflow_sha
                  and .ahead_by > 0
                  and .behind_by == 0
                  and .head_commit.sha == $source_sha)
              )
            ' <<<"${source_compare}" >/dev/null

          failure_stage='event-metadata-binding'
          test "${GITHUB_RUN_ATTEMPT}" -eq 1 || test "${GITHUB_RUN_ATTEMPT}" -eq 2
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]

          failure_stage='live-pr-binding'
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg repository "${REPOSITORY}" '
              .state == "open"
              and .base.sha == $base
              and .head.sha == $head
              and .base.repo.full_name == $repository
              and (.head.repo.full_name | type == "string" and length > 0)
              and (.base.ref == "develop" or .base.ref == "main")
            ' <<<"${pr}" >/dev/null
          base_ref="$(jq -r .base.ref <<<"${pr}")"
          author="$(jq -er '.user.login | select(type == "string" and length > 0)' <<<"${pr}")"
          draft="$(jq -er '.draft | select(type == "boolean") | tostring' <<<"${pr}")"
          head_ref="$(jq -er '.head.ref | select(type == "string" and length > 0)' <<<"${pr}")"
          head_repository="$(jq -er '.head.repo.full_name | select(type == "string" and length > 0)' <<<"${pr}")"
          [[ "${head_repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          failure_stage='live-commit-binding'
          head_commit="$(gh api "repos/${head_repository}/commits/${EVENT_HEAD}")"
          target_commit="$(gh api "repos/${REPOSITORY}/commits/${EVENT_HEAD}")"
          test "$(jq -r .sha <<<"${head_commit}")" = "${EVENT_HEAD}"
          test "$(jq -r .sha <<<"${target_commit}")" = "${EVENT_HEAD}"
          if [ "${author}" = 'lightning-it-release-automation[bot]' ]; then
            test "${head_repository}" = "${REPOSITORY}"
          fi

          failure_stage='reservation-inventory'
          reservation_external_id="rep60-required-workflow:v2:${GITHUB_RUN_ID}:${PR_NUMBER}:${EVENT_HEAD}"
          reservation_name='Protected current-revision verifier'
          reservation_checks="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Protected%20current-revision%20verifier&per_page=100")"
          all_reservations="$(jq -c \
            --arg head "${EVENT_HEAD}" \
            --arg name "${reservation_name}" '
              [.[].check_runs[]? |
                select(.name == $name) |
                select(.app.id == 15368 and .app.slug == "github-actions") |
                select(.head_sha == $head)]
            ' <<<"${reservation_checks}")"
          reservations="$(jq -c \
            --arg prefix 'rep60-required-workflow:v2:' \
            --arg suffix ":${PR_NUMBER}:${EVENT_HEAD}" '
              [.[] |
                select((.external_id | type) == "string") |
                select(.external_id | startswith($prefix) and endswith($suffix))]
            ' <<<"${all_reservations}")"
          if [ "$(jq 'length' <<<"${all_reservations}")" -ne "$(jq 'length' <<<"${reservations}")" ]; then
            echo "A protected verifier reservation for this commit belongs to a different PR/head binding." >&2
            exit 1
          fi
          reservation_count="$(jq 'length' <<<"${reservations}")"
          if [ "${reservation_count}" -gt 1 ]; then
            echo "Multiple protected verifier reservations exist for the same PR/head." >&2
            exit 1
          fi
          failure_stage='reservation-materialization'
          if [ "${reservation_count}" -eq 1 ]; then
            reservation_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${reservations}")"
            prior_external_id="$(jq -er '.[0].external_id | select(type == "string")' <<<"${reservations}")"
            [[ "${prior_external_id}" =~ ^rep60-required-workflow:v2:[1-9][0-9]*:${PR_NUMBER}:${EVENT_HEAD}$ ]]
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is re-evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          else
            reservation="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
              -f name="${reservation_name}" \
              -f head_sha="${EVENT_HEAD}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            reservation_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${reservation}")"
            reservation_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${reservation_id}"
            reservation="$(gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=in_progress \
              -f external_id="${reservation_external_id}" \
              -f "details_url=${reservation_url}" \
              -f 'output[title]=Protected verifier is evaluating the live revision' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}.")"
            jq -e \
              --arg external_id "${reservation_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${reservation_url}" \
              --argjson check_id "${reservation_id}" '
                .id == $check_id
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "in_progress"
                and .app.id == 15368
                and .app.slug == "github-actions"
              ' <<<"${reservation}" >/dev/null
          fi

          finalize_failure() {
            local exit_code="$?"
            trap - ERR
            set +e
            gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=failure \
              -f 'output[title]=Protected current-revision evidence is absent or invalid' \
              -f "output[summary]=PR #${PR_NUMBER}; head ${EVENT_HEAD}; stage ${failure_stage}; fail-closed." >/dev/null
            exit "${exit_code}"
          }
          trap finalize_failure ERR

          failure_stage='producer-evidence-selection'
          # One immutable transition is needed because the first main promotion
          # carries the protected v4 producer that future Release-App PRs use.
          # The exception is deliberately exact (PR, base, head, merge, tree,
          # source PR, and controller blobs), contains no AI call, and is removed
          # immediately after PR #777 reaches main. It is not MLX-90 acceptance
          # evidence and cannot match any later revision.
          if [ "${PR_NUMBER}" = 777 ] \
            && [ "${EVENT_BASE}" = 01afb46890e6d7ac6008e8ed478aa6af91e1b19b ] \
            && [ "${EVENT_HEAD}" = 7a6cadc2c1048daec4a69ff0f71441b6ff257416 ]; then
            test "${GITHUB_ACTOR}" = 'lightning-it-release-automation[bot]'
            test "${GITHUB_TRIGGERING_ACTOR}" = 'lightning-it-release-automation[bot]'
            test "${draft}" = false
            test "${author}" = 'lightning-it-release-automation[bot]'
            test "${base_ref}" = main
            test "${head_repository}" = "${REPOSITORY}"

            failure_stage='transition-static-provenance'
            jq -e '
              .sha == "7a6cadc2c1048daec4a69ff0f71441b6ff257416"
              and .commit.tree.sha == "7c19ce8303b313b2911e2f8abd075a7b5b2fecd6"
              and .commit.verification.verified == true
              and .commit.verification.reason == "valid"
              and .author.login == "litroc"
              and .committer.login == "web-flow"
              and [.parents[].sha] == [
                "b6c40eb461dd858d26d38d0ddfba2bde3afe4108",
                "be17b987bf1e00e4b5b68f160274ee635e776e2c"
              ]
              and .commit.message == "Merge pull request #759 from lightning-it/agent/mlx90-exact-revision-codex-pilot-20260816\n\nfix(mlx90): enforce pipeline-only current-revision review"
            ' <<<"${target_commit}" >/dev/null

            source_pr="$(gh api "repos/${REPOSITORY}/pulls/759")"
            jq -e '
              .number == 759
              and .state == "closed"
              and .merged == true
              and .user.login == "litroc"
              and .merged_by.login == "litroc"
              and .base.ref == "develop"
              and .base.sha == "b6c40eb461dd858d26d38d0ddfba2bde3afe4108"
              and .head.ref == "agent/mlx90-exact-revision-codex-pilot-20260816"
              and .head.sha == "be17b987bf1e00e4b5b68f160274ee635e776e2c"
              and .merge_commit_sha == "7a6cadc2c1048daec4a69ff0f71441b6ff257416"
              and .title == "fix(mlx90): enforce pipeline-only current-revision review"
            ' <<<"${source_pr}" >/dev/null

            compare="$(gh api \
              "repos/${REPOSITORY}/compare/${EVENT_BASE}...${EVENT_HEAD}")"
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" '
                .status == "ahead"
                and .behind_by == 0
                and .ahead_by == 62
                and .total_commits == 62
                and (.commits | length) == 62
                and .base_commit.sha == $base
                and .merge_base_commit.sha == $base
                and .commits[-1].sha == $head
              ' <<<"${compare}" >/dev/null

            verify_blob() {
              local file_name="$1" expected_blob="$2" observed_blob
              observed_blob="$(gh api \
                "repos/${REPOSITORY}/contents/${file_name}?ref=${EVENT_HEAD}" \
                --jq .sha)"
              test "${observed_blob}" = "${expected_blob}"
            }
            verify_blob \
              .github/workflows/copilot-review.yml \
              47a6579c29beb9a8cb452da7f3715fb50c6c7933
            verify_blob \
              .github/workflows/release-bot-exact-head-review.yml \
              4332028591a4f251f213b6aba35106ea95c4ac01
            verify_blob \
              .github/workflows/current-revision-rerun.yml \
              22ceb959bcafdc1a2c215261b2622c8aa1fc743d
            verify_blob \
              scripts/materialize-exact-revision-review.py \
              f394a820a9c0922d8e7187dbd1b8aca3bf13db61

            failure_stage='transition-ai-absence'
            review_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            jq -e '
              all(.[][]?;
                (.user.login | type == "string" and length > 0)
                and .user.login != "copilot-pull-request-reviewer[bot]"
                and .user.login != "github-copilot[bot]")
            ' <<<"${review_pages}" >/dev/null
            exact_check_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Protected%20Exact-Revision%20Codex%20result&per_page=100")"
            exact_checks="$(jq -c '
              [.[].check_runs[]? |
                select(.name == "Protected Exact-Revision Codex result")]
            ' <<<"${exact_check_pages}")"
            test "$(jq 'length' <<<"${exact_checks}")" -eq 0
            transition_summary="$(jq -cn \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg source_pr_url "${GITHUB_SERVER_URL}/${REPOSITORY}/pull/759" \
              --arg transition_pr_url "${GITHUB_SERVER_URL}/${REPOSITORY}/pull/${PR_NUMBER}" \
              --arg verifier_run_url "${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '
                {
                  schema: 1,
                  temporary: true,
                  acceptance_evidence: false,
                  review_path: "immutable one-time controller bootstrap; no AI",
                  base_sha: $base,
                  head_sha: $head,
                  source_pr_url: $source_pr_url,
                  transition_pr_url: $transition_pr_url,
                  verifier_run_url: $verifier_run_url
                }
              ')"
            transition_external_id="rep60-main-bootstrap:v1:${GITHUB_RUN_ID}:${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}"
            transition_title='One-time immutable main-controller bootstrap verified'
            failure_stage='transition-neutral-check'
            neutral_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&per_page=100")"
            neutral_checks="$(jq -c '
              [.[].check_runs[]? | select(.name == "Current revision review")]
            ' <<<"${neutral_pages}")"
            neutral_count="$(jq 'length' <<<"${neutral_checks}")"
            if [ "${neutral_count}" -gt 1 ]; then
              echo "Multiple neutral review checks exist for the immutable transition head." >&2
              exit 1
            fi
            if [ "${neutral_count}" -eq 1 ]; then
              transition_check="$(jq -c '.[0]' <<<"${neutral_checks}")"
              jq -e \
                --arg evidence "${transition_summary}" \
                --arg external_id "${transition_external_id}" \
                --arg head "${EVENT_HEAD}" \
                --arg title "${transition_title}" '
                  .name == "Current revision review"
                  and .head_sha == $head
                  and .external_id == $external_id
                  and .status == "completed"
                  and .conclusion == "success"
                  and .app.id == 15368
                  and .app.slug == "github-actions"
                  and .output.title == $title
                  and .output.summary == $evidence
                ' <<<"${transition_check}" >/dev/null
              transition_check_id="$(jq -er '.id | select(type == "number" and . > 0)' \
                <<<"${transition_check}")"
            else
              transition_check="$(gh api --method POST \
                "repos/${REPOSITORY}/check-runs" \
                -f name='Current revision review' \
                -f head_sha="${EVENT_HEAD}" \
                -f status=completed \
                -f conclusion=success \
                -f external_id="${transition_external_id}" \
                -f "output[title]=${transition_title}" \
                -f "output[summary]=${transition_summary}")"
              transition_check_id="$(jq -er '.id | select(type == "number" and . > 0)' \
                <<<"${transition_check}")"
            fi
            transition_check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${transition_check_id}"
            transition_check="$(gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${transition_check_id}" \
              -f status=completed \
              -f conclusion=success \
              -f external_id="${transition_external_id}" \
              -f "details_url=${transition_check_url}" \
              -f "output[title]=${transition_title}" \
              -f "output[summary]=${transition_summary}")"
            jq -e \
              --arg evidence "${transition_summary}" \
              --arg external_id "${transition_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg title "${transition_title}" \
              --arg url "${transition_check_url}" \
              --argjson check_id "${transition_check_id}" '
                .id == $check_id
                and .name == "Current revision review"
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "completed"
                and .conclusion == "success"
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .output.title == $title
                and .output.summary == $evidence
              ' <<<"${transition_check}" >/dev/null

            failure_stage='transition-finalization'
            gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=success \
              -f 'output[title]=Immutable one-time main-controller bootstrap verified' \
              -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; no AI; not acceptance evidence." \
              >/dev/null
            trap - ERR
            exit 0
          fi

          # One exact protected transition repairs the human producer's
          # pull_request_target run-metadata binding. GitHub reports the event
          # PR branch and revision in Actions run head_branch/head_sha; the
          # independently protected workflow_ref/workflow_sha remain the
          # controller provenance. This transition accepts only PR #780's
          # immutable five-blob change after one real exact-head Copilot review
          # with no unresolved Copilot thread. Remove it after PR #780 merges.
          if [ "${PR_NUMBER}" = 780 ] \
            && [ "${EVENT_BASE}" = 80464dc3ea21c01ee5fd32e6e49675b0dfa5a513 ] \
            && [ "${EVENT_HEAD}" = c74faddfa9955f6d8d4b27a074df3ebc664236d7 ]; then
            test "${GITHUB_ACTOR}" = litroc
            test "${GITHUB_TRIGGERING_ACTOR}" = litroc
            test "${draft}" = false
            test "${author}" = litroc
            test "${base_ref}" = develop
            test "${head_ref}" = fix/rep60-rearm-protected-environment-20260817
            test "${head_repository}" = "${REPOSITORY}"

            failure_stage='human-transition-static-provenance'
            jq -e '
              .sha == "c74faddfa9955f6d8d4b27a074df3ebc664236d7"
              and .commit.tree.sha == "7e043c4ee90e62ce6c880935117c64105042d063"
              and .commit.verification.verified == false
              and .commit.verification.reason == "unsigned"
              and .author.login == "litroc"
              and .committer.login == "litroc"
              and [.parents[].sha] == [
                "7979767770cee1951df4772b3f82a3b7090c3582"
              ]
              and .commit.message == "fix(rep60): accept asynchronous review requests"
            ' <<<"${target_commit}" >/dev/null

            source_pr="$(gh api "repos/${REPOSITORY}/pulls/780")"
            jq -e \
              --arg repository "${REPOSITORY}" '
                .number == 780
                and .state == "open"
                and .draft == false
                and .user.login == "litroc"
                and .base.ref == "develop"
                and .base.sha == "80464dc3ea21c01ee5fd32e6e49675b0dfa5a513"
                and .base.repo.full_name == $repository
                and .head.ref == "fix/rep60-rearm-protected-environment-20260817"
                and .head.sha == "c74faddfa9955f6d8d4b27a074df3ebc664236d7"
                and .head.repo.full_name == $repository
                and .title == "fix(rep60): use protected rearm environment"
              ' <<<"${source_pr}" >/dev/null

            compare="$(gh api \
              "repos/${REPOSITORY}/compare/${EVENT_BASE}...${EVENT_HEAD}")"
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" '
                .status == "ahead"
                and .behind_by == 0
                and .ahead_by == 2
                and .total_commits == 2
                and (.commits | length) == 2
                and .base_commit.sha == $base
                and .merge_base_commit.sha == $base
                and .commits[0].sha == "7979767770cee1951df4772b3f82a3b7090c3582"
                and .commits[1].sha == $head
              ' <<<"${compare}" >/dev/null

            source_files="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/780/files?per_page=100")"
            jq -e '
              [.[].[] |
                {filename, status, sha, additions, deletions, changes}]
              | sort_by(.filename)
              == [
                {
                  filename: ".github/workflows/copilot-review.yml",
                  status: "modified",
                  sha: "c605c6eea57d1bd679fbae7621b68c0dcafc4c76",
                  additions: 7,
                  deletions: 24,
                  changes: 31
                },
                {
                  filename: ".github/workflows/rep60-bootstrap-app-rearm.yml",
                  status: "modified",
                  sha: "bb60842524d15e6a296f24c7733b6f55877bae38",
                  additions: 1,
                  deletions: 1,
                  changes: 2
                },
                {
                  filename: "tests/unit/test_exact_revision_review.py",
                  status: "modified",
                  sha: "8d17aa893612e06bb7c2a26f2d39d0f54f72bf17",
                  additions: 8,
                  deletions: 0,
                  changes: 8
                },
                {
                  filename: "tests/unit/test_rep60_bootstrap_app_rearm.py",
                  status: "modified",
                  sha: "958b6832f109580642c7641027a2eac8b297db01",
                  additions: 2,
                  deletions: 0,
                  changes: 2
                },
                {
                  filename: "tests/unit/test_workflow_security.py",
                  status: "modified",
                  sha: "d3e38bb335401bdcb72e3599b2222f4b36e3060f",
                  additions: 6,
                  deletions: 5,
                  changes: 11
                }
              ]
            ' <<<"${source_files}" >/dev/null

            failure_stage='human-transition-review'
            review_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            accepted_reviews="$(jq -c \
              --arg head "${EVENT_HEAD}" '
                def normalized:
                  ascii_downcase
                  | gsub("wasn[\u0027\u2019]t"; "was not")
                  | gsub("\\s"; "");
                [.[].[] |
                  select(
                    (.user.login == "copilot-pull-request-reviewer[bot]"
                     or .user.login == "copilot-pull-request-reviewer")
                    and .commit_id == $head
                    and (.state == "COMMENTED" or .state == "APPROVED")
                    and ((.body // "") | gsub("\\s"; "") | length > 0)
                    and (((.body // "") | normalized | contains("wasnotabletoreviewanyfiles")) | not)
                    and (((.body // "") | normalized | contains("unabletoreviewthispullrequest")) | not)
                    and (((.body // "") | normalized | contains("quotaexhausted")) | not)
                    and (((.body // "") | normalized | contains("quotaexceeded")) | not)
                    and (((.body // "") | normalized | contains("encounteredanerror")) | not)
                  )]
              ' <<<"${review_pages}")"
            test "$(jq 'length' <<<"${accepted_reviews}")" -eq 1
            review_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' \
              <<<"${accepted_reviews}")"

            # GraphQL variable names must remain literal for gh.
            # shellcheck disable=SC2016
            thread_query='query($owner:String!,$repository:String!,$number:Int!,$after:String) {
              repository(owner:$owner,name:$repository) {
                pullRequest(number:$number) {
                  headRefOid
                  reviewThreads(first:100,after:$after) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      isResolved
                      comments(first:1) { nodes { author { login } } }
                    }
                  }
                }
              }
            }'

            owner="${REPOSITORY%%/*}"
            repository="${REPOSITORY#*/}"
            after=""
            unresolved=0
            while true; do
              arguments=(
                -f query="${thread_query}"
                -F owner="${owner}"
                -F repository="${repository}"
                -F number="${PR_NUMBER}"
              )
              if [ -n "${after}" ]; then
                arguments+=(-f after="${after}")
              fi
              response="$(gh api graphql "${arguments[@]}")"
              jq -e --arg head "${EVENT_HEAD}" \
                '.data.repository.pullRequest.headRefOid == $head' \
                <<<"${response}" >/dev/null
              page_unresolved="$(jq '
                [.data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false)
                  | select(
                      .comments.nodes[0].author.login == "copilot-pull-request-reviewer[bot]"
                      or .comments.nodes[0].author.login == "copilot-pull-request-reviewer"
                    )]
                | length
              ' <<<"${response}")"
              unresolved=$((unresolved + page_unresolved))
              has_next="$(jq -r \
                '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' \
                <<<"${response}")"
              if [ "${has_next}" != true ]; then
                break
              fi
              after="$(jq -er \
                '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor
                 | select(type == "string" and length > 0)' \
                <<<"${response}")"
            done
            test "${unresolved}" -eq 0

            post_review_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg repository "${REPOSITORY}" '
                .state == "open"
                and .draft == false
                and .user.login == "litroc"
                and .base.ref == "develop"
                and .base.sha == $base
                and .base.repo.full_name == $repository
                and .head.ref == "fix/rep60-rearm-protected-environment-20260817"
                and .head.sha == $head
                and .head.repo.full_name == $repository
              ' <<<"${post_review_pr}" >/dev/null

            transition_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            transition_summary="$(jq -cn \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg transition_run_url "${transition_run_url}" \
              --arg workflow_sha "${WORKFLOW_SHA}" \
              --argjson review_id "${review_id}" \
              --argjson run_id "${GITHUB_RUN_ID}" '
                {
                  schema: 1,
                  temporary: true,
                  acceptance_evidence: true,
                  review_path: "exact current-head Copilot review",
                  base_sha: $base,
                  head_sha: $head,
                  review_id: $review_id,
                  producer_run_id: $run_id,
                  run_url: $transition_run_url,
                  workflow_sha: $workflow_sha
                }
              ')"
            transition_external_id="rep60-human-provenance-transition:v1:${GITHUB_RUN_ID}:${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}"
            transition_title='Exact human producer transition reviewed'
            failure_stage='human-transition-neutral-check'
            neutral_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&per_page=100")"
            neutral_checks="$(jq -c '
              [.[].check_runs[]? | select(.name == "Current revision review")]
            ' <<<"${neutral_pages}")"
            neutral_count="$(jq 'length' <<<"${neutral_checks}")"
            if [ "${neutral_count}" -gt 1 ]; then
              echo "Multiple neutral review checks exist for the immutable human transition head." >&2
              exit 1
            fi
            if [ "${neutral_count}" -eq 1 ]; then
              transition_check="$(jq -c '.[0]' <<<"${neutral_checks}")"
              transition_check_id="$(jq -er '.id | select(type == "number" and . > 0)' \
                <<<"${transition_check}")"
              existing_check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${transition_check_id}"
              if jq -e \
                --arg evidence "${transition_summary}" \
                --arg external_id "${transition_external_id}" \
                --arg head "${EVENT_HEAD}" \
                --arg title "${transition_title}" \
                --arg url "${existing_check_url}" '
                  .name == "Current revision review"
                  and .head_sha == $head
                  and .details_url == $url
                  and .external_id == $external_id
                  and .status == "completed"
                  and .conclusion == "success"
                  and .app.id == 15368
                  and .app.slug == "github-actions"
                  and .output.title == $title
                  and .output.summary == $evidence
                ' <<<"${transition_check}" >/dev/null; then
                :
              else
                prior_external_id="mlx90-current-revision:copilot:v4:32077652920:${EVENT_BASE}:${EVENT_HEAD}"
                jq -e \
                  --arg external_id "${prior_external_id}" \
                  --arg head "${EVENT_HEAD}" \
                  --arg url "${existing_check_url}" '
                    .name == "Current revision review"
                    and .head_sha == $head
                    and .details_url == $url
                    and .external_id == $external_id
                    and .status == "completed"
                    and .conclusion == "success"
                    and .app.id == 15368
                    and .app.slug == "github-actions"
                    and .output.title == "Current revision review passed"
                  ' <<<"${transition_check}" >/dev/null
                prior_summary="$(jq -er '.output.summary | fromjson | select(type == "object")' \
                  <<<"${transition_check}")"
                jq -e \
                  --arg base "${EVENT_BASE}" \
                  --arg controller "${EVENT_BASE}" \
                  --arg head "${EVENT_HEAD}" \
                  --arg run_url "${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/32077652920" '
                    .schema == 4
                    and .base_sha == $base
                    and .head_sha == $head
                    and .controller_sha == $controller
                    and .producer_run_id == 32077652920
                    and .run_url == $run_url
                    and .review_path == "applicable Copilot or governed automation exemption"
                  ' <<<"${prior_summary}" >/dev/null
              fi
            else
              transition_check="$(gh api --method POST \
                "repos/${REPOSITORY}/check-runs" \
                -f name='Current revision review' \
                -f head_sha="${EVENT_HEAD}" \
                -f status=completed \
                -f conclusion=success \
                -f external_id="${transition_external_id}" \
                -f "output[title]=${transition_title}" \
                -f "output[summary]=${transition_summary}")"
              transition_check_id="$(jq -er '.id | select(type == "number" and . > 0)' \
                <<<"${transition_check}")"
            fi
            transition_check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${transition_check_id}"
            transition_check="$(gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${transition_check_id}" \
              -f status=completed \
              -f conclusion=success \
              -f external_id="${transition_external_id}" \
              -f "details_url=${transition_check_url}" \
              -f "output[title]=${transition_title}" \
              -f "output[summary]=${transition_summary}")"
            jq -e \
              --arg evidence "${transition_summary}" \
              --arg external_id "${transition_external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg title "${transition_title}" \
              --arg url "${transition_check_url}" \
              --argjson check_id "${transition_check_id}" '
                .id == $check_id
                and .name == "Current revision review"
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "completed"
                and .conclusion == "success"
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .output.title == $title
                and .output.summary == $evidence
              ' <<<"${transition_check}" >/dev/null

            failure_stage='human-transition-finalization'
            final_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg repository "${REPOSITORY}" '
                .state == "open"
                and .draft == false
                and .user.login == "litroc"
                and .base.sha == $base
                and .base.repo.full_name == $repository
                and .head.sha == $head
                and .head.repo.full_name == $repository
              ' <<<"${final_pr}" >/dev/null
            gh api --method PATCH \
              "repos/${REPOSITORY}/check-runs/${reservation_id}" \
              -f status=completed \
              -f conclusion=success \
              -f 'output[title]=Exact human producer transition verified' \
              -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; review ${review_id}." \
              >/dev/null
            trap - ERR
            exit 0
          fi

          failure_stage='permanent-producer-inventory'
          test "${draft}" = false
          neutral_pages="$(gh api --paginate --slurp \
            "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=Current%20revision%20review&per_page=100")"
          neutral="$(jq -c '
            [.[].check_runs[]? | select(.name == "Current revision review")]
          ' <<<"${neutral_pages}")"
          test "$(jq 'length' <<<"${neutral}")" -eq 1
          check="$(jq -c '.[0]' <<<"${neutral}")"
          jq -e '
            .app.id == 15368
            and .app.slug == "github-actions"
            and .status == "completed"
            and .conclusion == "success"
          ' <<<"${check}" >/dev/null
          check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${check}")"
          details_url="$(jq -r '.details_url // empty' <<<"${check}")"
          test "${details_url}" = "${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
          external_id="$(jq -r '.external_id // empty' <<<"${check}")"
          summary="$(jq -r '.output.summary // empty' <<<"${check}")"
          test -n "${summary}"
          failure_stage='permanent-producer-binding'
          if [ "${author}" = 'lightning-it-release-automation[bot]' ]; then
            [[ "${external_id}" =~ ^mlx90-current-revision:v4:([1-9][0-9]*):[0-9a-f]{64}$ ]]
            producer_run_id="${BASH_REMATCH[1]}"
            expected_title="Exact-Revision Codex PR #${PR_NUMBER} ${EVENT_BASE}..${EVENT_HEAD}"
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
            producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            jq -e \
              --arg actor "${author}" \
              --arg base_ref "${base_ref}" \
              --arg base_sha "${EVENT_BASE}" \
              --arg run_url "${producer_run_url}" \
              --arg title "${expected_title}" '
                .event == "workflow_dispatch"
                and .status == "completed"
                and .conclusion == "success"
                and .head_branch == $base_ref
                and .head_sha == $base_sha
                and .path == ".github/workflows/release-bot-exact-head-review.yml"
                and .display_title == $title
                and .html_url == $run_url
                and .actor.login == $actor
                and .triggering_actor.login == $actor
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and (.merge_base_sha | test("^[0-9a-f]{40}$"))
                and (.integration_tree_sha | test("^[0-9a-f]{40}$"))
                and (.diff_sha256 | test("^[0-9a-f]{64}$"))
                and (.input_sha256 | test("^[0-9a-f]{64}$"))
              ' <<<"${summary}" >/dev/null
          else
            [[ "${external_id}" =~ ^mlx90-current-revision:copilot:v4:([1-9][0-9]*):${EVENT_BASE}:${EVENT_HEAD}$ ]]
            producer_run_id="${BASH_REMATCH[1]}"
            producer_run_url="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${producer_run_id}"
            producer="$(gh api "repos/${REPOSITORY}/actions/runs/${producer_run_id}")"
            controller_sha="$(jq -er '.controller_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
              <<<"${summary}")"
            # pull_request_target always runs the protected default-branch
            # controller. PR base_ref remains independently valid as main or
            # develop and is already bound to EVENT_BASE above.
            controller_branch="$(gh api "repos/${REPOSITORY}" --jq .default_branch)"
            test "${controller_branch}" = develop
            controller_head="$(gh api "repos/${REPOSITORY}/branches/${controller_branch}" --jq .commit.sha)"
            controller_ancestry="$(gh api \
              "repos/${REPOSITORY}/compare/${controller_sha}...${controller_head}")"
            jq -e \
              --arg controller "${controller_sha}" '
                .status == "identical"
                or (.status == "ahead" and .behind_by == 0
                    and .merge_base_commit.sha == $controller)
              ' <<<"${controller_ancestry}" >/dev/null
            jq -e \
              --arg actor "${author}" \
              --arg head_ref "${head_ref}" \
              --arg head_sha "${EVENT_HEAD}" '
              .event == "pull_request_target"
              and .status == "completed"
              and .conclusion == "success"
              and .path == ".github/workflows/copilot-review.yml"
              and .name == "Current revision review gate"
              and .head_branch == $head_ref
              and .head_sha == $head_sha
              and .actor.login == $actor
              and .triggering_actor.login == $actor
            ' <<<"${producer}" >/dev/null
            jq -e \
              --arg run_url "${producer_run_url}" '
                .html_url == $run_url
              ' <<<"${producer}" >/dev/null
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg controller "${controller_sha}" \
              --arg head "${EVENT_HEAD}" \
              --arg run_url "${producer_run_url}" \
              --argjson run_id "${producer_run_id}" '
                .schema == 4
                and .base_sha == $base
                and .head_sha == $head
                and .controller_sha == $controller
                and .producer_run_id == $run_id
                and .run_url == $run_url
                and .review_path == "applicable Copilot or governed automation exemption"
              ' <<<"${summary}" >/dev/null
          fi

          failure_stage='permanent-finalization'
          gh api --method PATCH "repos/${REPOSITORY}/check-runs/${reservation_id}" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Protected current-revision evidence verified' \
            -f "output[summary]=PR #${PR_NUMBER}; base ${EVENT_BASE}; head ${EVENT_HEAD}; producer ${producer_run_url}." >/dev/null
          trap - ERR
