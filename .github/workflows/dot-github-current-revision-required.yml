# LI-319: canonical protected .github source; native single-person approval.
# A native PR check is pending before fallible setup. Only protected target
# events authorize humans; the read-only PR job audits that exact authorization.
# yamllint disable rule:truthy rule:line-length
---
name: Protected dot-github current-revision verifier

run-name: >-
  Cross-protect .github PR #${{ github.event.pull_request.number }}
  ${{ github.event.action }} ${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    branches-ignore: ['**']
  pull_request:
    types: [edited, labeled, unlabeled]
    branches: [main, develop]

permissions:
  contents: read

env:
  EVENT_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
  EVENT_TITLE_JSON: ${{ toJson(github.event.pull_request.title) }}
  EVENT_BODY_JSON: ${{ toJson(github.event.pull_request.body) }}
  EVENT_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
  EVENT_ACTION: ${{ github.event.action }}
  EVENT_BASE: ${{ github.event.pull_request.base.sha }}
  EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
  EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  EVENT_HEAD_REPOSITORY_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
  EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
  EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
  EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
  EVENT_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  EVENT_SENDER: ${{ github.event.sender.login }}
  GH_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  REPOSITORY: ${{ github.repository }}
  LI219_EVENT_MODE: ${{ github.repository == 'lightning-it/.github' && vars.LI219_EVENT_MODE == 'enabled' && 'enabled' || 'disabled' }}
  WORKFLOW_REF: ${{ github.workflow_ref }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}

concurrency:
  group: >-
    protected-dot-github-${{ github.event_name }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Bind protected dot-github approval revision
    if: github.repository == 'lightning-it/.github' && github.event_name == 'pull_request_target'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      binding: ${{ steps.binding.outputs.binding }}
      reuse-run: ${{ steps.binding.outputs.reuse-run }}
    steps:
      - name: Check out protected source only
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lightning-it/.github
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: protected-source
          sparse-checkout: |
            scripts/verify-dot-github-current-revision.py
            scripts/dot-github-policy-approval.py
            scripts/dot-github-policy-devtools.sh
            scripts/wunder-devtools-ee.sh
          sparse-checkout-cone-mode: false
      - name: Bind current revision and find existing native approval
        id: binding
        run: bash protected-source/scripts/dot-github-policy-devtools.sh preflight

  approve:
    name: Approve dot-github policy revision
    needs: preflight
    if: github.event_name == 'pull_request_target' && needs.preflight.outputs.reuse-run == ''
    permissions:
      actions: read
      contents: read
      pull-requests: read
    environment:
      name: dot-github-policy-approval
      url: https://github.com/lightning-it/.github/pull/${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out protected source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lightning-it/.github
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: protected-source
          sparse-checkout: |
            scripts/verify-dot-github-current-revision.py
            scripts/dot-github-policy-approval.py
            scripts/dot-github-policy-devtools.sh
            scripts/wunder-devtools-ee.sh
          sparse-checkout-cone-mode: false
      - name: Revalidate the native human approval
        env:
          APPROVAL_BINDING: ${{ needs.preflight.outputs.binding }}
        run: bash protected-source/scripts/dot-github-policy-devtools.sh approve

  verify-dot-github-current-revision:
    name: Required dot-github current-revision workflow
    needs: [preflight, approve]
    if: >-
      always()
      && github.event_name == 'pull_request_target'
      && needs.preflight.result == 'success'
      && (needs.approve.result == 'success'
          || (needs.approve.result == 'skipped'
              && needs.preflight.outputs.reuse-run != ''))
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out protected source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lightning-it/.github
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: protected-source
          sparse-checkout: |
            scripts/verify-dot-github-current-revision.py
            scripts/dot-github-policy-approval.py
            scripts/dot-github-policy-devtools.sh
            scripts/wunder-devtools-ee.sh
          sparse-checkout-cone-mode: false
      - name: Verify protected evidence and exact native approval
        env:
          APPROVAL_BINDING: ${{ needs.preflight.outputs.binding }}
          APPROVAL_REUSE_RUN: ${{ needs.preflight.outputs.reuse-run }}
        run: bash protected-source/scripts/dot-github-policy-devtools.sh verify

  metadata:
    name: "${{ github.event_name == 'pull_request' && 'dot-github / approved metadata' || 'Inactive metadata audit for target event' }}"
    if: github.repository == 'lightning-it/.github' && github.event_name == 'pull_request'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current protected main only
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lightning-it/.github
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false
          path: protected-source
          sparse-checkout: |
            scripts/verify-dot-github-current-revision.py
            scripts/dot-github-policy-approval.py
            scripts/dot-github-policy-devtools.sh
            scripts/wunder-devtools-ee.sh
          sparse-checkout-cone-mode: false
      - name: Audit exact native authorization and current technical evidence
        env:
          WORKFLOW_REF: lightning-it/.github/.github/workflows/dot-github-current-revision-required.yml@refs/heads/main
          WORKFLOW_SHA: ${{ steps.source.outputs.commit }}
        run: bash protected-source/scripts/dot-github-policy-devtools.sh audit-metadata
