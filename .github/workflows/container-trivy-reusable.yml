# yamllint disable rule:truthy
---
name: Reusable container Trivy scan

on:
  workflow_call:
    inputs:
      image_name:
        description: Local image name used for the scan build.
        required: false
        type: string
        default: local/container-trivy
      containerfile:
        description: Containerfile or Dockerfile path.
        required: false
        type: string
        default: Dockerfile
      context:
        description: Container build context.
        required: false
        type: string
        default: .
      build_args:
        description: Newline-delimited build arguments.
        required: false
        type: string
        default: ""
      severity:
        description: Severity gate for failing the scan.
        required: false
        type: string
        default: CRITICAL

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy container scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Build local image for Trivy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.containerfile }}
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ inputs.image_name }}:${{ github.sha }}
          build-args: ${{ inputs.build_args }}

      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          ignore-unfixed: true
          severity: ${{ inputs.severity }}
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: ${{ inputs.severity }}
          exit-code: "1"
