# Immutable common source. Management admits one pinned source per rollout scope.
# yamllint disable rule:truthy
---
name: Protected change control
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: protected-control-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    name: Protected current revision
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
    outputs:
      route: ${{ steps.classify.outputs.route }}
      approval_needed: ${{ steps.classify.outputs.approval_needed }}
    steps:
      - name: Resolve native defining source
        id: source
        env:
          NATIVE_JOB: ${{ toJSON(job) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          job = json.loads(os.environ['NATIVE_JOB'])
          assert job['workflow_repository'] == 'lightning-it/.github'
          assert job['workflow_file_path'] == '.github/workflows/change-control-required.yml'
          assert re.fullmatch('[0-9a-f]{40}', job['workflow_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + job['workflow_sha'] + '\n')
          PY
      - name: Load immutable common source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lightning-it/.github
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Classify protected current revision
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_JOB: ${{ toJSON(job) }}
        run: python3 -B scripts/workflow_control.py classify
      - name: Persist protected operation binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: control-operation-${{ github.run_attempt }}
          path: control-operation.json
          if-no-files-found: error
          retention-days: 90
      - name: Request current Copilot review
        if: steps.classify.outputs.request_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_JOB: ${{ toJSON(job) }}
        run: python3 -B scripts/workflow_control.py request-copilot
      - name: Verify applicable native review or governed exemption
        if: steps.classify.outputs.route != 'codex'
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_JOB: ${{ toJSON(job) }}
        run: python3 -B scripts/workflow_control.py review
  normal-approval:
    name: Approve exact main promotion
    needs: review
    if: needs.review.outputs.route == 'promotion' && needs.review.outputs.approval_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment: normal-release-promotion-approval
    steps:
      - name: Record native approval boundary
        run: echo 'Native approval granted; final control rechecks the current tuple.'
  required:
    name: Current revision review
    needs: [review, normal-approval]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve native defining source
        id: source
        env:
          NATIVE_JOB: ${{ toJSON(job) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          job = json.loads(os.environ['NATIVE_JOB'])
          assert job['workflow_repository'] == 'lightning-it/.github'
          assert job['workflow_file_path'] == '.github/workflows/change-control-required.yml'
          assert re.fullmatch('[0-9a-f]{40}', job['workflow_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + job['workflow_sha'] + '\n')
          PY
      - name: Load immutable common source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lightning-it/.github
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Enforce native review and quality on the still-current tuple
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_JOB: ${{ toJSON(job) }}
          REVIEW_RESULT: ${{ needs.review.result }}
          APPROVAL_RESULT: ${{ needs.normal-approval.result }}
        run: python3 -B scripts/workflow_control.py finalize
      - name: Persist exact native acceptance proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: control-proof-${{ github.run_attempt }}
          path: control-proof.json
          if-no-files-found: error
          retention-days: 90
