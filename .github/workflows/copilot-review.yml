# Owned by the protected lightning-it/.github controller.
# Generic shared-assets sync must preserve this repository-specific file.
# Protected MLX-90/REP-60 current-revision controller.
# yamllint disable rule:truthy rule:line-length
---
name: Current revision review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  LI219_EVENT_MODE: ${{ (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)) && 'enabled' || 'disabled' }}
  COPILOT_REVIEWER_LOGIN: copilot-pull-request-reviewer
  NO_FILES_REVIEW_MARKER: was not able to review any files
  UNABLE_REVIEW_MARKER: unable to review this pull request
  QUOTA_EXHAUSTED_MARKER: quota exhausted
  QUOTA_EXCEEDED_MARKER: quota exceeded
  SUPPRESSED_COMMENTS_MARKER: suppressed comments

concurrency:
  group: current-revision-${{ github.repository_id }}-head-${{ github.event.pull_request.head.sha }}-check-current-revision-review
  cancel-in-progress: false
  queue: max

# Release-App pull requests use only the protected MLX-90 §7.2 Exact-Revision
# Codex check, except for a zero-diff ancestry merge proven deterministically
# against both protected tips and the develop tree. This workflow retains the
# final-head GitHub Copilot path for applicable human PRs plus the governed
# automation exemptions.
jobs:
  classify-main-trust-root-handoff:
    name: Classify protected main trust-root handoff
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'litroc'
    permissions:
      actions: read
      pull-requests: read
    outputs:
      active: ${{ steps.handoff.outputs.active }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify protected Required-Workflow handoff provenance
        id: handoff
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'active=false' >>"${GITHUB_OUTPUT}"
          [[ "${REPOSITORY}" =~ ^lightning-it/[A-Za-z0-9_.-]+$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e \
            --arg base "${EVENT_BASE}" \
            --arg head "${EVENT_HEAD}" \
            --arg head_ref "${EVENT_HEAD_REF}" \
            --arg repository "${REPOSITORY}" \
            --argjson number "${PR_NUMBER}" '
              .number == $number
              and .state == "open"
              and .draft == false
              and .base.sha == $base
              and .base.repo.full_name == $repository
              and .head.sha == $head
              and .head.ref == $head_ref
              and .head.repo.full_name == $repository
            ' <<<"${pr}" >/dev/null
          if ! jq -e '
              .user.login == "litroc"
              and .user.type == "User"
              and .base.ref == "main"
              and .title
                == "fix(rep60): bootstrap protected main review trust root"
            ' <<<"${pr}" >/dev/null; then
            exit 0
          fi

          required_workflow_path='.github/workflows/supplementary-current-revision-required.yml'
          for observation in $(seq 1 60); do
            run_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs?event=pull_request_target&head_sha=${EVENT_HEAD}&per_page=100")"
            matching_runs="$(jq -c \
              --arg api_url "${GITHUB_API_URL}" \
              --arg head "${EVENT_HEAD}" \
              --arg head_ref "${EVENT_HEAD_REF}" \
              --arg path "${required_workflow_path}" \
              --arg repository "${REPOSITORY}" \
              --argjson number "${PR_NUMBER}" \
              '
                [.[].workflow_runs[]? |
                  select(.workflow_id | type == "number" and . > 0) |
                  select(
                    .workflow_url == (
                      if $repository == "lightning-it/.github" then
                        $api_url + "/repos/" + $repository
                          + "/actions/workflows/"
                          + (.workflow_id | tostring)
                      else
                        $api_url + "/repos/" + $repository
                          + "/actions/required_workflows/"
                          + (.workflow_id | tostring)
                      end
                    )
                    and .path == $path
                  ) |
                  select(.event == "pull_request_target") |
                  select(.head_sha == $head and .head_branch == $head_ref) |
                  select(.repository.full_name == $repository) |
                  select(.head_repository.full_name == $repository) |
                  select(.actor.login == "litroc") |
                  select(
                    (.run_attempt == 1
                      and .triggering_actor.login == "litroc")
                    or
                    (.run_attempt == 2
                      and .triggering_actor.login == "github-actions[bot]")
                  ) |
                  select(
                    .display_title == ("Protected current revision PR #" + ($number | tostring) + " opened " + $head)
                  )]
              ' <<<"${run_pages}")"
            run_count="$(jq 'length' <<<"${matching_runs}")"
            if [ "${run_count}" -gt 1 ]; then
              echo 'Multiple protected Required-Workflow runs claim the handoff.' >&2
              exit 1
            fi
            if [ "${run_count}" -eq 0 ]; then
              if [ "${observation}" -eq 60 ]; then
                echo 'The protected Required-Workflow handoff never materialized.' >&2
                exit 1
              fi
              sleep 3
              continue
            fi

            required_run="$(jq -c '.[0]' <<<"${matching_runs}")"
            required_run_id="$(jq -er '.id | select(type == "number" and . > 0)' \
              <<<"${required_run}")"
            required_attempt="$(jq -er '.run_attempt | select(. == 1 or . == 2)' \
              <<<"${required_run}")"
            job_pages="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/actions/runs/${required_run_id}/jobs?filter=all&per_page=100")"
            required_jobs="$(jq -c \
              --arg head "${EVENT_HEAD}" \
              --argjson attempt "${required_attempt}" \
              --argjson run_id "${required_run_id}" '
                [.[].jobs[]? |
                  select(.run_id == $run_id) |
                  select(.run_attempt == $attempt) |
                  select(.head_sha == $head) |
                  select(.name == "Legacy protected current-revision verifier")]
              ' <<<"${job_pages}")"
            job_count="$(jq 'length' <<<"${required_jobs}")"
            if [ "${job_count}" -gt 1 ]; then
              echo 'The protected Required-Workflow job ledger is ambiguous.' >&2
              exit 1
            fi
            if [ "${job_count}" -eq 1 ]; then
              classification_steps="$(jq -c '
                [.[0].steps[]? |
                  select(.name == "Classify protected main trust-root bootstrap handoff")]
                ' <<<"${required_jobs}")"
              step_count="$(jq 'length' <<<"${classification_steps}")"
              if [ "${step_count}" -gt 1 ]; then
                echo 'The protected handoff classification step is ambiguous.' >&2
                exit 1
              fi
              if [ "${step_count}" -eq 1 ] \
                && [ "$(jq -r '.[0].status' <<<"${classification_steps}")" = completed ] \
                && [ "$(jq -r '.[0].conclusion' <<<"${classification_steps}")" = success ]; then
                echo 'active=true' >>"${GITHUB_OUTPUT}"
                exit 0
              fi
              if [ "$(jq -r '.[0].status' <<<"${required_jobs}")" = completed ]; then
                echo 'The protected Required-Workflow completed without authorizing the handoff.' >&2
                exit 1
              fi
            fi
            if [ "${observation}" -eq 60 ]; then
              echo 'The protected handoff classification did not converge.' >&2
              exit 1
            fi
            sleep 3
          done

  request-current-revision-review:
    name: Request Copilot review for current revision
    concurrency:
      group: copilot-review-request-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    needs: classify-main-trust-root-handoff
    if: >-
      always() &&
      (needs.classify-main-trust-root-handoff.result == 'success' ||
        needs.classify-main-trust-root-handoff.result == 'skipped') &&
      needs.classify-main-trust-root-handoff.outputs.active != 'true' &&
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'opened' ||
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'synchronize' && (vars.LI219_EVENT_MODE == 'enabled' && contains(fromJSON('["lightning-it/.github","lightning-it/shared-assets-lit","lightning-it/ansible-collection-supplementary"]'), github.repository)))) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'litroc' &&
      github.run_attempt == 1 &&
      github.actor == 'litroc' &&
      github.triggering_actor == 'litroc'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Materialize the protected operation claim
        run: |
          set -euo pipefail
          umask 077
          cat >"${RUNNER_TEMP}/request-operation.sh" <<'CLAIM'
          claim_review_operation() {
            [ "${LI219_EVENT_MODE:-disabled}" = enabled ] || return 0
            # The data ref is the CAS authority; Check inventory is never a lock.
            local target="$1" head="$2" base="$3" pr="$4"
            local key path action target_run created now prior snapshot record payload response committed marker rows attempt
            [[ "${target}" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "${pr}" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "${head}" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "${base}" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "${GITHUB_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || return 1
            [ "${GITHUB_RUN_ATTEMPT}" = 1 ] || return 1
            action="${5:-rerun}"
            case "${action}" in
              rerun) [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || return 1 ;;
              request) [ "${GITHUB_EVENT_NAME}" = pull_request_target ] || return 1 ;;
              *) return 1 ;;
            esac
            [ "${GITHUB_REF_PROTECTED}" = true ] || return 1
            [[ "${GITHUB_REF}" =~ ^refs/heads/(develop|main)$ ]] || return 1
            [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]] || return 1
            operation_api() {
              if declare -F bounded_gh_api >/dev/null; then
                bounded_gh_api "$@"
              else
                timeout --foreground --signal=TERM --kill-after=2s 30s gh api "$@"
              fi
            }
            operation_ref() {
              local result
              result="$(operation_api "repos/${REPOSITORY}/git/ref/heads/lit-review-operations")" || return 1
              jq -er 'select(.ref == "refs/heads/lit-review-operations" and .object.type == "commit")
                | .object.sha | strings | select(test("^[0-9a-f]{40}$"))' <<<"${result}"
            }
            operation_snapshot() {
              # Source commit, manifest and operation are one immutable snapshot. Never
              # combine a mutable ref read with a separately resolved branch:path read.
              local oid="$1" result
              result="$(operation_api graphql -f query='query($owner:String!,$name:String!,$oid:String!,$manifest:String!,$record:String!){
                repository(owner:$owner,name:$name){nameWithOwner
                  source:object(expression:$oid){__typename oid}
                  manifest:object(expression:$manifest){__typename ... on Blob{isTruncated byteSize text}}
                  record:object(expression:$record){__typename ... on Blob{isTruncated byteSize text}}
                }}' -f "owner=${REPOSITORY%%/*}" -f "name=${REPOSITORY#*/}" \
                -f "oid=${oid}" -f "manifest=${oid}:manifest.json" -f "record=${oid}:${path}")" || return 1
              jq -ce --arg oid "${oid}" --arg repo "${REPOSITORY}" --arg repo_id "${GITHUB_REPOSITORY_ID}" '
                select(has("errors") | not) | .data.repository
                | select(.nameWithOwner == $repo and .source.__typename == "Commit" and .source.oid == $oid)
                | select(.manifest.__typename == "Blob" and .manifest.isTruncated == false
                    and (.manifest.byteSize | type) == "number" and .manifest.byteSize > 0 and .manifest.byteSize <= 4096)
                | select((.manifest.text | fromjson) == {schema:1,repository:$repo,repository_id:$repo_id,ref:"refs/heads/lit-review-operations"})
                | select(has("record"))
                | if .record == null then {present:false} else
                    .record | select(.__typename == "Blob" and .isTruncated == false
                      and (.byteSize | type) == "number" and .byteSize > 0 and .byteSize <= 4096)
                    | {present:true,record:(.text | fromjson)} end
                ' <<<"${result}"
            }
            target_run="$(operation_api "repos/${REPOSITORY}/actions/runs/${target}")" || return 1
            created="$(jq -er --argjson id "${target}" '
              select(.id == $id and .run_attempt == 1) | .created_at | fromdateiso8601
              ' <<<"${target_run}")" || return 1
            now="$(date +%s)"
            if [ "$((now - created))" -gt 604800 ] || [ "${created}" -gt "${now}" ]; then
              echo 'Verifier event reservation expired; merge remains blocked.' >&2
              return 1
            fi
            key="li219-verifier-operation:v1:${pr}:${base}:${head}:${target}"
            if [ "${action}" = request ]; then
              # Base changes and fresh producer run IDs cannot buy another AI call.
              key="li219-review-request:v1:${GITHUB_REPOSITORY_ID}:${pr}:${head}"
            fi
            path="operations/$(printf '%s' "${key}" | sha256sum | cut -d ' ' -f 1).json"
            prior="$(operation_ref)" || return 1
            snapshot="$(operation_snapshot "${prior}")" || return 1
            if [ "$(jq -r .present <<<"${snapshot}")" != false ]; then
              echo 'Verifier operation already consumed; only native-state reconciliation is allowed.' >&2
              return 1
            fi
            record="$(jq -cn --arg key "${key}" --arg repo "${REPOSITORY}" --arg run "${GITHUB_RUN_ID}" \
              --arg source "${WORKFLOW_SHA}" --arg repo_id "${GITHUB_REPOSITORY_ID}" --arg action "${action}" '{schema:1,repository:$repo,repository_id:$repo_id,action:$action,operation:$key,claim_run:$run,claim_attempt:"1",source_sha:$source}')" || return 1
            payload="$(jq -cn --arg repo "${REPOSITORY}" --arg prior "${prior}" --arg path "${path}" \
              --arg content "$(printf '%s' "${record}" | base64 -w 0)" '{
                query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid parents(first:2){nodes{oid}}}}}",
                variables:{input:{branch:{repositoryNameWithOwner:$repo,branchName:"lit-review-operations"},
                  expectedHeadOid:$prior,message:{headline:"Consume LI-219 verifier operation"},
                  fileChanges:{additions:[{path:$path,contents:$content}]}}}}')" || return 1
            # Exactly one CAS attempt. A lost response or conflict is NOT permission to
            # retry a mutation, even if readback finds our record. Only confirmed winners
            # may reach the single rerun POST in this invocation.
            committed=''
            if response="$(operation_api graphql --input - <<<"${payload}")"; then
              committed="$(jq -er --arg prior "${prior}" '
                select(has("errors") | not) | .data.createCommitOnBranch.commit
                | select(.parents.nodes == [{oid:$prior}])
                | .oid | strings | select(test("^[0-9a-f]{40}$") and . != $prior)
                ' <<<"${response}")" || committed=''
            fi
            if [ -z "${committed}" ]; then
              for attempt in 1 2 3; do
                if prior="$(operation_ref)" && snapshot="$(operation_snapshot "${prior}")" \
                    && [ "$(jq -r .present <<<"${snapshot}")" = true ]; then break; fi
                [ "${attempt}" -eq 3 ] || sleep 2
              done
              echo 'CAS conflict or uncertain claim response; reconciliation only, no rerun sent.' >&2
              return 1
            fi
            snapshot="$(operation_snapshot "${committed}")" || return 1
            jq -e --argjson record "${record}" '.present == true and .record == $record' \
              <<<"${snapshot}" >/dev/null || return 1
            if [ "${action}" = request ]; then
              CLAIM_COMMIT="${committed}"
              return 0
            fi
            marker="$(jq -cn --arg key "${key}" --arg run "${GITHUB_RUN_ID}" \
              --arg commit "${committed}" '{operation:$key,claim_run:$run,claim_attempt:"1",journal_commit:$commit}')" || return 1
            operation_api --method POST "repos/${REPOSITORY}/check-runs" \
              -f 'name=Review event operation' -f "head_sha=${head}" -f "external_id=${key}" \
              -f status=completed -f conclusion=neutral -f 'output[title]=Verifier mutation consumed' \
              -f "output[summary]=${marker}" >/dev/null || true
            for attempt in 1 2 3; do
              if rows="$(operation_api --paginate --slurp \
                  "repos/${REPOSITORY}/commits/${head}/check-runs?check_name=Review%20event%20operation&filter=all&per_page=100")" \
                && jq -e --arg marker "${marker}" --arg key "${key}" --arg head "${head}" '
                  select(type == "array" and length > 0 and length <= 10)
                  | select(all(.[]; (.check_runs | type) == "array"))
                  | [.[].check_runs[] | select(.external_id == $key)]
                  | length == 1 and .[0].output.summary == $marker
                    and .[0].name == "Review event operation" and .[0].head_sha == $head
                    and .[0].app.id == 15368 and .[0].app.slug == "github-actions"
                    and .[0].status == "completed" and .[0].conclusion == "neutral"
                    and .[0].output.title == "Verifier mutation consumed"
                  ' <<<"${rows}" >/dev/null; then return 0; fi
              [ "${attempt}" -eq 3 ] || sleep 2
            done
            echo 'Consumed operation receipt not visible; no rerun sent.' >&2
            return 1
          }
          CLAIM
          cat >"${RUNNER_TEMP}/review_request_continuation.py" <<'CONTINUATION'
          """LI-219 v2 first-request continuation. Never retry an effect or mint a new budget.

          This file is embedded in protected workflows, never loaded from a PR checkout.
          The deferred record carries original authorization, not request consumption.
          """
          import base64
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlencode
          import re
          import subprocess
          import sys
          import time

          PILOTS = {"lightning-it/.github", "lightning-it/shared-assets-lit",
                    "lightning-it/ansible-collection-supplementary"}
          PRODUCER = ".github/workflows/copilot-review.yml"
          WORKFLOW = ".github/workflows/review-request-continuation.yml"
          BOT = "copilot-pull-request-reviewer[bot]"
          REVIEWERS = frozenset({BOT, "copilot-pull-request-reviewer"})
          FAILURE_MARKERS = (
              "unabletoreviewthispullrequest",
              "notabletoreviewthispullrequest", "wasnotabletoreviewthispullrequest",
              "nofilestoreview",
              "unabletoreviewanyfiles",
              "notabletoreviewanyfiles",
              "wasnotabletoreviewanyfiles",
              "quotaexhausted",
              "quotaexceeded",
              "premiumrequestquota",
              "premiumrequestsquota",
              "suppressedcomment",
              "encounteredanerror",
          )
          ORIGINAL_STEPS = ["Set up job", "Materialize the protected operation claim",
                            "Request Copilot review for the current revision", "Complete job"]
          RESUME_STEPS = ["Set up job", "Materialize protected first-request continuation",
                          "Resume the deferred first request", "Complete job"]


          VISIBILITY_READS = 24
          VISIBILITY_SECONDS = 20
          _visibility_budget = None


          class NativeBindingPending(ValueError):
              """A valid unfinished native owner has not exposed its policy binding yet."""


          class ConfirmedIntentConflict(ValueError):
              """The server explicitly rejected the expected journal head."""


          class UnknownWriteResult(ValueError):
              """Only readback is allowed after an unconfirmed journal write."""


          class ReviewContentError(ValueError):
              """The selected review has malformed or unsuccessful content."""


          def normalize(value: str) -> str:
              """Match the protected gate's ASCII fold, contraction and Unicode whitespace rules."""
              ascii_lower = "".join(chr(ord(char) + 32) if "A" <= char <= "Z" else char for char in value)
              expanded = ascii_lower.replace("n't", " not").replace("n’t", " not")
              return "".join(char for char in expanded if not char.isspace())


          def require_usable_review_content(review_body: object, inline_bodies: object) -> None:
              """Reject malformed, empty, or known unsuccessful Copilot review content."""
              if review_body is not None and type(review_body) is not str:
                  raise ReviewContentError("review-body-shape")
              if type(inline_bodies) is not list or any(type(body) is not str for body in inline_bodies):
                  raise ReviewContentError("inline-body-shape")
              parts = [normalize(review_body or ""), *(normalize(body) for body in inline_bodies)]
              if not any(parts):
                  raise ReviewContentError("review-content-empty")
              if any(marker in part for part in parts for marker in FAILURE_MARKERS):
                  raise ReviewContentError("review-content-failed")


          def require(value, message):
              if not value:
                  raise ValueError(message)


          def positive(value):
              return type(value) is int and value > 0


          def sha(value):
              return isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value)


          def epoch(value):
              parsed = dt.datetime.strptime(value, "%Y-%m-%dT%H:%M:%SZ")
              require(parsed.strftime("%Y-%m-%dT%H:%M:%SZ") == value, "timestamp")
              return parsed.replace(tzinfo=dt.timezone.utc).timestamp()


          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate JSON key")
                  result[key] = value
              return result


          def api(route, payload=None, fields=()):
              args = ["gh", "api", route, *fields]
              if payload is not None:
                  args += ["--method", "POST", "--input", "-"]
              timeout = 30
              if _visibility_budget is not None:
                  require(payload is None and not fields and route.startswith("repos/"), "visibility is GET-only")
                  remaining = _visibility_budget[1] - time.monotonic()
                  require(_visibility_budget[0] > 0 and remaining > 0, "visibility read/time budget exhausted")
                  _visibility_budget[0] -= 1
                  timeout = min(timeout, remaining)
              result = subprocess.run(args, input=None if payload is None else json.dumps(payload),
                                      capture_output=True, text=True, timeout=timeout, check=True)
              return json.loads(result.stdout, object_pairs_hook=unique) if result.stdout.strip() else None


          def commit_response(payload):
              transport_failed = False
              try:
                  result = api("graphql", payload)
              except subprocess.CalledProcessError as exc:
                  transport_failed = True
                  try:
                      result = json.loads(exc.stdout, object_pairs_hook=unique)
                  except (TypeError, ValueError):
                      raise UnknownWriteResult("unconfirmed journal transport") from exc
              except (OSError, subprocess.SubprocessError, ValueError) as exc:
                  raise UnknownWriteResult("unconfirmed journal transport") from exc
              prior = payload["variables"]["input"]["expectedHeadOid"]
              errors = result.get("errors") if isinstance(result, dict) else None
              if (isinstance(result, dict) and result.get("data") == {"createCommitOnBranch": None}
                      and isinstance(errors, list) and len(errors) == 1 and isinstance(errors[0], dict)
                      and errors[0].get("type") == "STALE_DATA"
                      and errors[0].get("path") == ["createCommitOnBranch"]
                      and errors[0].get("message") == f'Expected branch to point to "{prior}" but it did not. Pull and try again.'):
                  raise ConfirmedIntentConflict("confirmed journal head conflict")
              if transport_failed or not isinstance(result, dict) or "errors" in result:
                  raise UnknownWriteResult("unconfirmed journal response")
              return result


          def pages(route, key=None):
              result, total = [], None
              for page in range(1, 11):
                  response = api(f"{route}{'&' if '?' in route else '?'}per_page=100&page={page}")
                  batch = response if key is None else response[key]
                  require(isinstance(batch, list) and len(batch) <= 100, "page shape")
                  if key:
                      count = response["total_count"]
                      require(type(count) is int and 0 <= count < 1000, "inventory limit")
                      require(total is None or total == count, "changing inventory")
                      total = count
                  result.extend(batch)
                  if len(batch) < 100:
                      require(total is None or len(result) == total, "incomplete inventory")
                      require(all(isinstance(item, dict) and positive(item.get("id")) for item in result), "item identity")
                      require(len({item["id"] for item in result}) == len(result), "duplicate inventory")
                      return result
              raise ValueError("inventory limit")


          def key_for(repo_id, pr, head):
              return f"li219-review-request:v1:{repo_id}:{pr}:{head}"


          def record_path(key, deferred=False):
              return ("deferred/" if deferred else "operations/") + hashlib.sha256(key.encode()).hexdigest() + ".json"


          def blob(value):
              require(isinstance(value, dict) and value.get("__typename") == "Blob"
                      and value.get("isTruncated") is False, "journal blob")
              text = value["text"]
              require(isinstance(text, str) and positive(value["byteSize"])
                      and len(text.encode()) == value["byteSize"] <= 4096, "journal size")
              return json.loads(text, object_pairs_hook=unique)


          class Journal:
              def __init__(self, repo, repo_id):
                  self.repo, self.repo_id = repo, repo_id
                  ref = api(f"repos/{repo}/git/ref/heads/lit-review-operations")
                  require(ref["ref"] == "refs/heads/lit-review-operations" and ref["object"]["type"] == "commit", "journal ref")
                  self.oid = ref["object"]["sha"]
                  require(sha(self.oid), "journal commit")

              def read(self, path):
                  result = api("graphql", fields=["-f", "query=query($owner:String!,$name:String!,$oid:String!,$manifest:String!,$record:String!){repository(owner:$owner,name:$name){nameWithOwner source:object(expression:$oid){__typename oid} manifest:object(expression:$manifest){__typename ... on Blob{isTruncated byteSize text}} record:object(expression:$record){__typename ... on Blob{isTruncated byteSize text}}}}",
                              "-f", f"owner={self.repo.split('/')[0]}", "-f", f"name={self.repo.split('/')[1]}",
                              "-f", f"oid={self.oid}", "-f", f"manifest={self.oid}:manifest.json", "-f", f"record={self.oid}:{path}"])
                  require("errors" not in result, "partial journal")
                  data = result["data"]["repository"]
                  require(data["nameWithOwner"] == self.repo and data["source"] == {"__typename": "Commit", "oid": self.oid}, "mixed journal")
                  manifest = blob(data["manifest"])
                  require(type(manifest.get("schema")) is int and manifest == {"schema": 1, "repository": self.repo,
                          "repository_id": self.repo_id, "ref": "refs/heads/lit-review-operations"}, "manifest")
                  return None if data["record"] is None else blob(data["record"])

              def create(self, path, record):
                  require(self.read(path) is None, "record already exists")
                  result = commit_response({"query": "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid parents(first:2){nodes{oid}}}}}",
                      "variables": {"input": {"branch": {"repositoryNameWithOwner": self.repo, "branchName": "lit-review-operations"},
                      "expectedHeadOid": self.oid, "message": {"headline": "Record LI-219 first-request continuation"},
                      "fileChanges": {"additions": [{"path": path, "contents": base64.b64encode(json.dumps(record, sort_keys=True, separators=(",", ":")).encode()).decode()}]}}}})
                  require(isinstance(result, dict) and "errors" not in result, "uncertain CAS")
                  commit = result["data"]["createCommitOnBranch"]["commit"]
                  require(sha(commit["oid"]) and commit["oid"] != self.oid
                          and commit["parents"]["nodes"] == [{"oid": self.oid}], "CAS result")
                  self.oid = commit["oid"]
                  require(self.read(path) == record, "CAS readback")


          def repository(repo, repo_id, source):
              require(repo in PILOTS and re.fullmatch(r"[1-9][0-9]*", repo_id) and sha(source), "pilot/source")
              meta = api(f"repos/{repo}")
              require(meta["full_name"] == repo and str(meta["id"]) == repo_id
                      and meta["default_branch"] == "develop", "repository")
              branch = api(f"repos/{repo}/branches/develop")
              require(branch["name"] == "develop" and branch["protected"] is True and sha(branch["commit"]["sha"]), "protected default")
              ancestry = api(f"repos/{repo}/compare/{source}...{branch['commit']['sha']}")
              require(ancestry.get("status") == "identical" or (ancestry.get("status") == "ahead"
                      and ancestry.get("behind_by") == 0 and ancestry.get("merge_base_commit", {}).get("sha") == source), "source ancestry")
              return branch["commit"]["sha"]


          def live_pr(repo, pr, head=None, base=None):
              require(positive(pr), "PR ID")
              value = api(f"repos/{repo}/pulls/{pr}")
              require(value["number"] == pr and value["state"] == "open" and value["draft"] is False
                      and value["user"]["login"] == "litroc" and value["user"]["type"] == "User", "live human PR")
              require(value["head"]["repo"]["full_name"] == repo and value["base"]["repo"]["full_name"] == repo
                      and value["base"]["ref"] in {"develop", "main"} and value["head"]["ref"]
                      and sha(value["head"]["sha"]) and sha(value["base"]["sha"]), "PR refs")
              require(head is None or value["head"]["sha"] == head, "stale head")
              require(base is None or value["base"]["sha"] == base, "stale base")
              return value


          def original_run(repo, intent, completed=True):
              run = api(f"repos/{repo}/actions/runs/{intent['owner_run']}/attempts/1")
              require(run["id"] == intent["owner_run"] and type(run["id"]) is int and type(run["run_attempt"]) is int and run["run_attempt"] == 1
                      and run["event"] == "pull_request_target" and run["path"] == PRODUCER
                      and run["name"] == "Current revision review gate" and run["head_sha"] == intent["head"]
                      and run["head_branch"] == intent["head_ref"] and run["actor"]["login"] == "litroc"
                      and run["triggering_actor"]["login"] == "litroc"
                      and run["repository"]["full_name"] == repo and run["head_repository"]["full_name"] == repo, "original run")
              prs = run["pull_requests"]
              require(isinstance(prs, list) and len(prs) <= 1, "original PR inventory")
              if not prs:
                  lookup = empty_owner if completed else await_empty_owner
                  pr = lookup(repo, run, intent["pr"], intent["base"], intent["head"], intent["base_ref"])
                  require(pr["head"]["ref"] == intent["head_ref"], "fallback head ref")
              else:
                  recorded_pr(repo, intent, prs[0])
              if completed:
                  require(run["status"] == "completed" and run["conclusion"] == "failure", "original not completed failure")
              return run


          def await_empty_owner(repo, run, owner, base, head, base_ref):
              """Only visibility races get a short read-only wait before intent creation."""
              global _visibility_budget
              require(_visibility_budget is None, "nested visibility wait")
              _visibility_budget = [VISIBILITY_READS, time.monotonic() + VISIBILITY_SECONDS]
              try:
                  for observation in range(4):
                      try:
                          return empty_owner(repo, run, owner, base, head, base_ref, allow_pending=True)
                      except NativeBindingPending:
                          require(observation < 3, "native binding visibility exhausted")
                          remaining = _visibility_budget[1] - time.monotonic()
                          require(_visibility_budget[0] > 0 and remaining > 2, "visibility read/time budget exhausted")
                          time.sleep(2)
              finally:
                  _visibility_budget = None


          def empty_owner(repo, run, owner, base, head, base_ref, allow_pending=False):
              require(repo in PILOTS and positive(owner) and positive(run.get("id"))
                      and type(run.get("run_attempt")) is int and run["run_attempt"] in (1, 2)
                      and run["event"] == "pull_request_target" and run["path"] == PRODUCER
                      and run["name"] == "Current revision review gate" and run["head_sha"] == head
                      and run["actor"]["login"] == "litroc"
                      and run["triggering_actor"]["login"] == ("litroc" if run["run_attempt"] == 1 else "github-actions[bot]")
                      and run["repository"]["full_name"] == repo and run["head_repository"]["full_name"] == repo
                      and run["pull_requests"] == [] and sha(base) and sha(head), "fallback native owner")
              require(repo in {"lightning-it/.github", "lightning-it/shared-assets-lit"}, "no native fallback sender")
              pr = branch_pr(repo, run)
              require(pr["number"] == owner and pr["base"]["sha"] == base and pr["base"]["ref"] == base_ref, "fallback PR binding")
              jobs = pages(f"repos/{repo}/actions/runs/{run['id']}/attempts/{run['run_attempt']}/jobs?filter=all", "jobs")
              policy = [job for job in jobs if job.get("name") == "Verify current revision policy"]
              if allow_pending and not policy:
                  raise NativeBindingPending("policy job not visible")
              require(len(policy) == 1, "fallback policy job")
              job = policy[0]
              require(type(job.get("run_id")) is int and job["run_id"] == run["id"]
                      and type(job.get("run_attempt")) is int and job["run_attempt"] == run["run_attempt"]
                      and job["head_sha"] == head, "fallback native policy identity")
              if allow_pending and job["status"] in {"queued", "waiting", "pending"} and job["conclusion"] is None:
                  raise NativeBindingPending("policy job queued")
              require(type(job.get("run_id")) is int and job["run_id"] == run["id"]
                      and type(job.get("run_attempt")) is int and job["run_attempt"] == run["run_attempt"]
                      and job["head_sha"] == head and positive(job.get("runner_id"))
                      and job["status"] in {"in_progress", "completed"}
                      and (job["conclusion"] is None if job["status"] == "in_progress"
                           else job["conclusion"] in {"success", "failure"}), "fallback native policy")
              require(repo in {"lightning-it/.github", "lightning-it/shared-assets-lit"}, "no native fallback sender")
              binding = (f"Event binding #{owner}:{base}:{head}:{run['id']}" if repo == "lightning-it/.github" else
                         f"Current revision tuple #{owner} {base_ref}@{base} -> {repo}:{run['head_branch']}@{head} run {run['id']}")
              steps = job["steps"]
              require(isinstance(steps, list) and all(isinstance(step, dict) and isinstance(step.get("name"), str) for step in steps),
                      "fallback step inventory")
              if allow_pending and job["status"] == "in_progress" and not any(step.get("number") == 2 for step in steps):
                  raise NativeBindingPending("policy binding not visible")
              require(sum(step["name"] == binding for step in steps) == 1, "fallback event binding")
              step = next(step for step in steps if step["name"] == binding)
              if (allow_pending and job["status"] == "in_progress" and type(step.get("number")) is int
                      and step["number"] == 2 and step["status"] in {"queued", "in_progress"} and step["conclusion"] is None):
                  raise NativeBindingPending("policy binding unfinished")
              require(type(step.get("number")) is int and step["number"] == 2
                      and step["status"] == "completed" and step["conclusion"] == "success", "fallback binding step")
              return pr


          def branch_pr(repo, run):
              query = urlencode({"state": "open", "head": repo.split('/')[0] + ':' + run["head_branch"]})
              candidates = pages(f"repos/{repo}/pulls?{query}")
              require(len(candidates) == 1, "ambiguous live branch")
              pr = live_pr(repo, candidates[0]["number"], run["head_sha"])
              require(pr["head"]["ref"] == run["head_branch"], "branch drift")
              return pr


          def recorded_pr(repo, intent, pr):
              require(pr["number"] == intent["pr"] and all(pr[side][field] == intent[side if field == "sha" else side + "_ref"]
                      for side in ("base", "head") for field in ("sha", "ref"))
                      and all(pr[side]["repo"]["url"] == f"https://api.github.com/repos/{repo}" for side in ("base", "head")), "original recorded PR")


          def native_job(repo, run, name, names):
              jobs = pages(f"repos/{repo}/actions/runs/{run['id']}/attempts/1/jobs?filter=all", "jobs")
              require(len({job["name"] for job in jobs}) == len(jobs), "duplicate job names")
              require(all(type(job["run_id"]) is int and job["run_id"] == run["id"] and type(job["run_attempt"]) is int and job["run_attempt"] == 1
                      and job["head_sha"] == run["head_sha"] and job["status"] == "completed" for job in jobs), "native job binding")
              selected = [job for job in jobs if job["name"] == name]
              require(len(selected) == 1, "native job inventory")
              if names == RESUME_STEPS:
                  others = [job for job in jobs if job["name"] != name]
                  require(len(others) == 1 and others[0]["name"] == "Locate deferred first review request"
                          and others[0]["conclusion"] == "skipped" and others[0].get("runner_id") is None
                          and others[0]["steps"] == [], "resume native job layout")
              job = selected[0]
              require(job["conclusion"] == "success" and positive(job.get("runner_id")), "native job unsuccessful")
              steps = job["steps"]
              require(isinstance(steps, list) and len(steps) == len(names), "native step inventory")
              last = epoch(job["started_at"])
              require(epoch(run["created_at"]) <= last, "job predates run")
              for index, (step, expected) in enumerate(zip(steps, names), 1):
                  require(step["name"] == expected and type(step["number"]) is int and step["number"] == index
                          and step["status"] == "completed" and step["conclusion"] == "success", "native step binding")
                  require(last <= epoch(step["started_at"]) <= epoch(step["completed_at"]), "native step order")
                  last = epoch(step["completed_at"])
              require(last <= epoch(job["completed_at"]) <= epoch(run["updated_at"]), "native job order")
              return job


          def validate_intent(intent, repo, repo_id, key):
              expected = {"schema", "kind", "repository", "repository_id", "operation", "pr", "base", "head",
                          "base_ref", "head_ref", "owner_run", "owner_attempt", "source_sha", "event", "action",
                          "author", "actor", "triggering_actor", "created_at"}
              require(isinstance(intent, dict) and set(intent) == expected and type(intent["schema"]) is int
                      and intent["schema"] == 1 and intent["kind"] == "deferred-first-request"
                      and intent["repository"] == repo and intent["repository_id"] == repo_id and intent["operation"] == key
                      and positive(intent["pr"]) and positive(intent["owner_run"]) and type(intent["owner_attempt"]) is int
                      and intent["owner_attempt"] == 1 and intent["event"] == "pull_request_target"
                      and intent["action"] in {"opened", "ready_for_review", "synchronize"}
                      and intent["author"] == intent["actor"] == intent["triggering_actor"] == "litroc"
                      and intent["base_ref"] in {"develop", "main"} and isinstance(intent["head_ref"], str) and intent["head_ref"]
                      and all(sha(intent[field]) for field in ("base", "head", "source_sha")), "deferred intent")
              require(key == key_for(repo_id, intent["pr"], intent["head"]), "intent budget key")
              repository(repo, repo_id, intent["source_sha"])
              run = original_run(repo, intent)
              job = native_job(repo, run, "Request Copilot review for current revision", ORIGINAL_STEPS)
              require(epoch(job["steps"][2]["started_at"]) <= epoch(intent["created_at"]) <= epoch(job["steps"][2]["completed_at"]), "intent outside original step")
              return run


          def clean_old_review(repo, pr, review_id, head, after, reference_time=None):
              value = api(f"repos/{repo}/pulls/{pr}/reviews/{review_id}")
              require(positive(value["id"]) and value["id"] == review_id and sha(value["commit_id"])
                      and value["commit_id"] != head and value["user"]["login"] in REVIEWERS and value["user"]["type"] == "Bot"
                      and value["state"] in {"COMMENTED", "APPROVED"}
                      and epoch(value["submitted_at"]) >= epoch(after) - 604800, "old review identity")
              # A stale PR-wide Pending flag may outlive completion before owner creation.
              # Original human authority is independent of this ordering; the latest old
              # review must still be no older than seven days at the actual request step.
              reference = epoch(reference_time) if reference_time is not None else dt.datetime.now(dt.timezone.utc).timestamp()
              require(0 <= reference - epoch(value["submitted_at"]) <= 604800, "old review age")
              inline = [item.get("body") for item in pages(f"repos/{repo}/pulls/{pr}/reviews/{review_id}/comments")]
              require_usable_review_content(value.get("body"), inline)
              candidates = [item for item in pages(f"repos/{repo}/pulls/{pr}/reviews")
                            if item.get("user", {}).get("login") in REVIEWERS and item.get("commit_id") != head
                            and epoch(item["submitted_at"]) >= epoch(after) - 604800
                            and (reference_time is None or epoch(item["submitted_at"]) <= reference)]
              require(candidates and max(candidates, key=lambda item: (epoch(item["submitted_at"]), item["id"]))["id"] == review_id,
                      "superseded old review")
              return value


          def unconsumed(repo, intent, journal):
              pr = live_pr(repo, intent["pr"], intent["head"], intent["base"])
              require(pr["head"]["ref"] == intent["head_ref"] and pr["base"]["ref"] == intent["base_ref"], "live ref drift")
              current = api(f"repos/{repo}/actions/runs/{intent['owner_run']}")
              require(current["id"] == intent["owner_run"] and type(current["run_attempt"]) is int
                      and current["run_attempt"] == 1 and current["status"] == "completed" and current["conclusion"] == "failure", "verifier budget spent or active")
              rerun_key = f"li219-verifier-operation:v1:{intent['pr']}:{intent['base']}:{intent['head']}:{intent['owner_run']}"
              require(journal.read(record_path(rerun_key)) is None and journal.read(record_path(intent["operation"])) is None, "consumed operation")
              reviews = pages(f"repos/{repo}/pulls/{intent['pr']}/reviews")
              require(not any(review.get("commit_id") == intent["head"] and review.get("user", {}).get("login") in REVIEWERS for review in reviews), "current-head review exists")
              pending = api(f"repos/{repo}/pulls/{intent['pr']}/requested_reviewers")
              require(isinstance(pending["users"], list) and not any(item["login"] in REVIEWERS for item in pending["users"]), "review still pending")
              comments = pages(f"repos/{repo}/issues/{intent['pr']}/comments")
              markers = (f"<!-- mlx90-copilot-request head={intent['head']} -->",
                         f"<!-- mlx90-copilot-request-uncertain head={intent['head']} -->")
              require(not any(item["user"]["login"] == "github-actions[bot]" and any(marker in item["body"] for marker in markers)
                              for item in comments), "existing request consumption marker")


          def environment():
              repo, repo_id, source = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_REPOSITORY_ID"], os.environ["WORKFLOW_SHA"]
              require(os.environ.get("LI219_EVENT_MODE") == "enabled" and repo in PILOTS, "inactive pilot")
              require(os.environ["GITHUB_RUN_ATTEMPT"] == "1", "attempt")
              return repo, repo_id, source


          def reconcile_candidate(repo, repo_id, pr, head, now):
              """Read-only fallback for the existing bounded ten-minute reconciler."""
              key = key_for(repo_id, pr, head)
              journal = Journal(repo, repo_id)
              intent = journal.read(record_path(key, True))
              if intent is None or journal.read(record_path(key)) is not None:
                  return None
              owner = validate_intent(intent, repo, repo_id, key)
              require(0 <= now.timestamp() - epoch(owner["created_at"]) <= 604800, "expired intent")
              candidates = [item for item in pages(f"repos/{repo}/pulls/{pr}/reviews")
                            if item.get("user", {}).get("login") in REVIEWERS and item.get("commit_id") != head
                            and epoch(item["submitted_at"]) >= epoch(owner["created_at"]) - 604800]
              if not candidates:
                  return None
              review_id = max(candidates, key=lambda item: (epoch(item["submitted_at"]), item["id"]))["id"]
              clean_old_review(repo, pr, review_id, head, owner["created_at"])
              unconsumed(repo, intent, journal)
              return {"pr_number": str(pr), "owner_run": str(owner["id"]), "expected_head": head, "old_review": str(review_id)}


          def defer():
              repo, repo_id, source = environment()
              require(os.environ["GITHUB_EVENT_NAME"] == "pull_request_target" and os.environ["GITHUB_ACTOR"] == "litroc"
                      and os.environ["GITHUB_TRIGGERING_ACTOR"] == "litroc" and os.environ["GITHUB_REF_PROTECTED"] == "true"
                      and os.environ["GITHUB_REF"] in {"refs/heads/develop", "refs/heads/main"}, "original authority")
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(), object_pairs_hook=unique)
              require(event["action"] in {"opened", "ready_for_review", "synchronize"}, "original action")
              pr = live_pr(repo, int(os.environ["PR_NUMBER"]), os.environ["EXPECTED_HEAD"], os.environ["EXPECTED_BASE"])
              require(event["pull_request"]["number"] == pr["number"] and event["pull_request"]["head"]["sha"] == pr["head"]["sha"]
                      and event["pull_request"]["base"]["sha"] == pr["base"]["sha"] and event["pull_request"]["user"]["login"] == "litroc", "event PR")
              repository(repo, repo_id, source)
              key = key_for(repo_id, pr["number"], pr["head"]["sha"])
              intent = {"schema": 1, "kind": "deferred-first-request", "repository": repo, "repository_id": repo_id,
                        "operation": key, "pr": pr["number"], "base": pr["base"]["sha"], "head": pr["head"]["sha"],
                        "base_ref": pr["base"]["ref"], "head_ref": pr["head"]["ref"], "owner_run": int(os.environ["GITHUB_RUN_ID"]),
                        "owner_attempt": 1, "source_sha": source, "event": "pull_request_target", "action": event["action"],
                        "author": "litroc", "actor": "litroc", "triggering_actor": "litroc",
                        "created_at": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}
              original_run(repo, intent, completed=False)
              journal = Journal(repo, repo_id)
              if journal.read(record_path(key)) is not None or journal.read(record_path(key, True)) is not None:
                  return
              # This records eligibility only. No request marker or request budget is spent.
              for attempt in range(3):
                  try:
                      journal.create(record_path(key, True), intent)
                      return
                  except ConfirmedIntentConflict:
                      journal = Journal(repo, repo_id)
                      if journal.read(record_path(key)) is not None or journal.read(record_path(key, True)) is not None:
                          return
                      require(attempt < 2, "deferred intent conflict budget exhausted")
                      live_pr(repo, intent["pr"], intent["head"], intent["base"])
                  except (ValueError, KeyError, TypeError, OSError, subprocess.SubprocessError):
                      # Unknown delivery is GET-only, even when the record is absent.
                      journal = Journal(repo, repo_id)
                      require(journal.read(record_path(key, True)) == intent
                              and journal.read(record_path(key)) is None, "unconfirmed deferred intent")
                      return


          def locate():
              repo, repo_id, source = environment()
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(), object_pairs_hook=unique)
              event_name = os.environ["GITHUB_EVENT_NAME"]
              if event_name == "workflow_run":
                  run = event["workflow_run"]
                  require(event["action"] == "completed" and run["event"] == "pull_request_target" and run["path"] == PRODUCER
                          and type(run["run_attempt"]) is int and run["run_attempt"] == 1
                          and isinstance(run["pull_requests"], list) and len(run["pull_requests"]) <= 1, "companion event")
                  pr_number = run["pull_requests"][0]["number"] if run["pull_requests"] else branch_pr(repo, run)["number"]
              else:
                  require(event_name == "pull_request_review" and event["action"] == "submitted"
                          and event["review"]["user"]["login"] in REVIEWERS, "review completion event")
                  pr_number = event["pull_request"]["number"]
              pr = live_pr(repo, pr_number)
              key = key_for(repo_id, pr_number, pr["head"]["sha"])
              journal = Journal(repo, repo_id)
              intent = journal.read(record_path(key, True))
              if intent is None:
                  return
              owner = validate_intent(intent, repo, repo_id, key)
              if event_name == "workflow_run":
                  require(run["id"] == owner["id"], "companion owner")
                  reviews = [item for item in pages(f"repos/{repo}/pulls/{pr_number}/reviews")
                             if item.get("user", {}).get("login") in REVIEWERS and item.get("commit_id") != intent["head"]
                             and epoch(item["submitted_at"]) >= epoch(owner["created_at"]) - 604800]
                  if not reviews:
                      return
                  review_id = max(reviews, key=lambda item: (epoch(item["submitted_at"]), item["id"]))["id"]
              else:
                  review_id = event["review"]["id"]
              clean_old_review(repo, pr_number, review_id, intent["head"], owner["created_at"])
              unconsumed(repo, intent, journal)
              # Locator only; no input below grants consumer mutation authority.
              api(f"repos/{repo}/actions/workflows/review-request-continuation.yml/dispatches",
                  {"ref": "develop", "inputs": {"pr_number": str(pr_number), "owner_run": str(owner["id"]),
                                                "expected_head": intent["head"], "old_review": str(review_id)}})


          def resume():
              repo, repo_id, source = environment()
              require(os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and os.environ["GITHUB_ACTOR"] == "github-actions[bot]"
                      and os.environ["GITHUB_TRIGGERING_ACTOR"] == "github-actions[bot]" and os.environ["GITHUB_REF_PROTECTED"] == "true"
                      and os.environ["GITHUB_REF"] == "refs/heads/develop", "resume authority")
              repository(repo, repo_id, source)
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(), object_pairs_hook=unique)
              inputs = event["inputs"]
              pr, owner_id, review_id = (int(inputs[key]) for key in ("pr_number", "owner_run", "old_review"))
              require(all(positive(value) for value in (pr, owner_id, review_id)) and sha(inputs["expected_head"]), "resume locators")
              key = key_for(repo_id, pr, inputs["expected_head"])
              journal = Journal(repo, repo_id)
              intent = journal.read(record_path(key, True))
              owner = validate_intent(intent, repo, repo_id, key)
              require(intent["owner_run"] == owner_id, "resume original owner")
              require(0 <= dt.datetime.now(dt.timezone.utc).timestamp() - epoch(owner["created_at"]) <= 604800, "expired intent")
              old = clean_old_review(repo, pr, review_id, intent["head"], owner["created_at"])
              native_resume_run(repo, os.environ["GITHUB_RUN_ID"], source, intent, review_id, completed=False)
              unconsumed(repo, intent, journal)
              record = {"schema": 2, "repository": repo, "repository_id": repo_id, "action": "request", "operation": key,
                        "claim_run": os.environ["GITHUB_RUN_ID"], "claim_attempt": "1", "source_sha": source,
                        "intent": intent, "intent_commit": journal.oid, "old_review": review_id, "old_head": old["commit_id"]}
              journal.create(record_path(key), record)
              # Recheck the live PR at the effect boundary; a consumed stale claim stays closed.
              current = live_pr(repo, pr, intent["head"], intent["base"])
              require(current["base"]["ref"] == intent["base_ref"] and current["head"]["ref"] == intent["head_ref"], "effect ref drift")
              api(f"repos/{repo}/pulls/{pr}/requested_reviewers", {"reviewers": [BOT]})


          def native_resume_run(repo, run_id, source, intent, review_id, completed=True):
              run = api(f"repos/{repo}/actions/runs/{run_id}/attempts/1")
              require(type(run["id"]) is int and str(run["id"]) == run_id and type(run["run_attempt"]) is int and run["run_attempt"] == 1
                      and run["event"] == "workflow_dispatch" and run["path"] == WORKFLOW and run["name"] == "Continue deferred first review request"
                      and run["repository"]["full_name"] == repo and run["head_repository"]["full_name"] == repo
                      and run["head_sha"] == source and run["head_branch"] == "develop"
                      and run["actor"]["login"] == run["triggering_actor"]["login"] == "github-actions[bot]"
                      and run["display_title"] == f"First review PR #{intent['pr']} head {intent['head']} owner {intent['owner_run']} old review {review_id}", "resume native run")
              if completed:
                  require(run["status"] == "completed" and run["conclusion"] == "success", "resume native completion")
              else:
                  require(run["status"] == "in_progress" and run["conclusion"] is None, "resume native active")
              return run


          def verify_receipt(context, record):
              """Read-only Required branch; invoked only after existing verifier-rerun proof."""
              repo, repo_id = context["repository"], context["repository_id"]
              require(set(record) == {"schema", "repository", "repository_id", "action", "operation", "claim_run", "claim_attempt",
                                     "source_sha", "intent", "intent_commit", "old_review", "old_head"}
                      and type(record["schema"]) is int and record["schema"] == 2 and record["repository"] == repo
                      and record["repository_id"] == repo_id and record["action"] == "request" and record["claim_attempt"] == "1"
                      and isinstance(record["claim_run"], str) and re.fullmatch(r"[1-9][0-9]*", record["claim_run"])
                      and sha(record["intent_commit"]), "resume receipt schema")
              intent = record["intent"]
              key = key_for(repo_id, context["owner"], context["head"])
              require(record["operation"] == key, "resume operation")
              original = validate_intent(intent, repo, repo_id, key)
              require(intent["owner_run"] == context["run_id"] and intent["base"] == context["base"]
                      and intent["head"] == context["head"] and intent["base_ref"] == context["base_ref"]
                      and intent["source_sha"] == context["controller"], "resume original context")
              journal = Journal(repo, repo_id)
              journal.oid = record["intent_commit"]
              require(journal.read(record_path(key, True)) == intent and journal.read(record_path(key)) is None, "pre-request intent snapshot")
              repository(repo, repo_id, record["source_sha"])
              run = native_resume_run(repo, record["claim_run"], record["source_sha"], intent, record["old_review"])
              job = native_job(repo, run, "Resume deferred first review request", RESUME_STEPS)
              start, end = epoch(job["steps"][2]["started_at"]), epoch(job["steps"][2]["completed_at"])
              require(epoch(original["updated_at"]) <= start, "resume ordering")
              timeline = context["timeline"]
              require(isinstance(timeline, list) and 0 < len(timeline) <= 10
                      and all(isinstance(page, list) and len(page) <= 100 and all(isinstance(item, dict) for item in page)
                              for page in timeline), "resume timeline pages")
              events = [item for page in context["timeline"] for item in page if item.get("event") == "review_requested"
                        and item.get("requested_reviewer", {}).get("login") == "Copilot"
                        and epoch(original["created_at"]) <= epoch(item["created_at"]) <= epoch(context["review_submitted_at"])]
              require(len(events) == 1 and positive(events[0].get("id")) and events[0]["actor"]["login"] == "github-actions[bot]"
                      and events[0]["actor"]["type"] == "Bot" and start <= epoch(events[0]["created_at"]) <= end, "resume timeline")
              # The authenticated request event, not entry into the effect step, is the
              # historical cutoff. Reviews arriving before the actual POST still supersede.
              old = clean_old_review(repo, intent["pr"], record["old_review"], intent["head"], original["created_at"],
                                     reference_time=events[0]["created_at"])
              require(old["commit_id"] == record["old_head"], "old head proof")


          if __name__ == "__main__":
              try:
                  {"defer": defer, "locate": locate, "resume": resume}[sys.argv[1]]()
              except (KeyError, TypeError, ValueError, OSError, subprocess.SubprocessError) as exc:
                  print(f"First-request continuation stopped: {exc}", file=sys.stderr)
                  sys.exit(1)
          CONTINUATION
      - name: Request Copilot review for the current revision
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${DEFAULT_BRANCH}" = develop
          test "${TRUSTED_WORKFLOW_REF}" = \
            "${REPOSITORY}/.github/workflows/copilot-review.yml@refs/heads/${DEFAULT_BRANCH}"
          default_head="$(gh api "repos/${REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)"
          controller_ancestry="$(gh api \
            "repos/${REPOSITORY}/compare/${TRUSTED_WORKFLOW_SHA}...${default_head}")"
          jq -e \
            --arg controller "${TRUSTED_WORKFLOW_SHA}" '
              .status == "identical"
              or (.status == "ahead" and .behind_by == 0
                  and .merge_base_commit.sha == $controller)
            ' <<<"${controller_ancestry}" >/dev/null
          protected_run="$(gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e \
            --arg branch "${EXPECTED_HEAD_REF}" \
            --arg repository "${REPOSITORY}" \
            --arg sha "${EXPECTED_HEAD}" '
              .event == "pull_request_target"
              and .name == "Current revision review gate"
              and .path == ".github/workflows/copilot-review.yml"
              and .head_branch == $branch
              and .head_sha == $sha
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
            ' <<<"${protected_run}" >/dev/null
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"${pr}")" = open
          test "$(jq -r .draft <<<"${pr}")" = false
          base_ref="$(jq -er '.base.ref | select(. == "develop" or . == "main")' <<<"${pr}")"
          test -n "${base_ref}"
          test "$(jq -r .base.sha <<<"${pr}")" = "${EXPECTED_BASE}"
          test "$(jq -r .base.repo.full_name <<<"${pr}")" = "${REPOSITORY}"
          test "$(jq -r .head.sha <<<"${pr}")" = "${EXPECTED_HEAD}"
          test "$(jq -r .head.repo.full_name <<<"${pr}")" = "${REPOSITORY}"
          author="$(jq -r .user.login <<<"${pr}")"
          if [ "${author}" != litroc ]; then
            echo "Contributor-funded review required; Lightning IT does not request or fund it."
            exit 0
          fi
          reviewer_login="${COPILOT_REVIEWER_LOGIN%\[bot\]}"
          reviewer="${reviewer_login}[bot]"
          requested_reviewers_url="repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers"
          marker="<!-- mlx90-copilot-request head=${EXPECTED_HEAD} -->"
          review_exists_for_head() {
            local reviews
            reviews="$(gh api --paginate --slurp \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
            jq -e \
              --arg reviewer "${reviewer}" \
              --arg head "${EXPECTED_HEAD}" \
              'any(add[];
                  (.user.login == $reviewer or .user.login == ($reviewer | rtrimstr("[bot]")))
                  and .commit_id == $head
                  and (.state == "COMMENTED" or .state == "APPROVED"
                    or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")
                )
              ' <<<"${reviews}" >/dev/null
          }
          if review_exists_for_head; then
            echo "Copilot already reviewed the exact finalized head."
            exit 0
          fi
          reviewer_is_requested() {
            local response
            if ! response="$(gh api "${requested_reviewers_url}")"; then
              return 2
            fi
            jq -e --arg reviewer "${reviewer}" \
              'any(.users[]?; .login == $reviewer or .login == ($reviewer | rtrimstr("[bot]")))' <<<"${response}" >/dev/null
          }
          comments="$(gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          uncertain_marker="<!-- mlx90-copilot-request-uncertain head=${EXPECTED_HEAD} -->"
          reserve_uncertain_request() {
            local uncertain_body observation comments
            uncertain_body="${uncertain_marker}UNCERTAIN: the one request slot is consumed before delivery for head ${EXPECTED_HEAD}; producer ${GITHUB_RUN_ID}. This is not evidence of acceptance."
            # One claim write, then GET-only confirmation. A lost claim response
            # never permits a second claim write or an unreserved paid effect.
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f "body=${uncertain_body}" >/dev/null || true
            for observation in 1 2 3; do
              comments="$(gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")" || return 1
              if jq -e --arg marker "${uncertain_marker}" --arg body "${uncertain_body}" '
                [.[][] | select(.user.login == "github-actions[bot]")
                  | select(.body | contains($marker))]
                | length == 1 and .[0].body == $body
                ' <<<"${comments}" >/dev/null; then
                return 0
              fi
              [ "${observation}" -eq 3 ] || sleep 2
            done
            echo 'Uncertain request reservation is not uniquely confirmed; no review requested.' >&2
            return 1
          }
          marker_exists=false
          if jq -e --arg marker "${marker}" --arg uncertain "${uncertain_marker}" \
            'any(add[]; .user.login == "github-actions[bot]" and (.body | contains($marker) or contains($uncertain)))' \
            <<<"${comments}" >/dev/null; then
            marker_exists=true
          fi
          if [ "${marker_exists}" = true ]; then
            echo "The exact-head Copilot request is consumed; no second request is permitted."
            exit 0
          fi
          if reviewer_is_requested; then
            # PR-scoped pending state never confirms or consumes this head.
            if [ "${LI219_EVENT_MODE:-disabled}" = enabled ]; then
              python3 "${RUNNER_TEMP}/review_request_continuation.py" defer
            fi
            echo "A review is pending; awaiting head-bound evidence without another request."
            exit 0
          else
            request_status=$?
            [ "${request_status}" -eq 1 ] || exit "${request_status}"
          fi
          revalidate_request_head() {
            local current
            current="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" || return 1
            jq -e --arg head "${EXPECTED_HEAD}" --arg base "${EXPECTED_BASE}" \
              --arg repo "${REPOSITORY}" --argjson pr "${PR_NUMBER}" '
                .number == $pr and .state == "open" and .draft == false
                and .user.login == "litroc"
                and .head.sha == $head and .base.sha == $base
                and .head.repo.full_name == $repo and .base.repo.full_name == $repo
              ' <<<"${current}" >/dev/null
          }
          record_request_marker() {
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f "body=${claim_body}" >/dev/null || true
            claim_confirmed=false
            for observation in 1 2 3; do
              comments="$(gh api --paginate --slurp "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
              if jq -e --arg marker "${marker}" --arg body "${claim_body}" '
                [.[][] | select(.user.login == "github-actions[bot]")
                  | select(.body | contains($marker))]
                | length == 1 and .[0].body == $body
                ' <<<"${comments}" >/dev/null; then
                claim_confirmed=true
                break
              fi
              [ "${observation}" -eq 3 ] || sleep 2
            done
            test "${claim_confirmed}" = true
          }
          revalidate_request_head
          claim_body="${marker}Copilot review requested for finalized head ${EXPECTED_HEAD}; producer ${GITHUB_RUN_ID}."
          if [ "${LI219_EVENT_MODE:-disabled}" = enabled ]; then
            # shellcheck source=/dev/null
            source "${RUNNER_TEMP}/request-operation.sh"
            claim_review_operation "${GITHUB_RUN_ID}" "${EXPECTED_HEAD}" "${EXPECTED_BASE}" "${PR_NUMBER}" request || exit 0
            claim_body="${marker}Copilot review request reserved for finalized head ${EXPECTED_HEAD}; producer ${GITHUB_RUN_ID}. CAS commit ${CLAIM_COMMIT}."
            record_request_marker
            revalidate_request_head
          fi
          if [ "${LI219_EVENT_MODE:-disabled}" != enabled ]; then
            reserve_uncertain_request
            revalidate_request_head
          fi
          if ! gh api --method POST "${requested_reviewers_url}" \
              -f "reviewers[]=${reviewer}"; then
            # Pending is PR-scoped and cannot confirm this head's POST.
            # Read back existing state only; never retry or publish acceptance.
            if reviewer_is_requested; then
              echo "A reviewer is pending; exact-head request acceptance remains unconfirmed." >&2
            fi
            echo "Review request response remains uncertain; no retry sent." >&2
            exit 1
          fi
          if [ "${LI219_EVENT_MODE:-disabled}" != enabled ]; then
            # Acceptance is distinct from the pre-effect UNCERTAIN reservation.
            record_request_marker
          fi

  verify-current-revision-policy:
    name: Verify current revision policy
    needs: classify-main-trust-root-handoff
    if: >-
      always() &&
      (needs.classify-main-trust-root-handoff.result == 'success' ||
        needs.classify-main-trust-root-handoff.result == 'skipped') &&
      needs.classify-main-trust-root-handoff.outputs.active != 'true' &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (((github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review') &&
        github.event.pull_request.user.login != 'lightning-it-release-automation[bot]') ||
        ((github.event.action == 'opened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'reopened' ||
          github.event.action == 'ready_for_review') &&
          github.event.pull_request.user.login == 'lightning-it-release-automation[bot]' &&
          github.event.pull_request.base.ref == 'develop' &&
          startsWith(github.event.pull_request.head.ref, 'backmerge/') &&
          endsWith(github.event.pull_request.head.ref, '-main') &&
          startsWith(
            github.event.pull_request.title,
            'chore(governance): record main ancestry before '
          )))
    outputs:
      producer_owner: ${{ steps.producer-owner.outputs.owner }}
      producer_owner_mode: ${{ steps.producer-owner.outputs.owner_mode }}
      producer_run_id: ${{ steps.producer-owner.outputs.owner_run_id }}
      owns_result: ${{ steps.publish-bound-neutral-result.outputs.owns_result }}
      trusted_kind: ${{ steps.trusted-automation.outputs.kind }}
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - &materialize-producer-owner-guard
        name: 'Event binding #${{ github.event.pull_request.number }}:${{ github.event.pull_request.base.sha }}:${{ github.event.pull_request.head.sha }}:${{ github.run_id }}'
        run: |
          set -euo pipefail
          owner_guard="${RUNNER_TEMP}/current-revision-producer-owner.sh"
          umask 077
          cat >"${owner_guard}" <<'PRODUCER_OWNER_GUARD'
          oa() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo 'Producer-owner API read failed after five attempts.' >&2
                return 1
              fi
              sleep 2
            done
          }

          elect_once() {
            local ca cid cands crows
            local crj e fbase fhead
            local flive fpr frows
            local jpages ojp
            local cassoc pj pp rj rpages
            [[ "${PRODUCER_OWNER_MODE}" =~ ^(copilot|verification|deterministic)$ ]] || return 1
            rpages="$(oa --paginate --slurp "repos/${REPOSITORY}/actions/runs?event=pull_request_target&head_sha=${EVENT_HEAD}&per_page=100")" || return 1
            jq -e --arg h "${EVENT_HEAD}" \
              --arg repo "${REPOSITORY}" --argjson n "${PR_NUMBER}" '
              type == "array" and length > 0 and length <= 10
              and all(.[];
                type == "object"
                and (.workflow_runs | type) == "array")
              and all(.[].workflow_runs[]?;
                . as $r
                | type == "object"
                and (.id | type) == "number" and .id > 0
                and .id == (.id | floor)
                and (.run_attempt | type) == "number" and .run_attempt > 0
                and .run_attempt == (.run_attempt | floor)
                and (.status | type) == "string"
                and (((.status | IN("requested", "waiting", "pending", "queued", "in_progress"))
                      and .conclusion == null)
                  or (.status == "completed" and (.conclusion | IN("success", "failure",
                    "neutral", "cancelled", "timed_out", "action_required", "stale",
                    "startup_failure", "skipped"))))
                and (.event | type) == "string" and (.event | length) > 0
                and (.path | type) == "string" and (.path | length) > 0
                and (.name | type) == "string" and (.name | length) > 0
                and (.head_branch | type) == "string"
                and (.head_branch | length) > 0
                and (.head_sha | type) == "string"
                and (.head_sha | test("^[0-9a-f]{40}$"))
                and (.repository | type) == "object"
                and (.repository.full_name | type) == "string"
                and (.repository.full_name | length) > 0
                and (.head_repository | type) == "object"
                and (.head_repository.full_name | type) == "string"
                and (.head_repository.full_name | length) > 0
                and (.pull_requests | type) == "array"
                and (.pull_requests | length) <= 10
                and all(.pull_requests[];
                  type == "object"
                  and (.number | type) == "number" and .number > 0
                  and .number == (.number | floor)
                  and (.base | type) == "object"
                  and (.base.sha | type) == "string"
                  and (.base.sha | test("^[0-9a-f]{40}$"))
                  and (.head | type) == "object"
                  and (.head.sha | type) == "string"
                  and (.head.sha | test("^[0-9a-f]{40}$"))
                  and .head.sha == $r.head_sha
                  and (.head.ref | type) == "string"
                  and (.head.ref | length) > 0
                  and .head.ref == $r.head_branch)
                and (if .event == "pull_request_target"
                    and .path == ".github/workflows/copilot-review.yml"
                    and .name == "Current revision review gate"
                    and .head_sha == $h
                    and .repository.full_name == $repo
                    and .head_repository.full_name == $repo
                  then (.pull_requests | length) <= 1
                  else true end))
              and ([.[].workflow_runs[].id] | length)
                == ([.[].workflow_runs[].id] | unique | length)
              ' <<<"${rpages}" >/dev/null || return 1
            frows="$(jq -cer --arg h "${EVENT_HEAD}" --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" --argjson n "${PR_NUMBER}" '
                [.[].workflow_runs[]
                  | select(.event == "pull_request_target")
                  | select(.path == ".github/workflows/copilot-review.yml")
                  | select(.name == "Current revision review gate")
                  | select(.head_sha == $h)
                  | select(.head_branch == $ref)
                  | select(.repository.full_name == $repo)
                  | select(.head_repository.full_name == $repo)
                  | select((.pull_requests | length) == 1)
                  | .pull_requests[0]
                  | select(.number != $n)
                  | [.number, .base.sha, .head.sha]]
                | unique
                | if length > 10 then error("foreign-pr-inventory-unbounded")
                  else map(@tsv) | join("\n") end
              ' <<<"${rpages}")" || return 1
            while IFS=$'\t' read -r fpr fbase fhead; do
              [ -n "${fpr}" ] || continue
              flive="$(oa "repos/${REPOSITORY}/pulls/${fpr}")" || return 1
              jq -e --arg b "${fbase}" --arg h "${fhead}" --arg repo "${REPOSITORY}" --argjson n "${fpr}" '
                  .number == $n
                  and .base.sha == $b
                  and .base.repo.full_name == $repo
                  and .head.sha == $h
                  and .head.repo.full_name == $repo
                ' <<<"${flive}" >/dev/null || return 1
            done <<<"${frows}"
            if jq -e --arg h "${EVENT_HEAD}" \
              --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" '
                any(.[].workflow_runs[]?;
                  .event == "pull_request_target"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .head_sha == $h
                  and .head_branch == $ref
                  and .repository.full_name == $repo
                  and .head_repository.full_name == $repo
                  and .pull_requests == [])
              ' <<<"${rpages}" >/dev/null; then
              pp="$(oa --method GET --paginate --slurp \
                -f state=open -f "head=${REPOSITORY%%/*}:${EVENT_HEAD_REF}" \
                -F per_page=100 "repos/${REPOSITORY}/pulls")" || return 1
              jq -e --arg b "${LIVE_BASE}" --arg h "${EVENT_HEAD}" \
                --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" \
                --argjson n "${PR_NUMBER}" '
                  type == "array" and length > 0 and length <= 10
                  and all(.[]; type == "array")
                  and ([.[][]] | length) == 1
                  and .[0][0].number == $n
                  and .[0][0].state == "open"
                  and .[0][0].base.sha == $b
                  and .[0][0].base.repo.full_name == $repo
                  and .[0][0].head.ref == $ref
                  and .[0][0].head.sha == $h
                  and .[0][0].head.repo.full_name == $repo
                ' <<<"${pp}" >/dev/null || return 1
            fi
            cands="$(jq -ce --arg b "${EVENT_BASE}" --arg h "${EVENT_HEAD}" --arg ref "${EVENT_HEAD_REF}" --arg repo "${REPOSITORY}" --argjson n "${PR_NUMBER}" '
                [.[].workflow_runs[] |
                  select(.event == "pull_request_target") |
                  select(.path == ".github/workflows/copilot-review.yml") |
                  select(.name == "Current revision review gate") |
                  select(.head_sha == $h) |
                  select(.repository.full_name == $repo) |
                  select(.head_repository.full_name == $repo) |
                  select(any(.pull_requests[]?;
                    .number == $n
                    and .base.sha == $b
                    and .head.sha == $h)
                    or (.pull_requests == [] and .head_branch == $ref))]
                | if length == 0 then error("producer-owner-missing")
                  elif length > 20 then error("producer-owner-overflow")
                  elif ([.[].id] | unique | length) != length
                    then error("producer-owner-run-duplicate")
                  else sort_by(.id) end
              ' <<<"${rpages}")" || return 1
            e='[]'
            crows="$(jq -er '.[] | [.id, .run_attempt, .status, (.pull_requests | length)] | @tsv' <<<"${cands}")" || return 1
            while IFS=$'\t' read -r cid ca cstate cassoc; do
              [[ "${cid}" =~ ^[1-9][0-9]*$ ]] || return 1
              [[ "${ca}" =~ ^(1|2)$ ]] || return 1
              [[ "${cstate}" =~ ^(requested|waiting|pending|queued|in_progress|completed)$ ]] || return 1
              jpages="$(oa --paginate --slurp "repos/${REPOSITORY}/actions/runs/${cid}/attempts/${ca}/jobs?filter=all&per_page=100")" || return 1
              jq -e --arg h "${EVENT_HEAD}" --argjson a "${ca}" --argjson rid "${cid}" '
                type == "array" and length > 0 and length <= 10
                and all(.[]; type == "object" and (.jobs | type) == "array")
                and ([.[].jobs[].id] | length) == ([.[].jobs[].id] | unique | length)
                and all(.[].jobs[]?; type=="object" and (.id|type)=="number" and .id>0
                  and (.name|type)=="string" and .run_id==$rid and .run_attempt==$a and .head_sha==$h and (.status|type)=="string" and has("conclusion"))
                ' <<<"${jpages}" >/dev/null || return 1
              pj="$(jq -ce --arg h "${EVENT_HEAD}" --argjson a "${ca}" --argjson rid "${cid}" '
                  [.[].jobs[] |
                    select(.name == "Verify current revision policy") |
                    select(.run_id == $rid) |
                    select(.run_attempt == $a) |
                    select(.head_sha == $h)]
                  | if length > 1 then error("producer-owner-job-duplicate")
                    else . end
                ' <<<"${jpages}")" || return 1
              if [ "$(jq 'length' <<<"${pj}")" -eq 0 ]; then
                if [[ "${cstate}" =~ ^(requested|waiting|pending|queued)$ ]] &&
                  jq -e 'all(.[].jobs; length == 0)' <<<"${jpages}" >/dev/null &&
                  [ "$(jq 'length' <<<"${e}")" -gt 0 ]; then
                  continue
                fi
                return 1
              fi
              jq -e '
                .[0] as $job
                | (($job.status | IN(
                    "requested", "waiting", "pending", "queued", "in_progress"))
                    and $job.conclusion == null)
                  or ($job.status == "completed"
                    and ($job.conclusion | IN(
                      "success", "failure", "neutral", "cancelled",
                      "timed_out", "action_required", "stale",
                      "startup_failure", "skipped")))
                ' <<<"${pj}" >/dev/null || return 1
              if jq -e '
                  .[0].status == "completed"
                  and .[0].conclusion == "skipped"
                  ' <<<"${pj}" >/dev/null; then
                continue
              fi
              if [ "${cassoc}" -eq 0 ]; then
                jq -e --arg binding "Event binding #${PR_NUMBER}:${EVENT_BASE}:${EVENT_HEAD}:${cid}" '
                    (.[0].steps | type) == "array"
                    and all(.[0].steps[]; (.name | type) == "string")
                    and ([.[0].steps[] | select(.name == $binding)] | length) == 1
                  ' <<<"${pj}" >/dev/null || continue
              fi
              if [ "${PRODUCER_OWNER_MODE}" = copilot ]; then
                crj="$(jq -ce --arg h "${EVENT_HEAD}" --argjson a "${ca}" --argjson rid "${cid}" '
                    [.[].jobs[] |
                      select(.name == "Request Copilot review for current revision") |
                      select(.run_id == $rid) |
                      select(.run_attempt == $a) |
                      select(.head_sha == $h)]
                    | if length > 1 then error("producer-owner-requester-duplicate")
                      else . end
                  ' <<<"${jpages}")" || return 1
                if [ "$(jq 'length' <<<"${crj}")" -eq 0 ]; then
                  return 1
                fi
                jq -e '
                  .[0] as $job
                  | (($job.status | IN(
                      "requested", "waiting", "pending", "queued", "in_progress"))
                      and $job.conclusion == null)
                    or ($job.status == "completed"
                      and ($job.conclusion | IN(
                        "success", "failure", "neutral", "cancelled",
                        "timed_out", "action_required", "stale",
                        "startup_failure", "skipped")))
                  ' <<<"${crj}" >/dev/null || return 1
                if [ "${ca}" -eq 1 ]; then
                  ojp="${jpages}"
                else
                  ojp="$(oa --paginate --slurp "repos/${REPOSITORY}/actions/runs/${cid}/attempts/1/jobs?filter=all&per_page=100")" || return 1
                  jq -e --arg h "${EVENT_HEAD}" --argjson rid "${cid}" '
                    type == "array" and length > 0 and length <= 10
                    and all(.[]; type == "object" and (.jobs | type) == "array")
                    and ([.[].jobs[].id] | length) == ([.[].jobs[].id] | unique | length)
                    and all(.[].jobs[]?; type=="object" and (.id|type)=="number" and .id>0
                      and (.name|type)=="string" and .run_id==$rid and .run_attempt==1 and .head_sha==$h and (.status|type)=="string" and has("conclusion"))
                    ' <<<"${ojp}" >/dev/null || return 1
                fi
                rj="$(jq -ce --arg h "${EVENT_HEAD}" --argjson rid "${cid}" '
                    [.[].jobs[] |
                      select(.name == "Request Copilot review for current revision") |
                      select(.run_id == $rid) |
                      select(.run_attempt == 1) |
                      select(.head_sha == $h)]
                    | if length > 1 then error("producer-owner-original-requester-duplicate")
                      else . end
                  ' <<<"${ojp}")" || return 1
                if [ "$(jq 'length' <<<"${rj}")" -eq 0 ]; then
                  return 1
                fi
                jq -e '
                  .[0] as $job
                  | (($job.status | IN(
                      "requested", "waiting", "pending", "queued", "in_progress"))
                      and $job.conclusion == null)
                    or ($job.status == "completed"
                      and ($job.conclusion | IN(
                        "success", "failure", "neutral", "cancelled",
                        "timed_out", "action_required", "stale",
                        "startup_failure", "skipped")))
                  ' <<<"${rj}" >/dev/null || return 1
                # A skipped requester forbids funding; it does not skip the
                # current-head verification job or transfer its ownership.
              fi
              e="$(jq -cn --argjson current "${e}" --argjson id "${cid}" --argjson a "${ca}" '$current + [{id:$id,run_attempt:$a}]')" || return 1
            done <<<"${crows}"
            jq -er '
              if length == 0 then error("producer-owner-e-missing")
              elif ([.[].id] | unique | length) != length
                then error("producer-owner-e-duplicate")
              else min_by(.id).id end
              ' <<<"${e}" || return 1
          }

          eo() {
            local first second
            first="$(elect_once)" || return 1
            sleep 2
            second="$(elect_once)" || return 1
            if [ "${first}" != "${second}" ]; then
              echo 'Producer-owner inventory changed between stable reads.' >&2
              return 1
            fi
            printf '%s' "${first}"
          }
          PRODUCER_OWNER_GUARD

      - name: Elect immutable current-revision producer owner
        id: producer-owner
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          PRODUCER_OWNER_MODE=verification
          if [ "${PR_AUTHOR}" = litroc ]; then
            PRODUCER_OWNER_MODE=copilot
          fi
          if { [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
              && [[ "${EVENT_HEAD_REF}" =~ ^chore/sync-(shared-assets-lit|repository-quality)- ]]; } \
            || { [ "${PR_AUTHOR}" = "renovate[bot]" ] \
              && [[ "${EVENT_HEAD_REF}" == renovate/* ]]; } \
            || { { [ "${PR_AUTHOR}" = "lightning-it-release-automation[bot]" ] \
                || [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ]; } \
              && [[ "${EVENT_HEAD_REF}" == backmerge/*-main ]]; }; then
            test "${PR_BASE_REF}" = develop
            PRODUCER_OWNER_MODE=deterministic
          fi
          export PRODUCER_OWNER_MODE
          LIVE_BASE="${EVENT_BASE}"
          export LIVE_BASE
          owner_guard="${RUNNER_TEMP}/current-revision-producer-owner.sh"
          # shellcheck source=/dev/null
          source "${owner_guard}"
          owner_run_id="$(eo)"
          [[ "${owner_run_id}" =~ ^[1-9][0-9]*$ ]]
          echo "owner_mode=${PRODUCER_OWNER_MODE}" >>"${GITHUB_OUTPUT}"
          echo "owner_run_id=${owner_run_id}" >>"${GITHUB_OUTPUT}"
          if [ "${GITHUB_RUN_ID}" = "${owner_run_id}" ]; then
            echo 'owner=true' >>"${GITHUB_OUTPUT}"
            echo "Producer ${GITHUB_RUN_ID} owns the exact PR/base/head tuple."
          else
            echo 'owner=false' >>"${GITHUB_OUTPUT}"
            echo "Producer ${GITHUB_RUN_ID} is stale; immutable owner is ${owner_run_id}."
          fi

      - name: Classify trusted automation pull request
        id: trusted-automation
        if: steps.producer-owner.outputs.owner == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          trusted=false
          trusted_kind=none
          live_pr="{}"
          policy_label_events="[]"
          if [ "${PR_AUTHOR}" = "renovate[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == renovate/* ]] \
            && [ "${PR_BASE}" = "develop" ]; then
            if live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
              && jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" \
              --arg head_sha "${PR_HEAD_SHA}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("renovate") != null)
               and ([.labels[].name] | index("dependencies") != null)
               and ([.labels[].name] | index("safe-automerge") != null)
               and ([.labels[].name] | index("breaking-update") == null)' \
                <<<"${live_pr}" >/dev/null \
              && policy_label_events="$(
                gh api --paginate --slurp \
                  "repos/${REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100"
              )" \
              && jq -e \
                --arg safe_label "safe-automerge" \
                --arg breaking_label "breaking-update" \
                --arg author "${PR_AUTHOR}" '
                [ .[][]?
                  | select(
                      (.event == "labeled" or .event == "unlabeled")
                      and (
                        .label.name == $safe_label
                        or .label.name == $breaking_label
                      )
                    )
                  | {
                      event: .event,
                      actor: (.actor.login // ""),
                      created_at: (.created_at // ""),
                      event_id: (.id // 0),
                      label: .label.name
                    }
                ]
                | sort_by(.created_at, .event_id) as $events
                | ([ range(0; ($events | length))
                    | select(
                        $events[.].label == $safe_label
                        and $events[.].event == "labeled"
                      )
                  ] | last) as $last_safe_index
                | $last_safe_index != null
                and $events[$last_safe_index].actor == $author
                and ([
                    $events[]
                    | select(
                        .label == $breaking_label
                        and .event == "labeled"
                      )
                  ] | length == 0)
                and ([
                    $events[]
                    | select(
                        .label == $safe_label
                          and .actor != $author
                      )
                  ] | length == 0)' \
                <<<"${policy_label_events}" >/dev/null; then
              trusted=true
              trusted_kind=renovate
            fi
          elif [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == chore/sync-shared-assets-lit-* ]] \
            && [ "${PR_BASE}" = "develop" ] \
            && { [ "${PR_TITLE}" = "chore: sync shared-assets-lit" ] \
              || [ "${PR_TITLE}" = "chore: sync shared assets" ]; } \
            && live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg author "${PR_AUTHOR}" --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" --arg head_sha "${PR_HEAD_SHA}" --arg title "${PR_TITLE}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha) and (.title == $title)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("chore") != null)
               and ([.labels[].name] | index("shared-assets-lit") != null)' \
              <<<"${live_pr}" >/dev/null; then
            trusted=true
            trusted_kind=shared-assets
          elif [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == chore/sync-repository-quality-* ]] \
            && [ "${PR_BASE}" = "develop" ] \
            && [ "${PR_TITLE}" = "chore: sync repository quality assets" ] \
            && live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg author "${PR_AUTHOR}" --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" --arg head_sha "${PR_HEAD_SHA}" --arg title "${PR_TITLE}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha) and (.title == $title)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("chore") != null)
               and ([.labels[].name] | index("shared-assets-lit") != null)' \
              <<<"${live_pr}" >/dev/null; then
            trusted=true
            trusted_kind=repository-quality
          elif { [ "${PR_AUTHOR}" = "lightning-it-release-automation[bot]" ] \
              || { [ "${REPOSITORY}" = "lightning-it/.github" ] \
                && [ "${PR_AUTHOR}" = "lightning-it-shared-assets-sync[bot]" ]; }; } \
            && [ "${PR_HEAD_REPO}" = "${REPOSITORY}" ] \
            && [[ "${PR_HEAD}" == backmerge/*-main ]] \
            && [ "${PR_BASE}" = "develop" ] \
            && [[ "${PR_TITLE}" == "chore(governance): record main ancestry before "* ]] \
            && live_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg author "${PR_AUTHOR}" --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" --arg head_sha "${PR_HEAD_SHA}" --arg title "${PR_TITLE}" \
              --arg repo "${REPOSITORY}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha) and (.title == $title)
               and (.head.repo.full_name == $repo)' \
              <<<"${live_pr}" >/dev/null; then
            trusted=true
            trusted_kind=ancestry-backmerge
          fi
          {
            echo "trusted=${trusted}"
            echo "kind=${trusted_kind}"
          } >>"${GITHUB_OUTPUT}"

      - name: Accept trusted automation exemption
        if: >-
          steps.producer-owner.outputs.owner == 'true' &&
          steps.trusted-automation.outputs.trusted == 'true'
        run: |
          if [ "${{ steps.trusted-automation.outputs.kind }}" = renovate ]; then
            {
              echo "### Trusted Renovate exemption"
              echo
              echo "Copilot review is not required for this exact-head trusted Renovate PR."
              echo "Trusted identity and policy verification succeeded."
            } >>"${GITHUB_STEP_SUMMARY}"
          elif [[ "${{ steps.trusted-automation.outputs.kind }}" =~ ^(shared-assets|repository-quality)$ ]]; then
            {
              echo "### Provenance-verified managed distribution"
              echo
              echo "The canonical source change was reviewed before distribution."
              echo "Exact App identity, source SHA/run provenance, and target gates are enforced by the required guarded-automerge policy."
            } >>"${GITHUB_STEP_SUMMARY}"
          elif [ "${{ steps.trusted-automation.outputs.kind }}" = ancestry-backmerge ]; then
            echo "The deterministic ancestry exemption is verified against both live branch tips and the single bound ancestry-evidence file."
          else
            echo "Trusted automation PR; Copilot review is delegated to its required guarded-automerge policy."
          fi

      - name: Verify evidence-bound ancestry backmerge
        if: >-
          steps.producer-owner.outputs.owner == 'true' &&
          steps.trusted-automation.outputs.kind == 'ancestry-backmerge'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_commit="$(gh api "repos/${REPOSITORY}/git/commits/${HEAD_SHA}")"
          current_develop="$(gh api "repos/${REPOSITORY}/branches/develop" --jq .commit.sha)"
          current_main="$(gh api "repos/${REPOSITORY}/branches/main" --jq .commit.sha)"
          jq -e \
            --arg develop "${current_develop}" \
            --arg main "${current_main}" \
            '(.parents | length) == 2
             and .parents[0].sha == $develop
             and .parents[1].sha == $main' \
            <<<"${head_commit}" >/dev/null
          test "${BASE_SHA}" = "${current_develop}"
          commit_response="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}")"
          jq -e \
            --arg base "${BASE_SHA}" \
            --arg head "${HEAD_SHA}" \
            --arg main "${current_main}" '
              .sha == $head
              and (.parents | length) == 2
              and .parents[0].sha == $base
              and .parents[1].sha == $main
              and (.files | length) == 1
              and .files[0].filename == ".lit/main-ancestry.json"
              and (.files[0].status == "added" or .files[0].status == "modified")
              and (.files[0].previous_filename == null)
            ' <<<"${commit_response}" >/dev/null
          evidence_response="$(gh api \
            "repos/${REPOSITORY}/contents/.lit/main-ancestry.json?ref=${HEAD_SHA}")"
          jq -e '.type == "file" and .encoding == "base64" and (.size > 0)' \
            <<<"${evidence_response}" >/dev/null
          evidence_json="$(jq -r .content <<<"${evidence_response}" | tr -d '\n' | base64 --decode)"
          jq -e \
            --arg repository "${REPOSITORY}" \
            --arg main "${current_main}" \
            --arg develop "${current_develop}" '
              (keys | sort) == ["develop_parent_sha", "main_sha", "purpose", "repository", "schema_version"]
              and .schema_version == 1
              and .repository == $repository
              and .main_sha == $main
              and .develop_parent_sha == $develop
              and .purpose == "Bind the reviewed main ancestry backmerge."
            ' <<<"${evidence_json}" >/dev/null
          echo "Verified an exact evidence-bound merge of current develop and main tips."

      - name: Verify current Copilot review and resolved findings
        id: verify-copilot-review
        if: >-
          steps.producer-owner.outputs.owner == 'true' &&
          steps.trusted-automation.outputs.trusted != 'true' &&
          github.event.pull_request.user.login != 'lightning-it-release-automation[bot]'
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          verification_script="${RUNNER_TEMP}/verify-current-copilot-review.sh"
          umask 077
          cat >"${verification_script}" <<'VERIFY_COPILOT_REVIEW'
          set -euo pipefail

          owner="${REPOSITORY%%/*}"
          repository="${REPOSITORY#*/}"

          graphql() {
            local api_attempt output
            for api_attempt in $(seq 1 5); do
              if output="$(gh api graphql "$@")"; then
                if jq -e '((.errors // []) | length) == 0' <<<"${output}" >/dev/null; then
                  printf '%s' "${output}"
                  return 0
                fi
                jq -r '.errors[]?.message' <<<"${output}" >&2
              fi
              echo "GitHub GraphQL request failed (attempt ${api_attempt}/5)." >&2
              sleep 5
            done
            return 1
          }

          read -r -d '' review_query <<'GRAPHQL' || true
          query(
            $owner: String!
            $repository: String!
            $number: Int!
            $before: String
          ) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) {
                headRefOid
                reviews(last: 100, before: $before) {
                  pageInfo { hasPreviousPage startCursor }
                  nodes {
                    id
                    author { login }
                    commit { oid }
                    state
                  }
                }
              }
            }
          }
          GRAPHQL

          read -r -d '' review_comments_query <<'GRAPHQL' || true
          query(
            $review: ID!
            $after: String
          ) {
            node(id: $review) {
              ... on PullRequestReview {
                body
                commit { oid }
                pullRequest { headRefOid }
                comments(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes { body }
                }
              }
            }
          }
          GRAPHQL

          review_comments_clean() {
            local review_id="$1" expected_head="$2" after="" response has_next
            local content_counts marker_count content_count meaningful_content=false
            local count_pattern=$'^[0-9]+\t[0-9]+$'
            local -a arguments
            while true; do
              arguments=(
                -f query="${review_comments_query}"
                -f review="${review_id}"
              )
              if [ -n "${after}" ]; then
                arguments+=(-f after="${after}")
              fi

              if ! response="$(graphql "${arguments[@]}")"; then
                return 2
              fi
              if ! jq -e \
                --arg head "${expected_head}" \
                '(.data.node.comments != null)
                  and (.data.node.commit.oid == $head)
                  and (.data.node.pullRequest.headRefOid == $head)' \
                <<<"${response}" >/dev/null; then
                echo "Review ${review_id} no longer matches current head ${expected_head}." >&2
                return 2
              fi

              if ! content_counts="$(
                jq -er \
                  --arg unable_marker "${UNABLE_REVIEW_MARKER}" \
                  --arg no_files_marker "${NO_FILES_REVIEW_MARKER}" \
                  --arg quota_exhausted_marker "${QUOTA_EXHAUSTED_MARKER}" \
                  --arg quota_exceeded_marker "${QUOTA_EXCEEDED_MARKER}" \
                  --arg suppressed_comments_marker "${SUPPRESSED_COMMENTS_MARKER}" \
                  'def normalize_review_text:
                      ascii_downcase
                      | gsub("n[\u0027\u2019]t"; " not")
                      | gsub("\\s"; "");
                  def review_content:
                      (.data.node.body // ""),
                      (.data.node.comments.nodes[]?.body // "");
                  ($unable_marker | normalize_review_text) as $unable
                  | ($no_files_marker | normalize_review_text) as $no_files
                  | ($quota_exhausted_marker | normalize_review_text) as $quota_exhausted
                  | ($quota_exceeded_marker | normalize_review_text) as $quota_exceeded
                  | ($suppressed_comments_marker | normalize_review_text) as $suppressed
                  | [
                    ([
                      review_content
                      | select(
                          normalize_review_text
                          | (
                              contains($unable)
                              or contains($no_files)
                              or contains($quota_exhausted)
                              or contains($quota_exceeded)
                              or contains($suppressed)
                              or contains("notabletoreviewthispullrequest")
                              or contains("nofilestoreview")
                              or contains("notabletoreviewanyfiles")
                              or contains("unabletoreviewanyfiles")
                              or contains("premiumrequestquota")
                              or contains("premiumrequestsquota")
                              or contains("encounteredanerror")
                            )
                        )
                    ] | length),
                    ([
                      review_content
                      | select((gsub("\\s"; "")) != "")
                    ] | length)
                  ]
                  | @tsv' <<<"${response}"
              )"; then
                echo "Unable to parse review content counts for review ${review_id}; refusing to accept the review." >&2
                return 2
              fi
              if [[ ! "${content_counts}" =~ ${count_pattern} ]]; then
                echo "Review ${review_id} returned invalid review content counts; refusing to accept the review." >&2
                return 2
              fi
              IFS=$'\t' read -r marker_count content_count <<<"${content_counts}"
              if [ "${marker_count}" -gt 0 ]; then
                return 1
              fi
              if [ "${content_count}" -gt 0 ]; then
                meaningful_content=true
              fi

              has_next="$(jq -r '.data.node.comments.pageInfo.hasNextPage' <<<"${response}")"
              if [ "${has_next}" != "true" ]; then
                if [ "${meaningful_content}" = true ]; then
                  return 0
                fi
                return 1
              fi
              after="$(jq -r '.data.node.comments.pageInfo.endCursor // empty' <<<"${response}")"
              if [ -z "${after}" ]; then
                echo "Review-comment pagination cursor is missing." >&2
                return 2
              fi
            done
          }

          # A rejected review cannot become acceptable during this run without
          # an edit event, which starts a fresh run through the concurrency
          # group. Cache rejected IDs so marker-only, empty, or whitespace-only
          # reviews cost one detail query per run instead of one query on every
          # polling attempt.
          declare -A rejected_review_ids=()
          review_complete=false
          head_sha=""
          review_observations=40
          [ "${LI219_EVENT_MODE:-disabled}" != enabled ] || review_observations=1
          for attempt in $(seq 1 "${review_observations}"); do
            head_sha=""
            before=""
            request_failed=false
            while true; do
              arguments=(
                -f query="${review_query}"
                -F owner="${owner}"
                -F repository="${repository}"
                -F number="${PR_NUMBER}"
              )
              if [ -n "${before}" ]; then
                arguments+=(-f before="${before}")
              fi

              if ! response="$(graphql "${arguments[@]}")"; then
                request_failed=true
                break
              fi

              page_head_sha="$(jq -r '.data.repository.pullRequest.headRefOid // empty' <<<"${response}")"
              if [ -z "${page_head_sha}" ]; then
                echo "Unable to determine the pull request head SHA." >&2
                exit 1
              fi
              if [ "${page_head_sha}" != "${EVENT_HEAD}" ]; then
                echo "Pull request head no longer matches the producer-bound head ${EVENT_HEAD}." >&2
                exit 1
              fi
              if [ -n "${head_sha}" ] && [ "${head_sha}" != "${page_head_sha}" ]; then
                echo "Pull request head changed during review verification; retrying." >&2
                request_failed=true
                break
              fi
              head_sha="${page_head_sha}"

              candidate_review_ids="$(
                jq -r \
                  --arg head "${head_sha}" \
                  --arg reviewer "${COPILOT_REVIEWER_LOGIN}" \
                  '(.data.repository.pullRequest.reviews.nodes // [])[]
                    | select(
                        (.author.login // "") as $login
                        | ($login == $reviewer or $login == ($reviewer + "[bot]"))
                      )
                    | select(.state == "COMMENTED" or .state == "APPROVED")
                    | select(.commit.oid == $head)
                    | (.id // empty)' <<<"${response}"
              )"
              while IFS= read -r review_id; do
                if [ -z "${review_id}" ]; then
                  continue
                fi
                if [ -n "${rejected_review_ids["${review_id}"]:-}" ]; then
                  continue
                fi
                if review_comments_clean "${review_id}" "${head_sha}"; then
                  review_complete=true
                  break
                else
                  comments_status=$?
                  if [ "${comments_status}" -eq 2 ]; then
                    request_failed=true
                    break
                  fi
                  rejected_review_ids["${review_id}"]=1
                fi
              done <<<"${candidate_review_ids}"
              if [ "${review_complete}" = true ]; then
                break 2
              fi
              if [ "${request_failed}" = true ]; then
                break
              fi

              has_previous="$(jq -r '.data.repository.pullRequest.reviews.pageInfo.hasPreviousPage' <<<"${response}")"
              if [ "${has_previous}" != "true" ]; then
                break
              fi
              before="$(jq -r '.data.repository.pullRequest.reviews.pageInfo.startCursor // empty' <<<"${response}")"
              if [ -z "${before}" ]; then
                echo "Review pagination cursor is missing." >&2
                exit 1
              fi
            done

            if [ "${attempt}" -eq "${review_observations}" ]; then
              if [ "${request_failed}" = true ]; then
                echo "Unable to verify the Copilot review after repeated API or head-change failures." >&2
              else
                echo "GitHub Copilot has not completed a review of current head ${head_sha:-unknown}." >&2
              fi
              exit 1
            fi
            if [ "${request_failed}" = true ]; then
              echo "Retrying review verification after a transient API or head-change failure."
            else
              echo "Waiting for GitHub Copilot to review current head ${head_sha} (attempt ${attempt}/40)."
            fi
            sleep 15
          done

          if [ "${review_complete}" != true ]; then
            echo "GitHub Copilot review verification ended unexpectedly." >&2
            exit 1
          fi

          read -r -d '' thread_query <<'GRAPHQL' || true
          query(
            $owner: String!
            $repository: String!
            $number: Int!
            $after: String
          ) {
            repository(owner: $owner, name: $repository) {
              pullRequest(number: $number) {
                headRefOid
                reviewThreads(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    comments(first: 100) {
                      pageInfo { hasNextPage }
                      nodes { author { login } }
                    }
                  }
                }
              }
            }
          }
          GRAPHQL

          findings_resolved=false
          resolution_observations=20
          [ "${LI219_EVENT_MODE:-disabled}" != enabled ] || resolution_observations=1
          for resolution_attempt in $(seq 1 "${resolution_observations}"); do
            after=""
            unresolved_copilot_threads=0
            request_failed=false
            while true; do
              arguments=(
                -f query="${thread_query}"
                -F owner="${owner}"
                -F repository="${repository}"
                -F number="${PR_NUMBER}"
              )
              if [ -n "${after}" ]; then
                arguments+=(-f after="${after}")
              fi

              if ! response="$(graphql "${arguments[@]}")"; then
                request_failed=true
                break
              fi

              page_head_sha="$(jq -r '.data.repository.pullRequest.headRefOid // empty' <<<"${response}")"
              if [ "${page_head_sha}" != "${head_sha}" ]; then
                echo "Pull request head changed during thread verification; retrying." >&2
                request_failed=true
                break
              fi

              incomplete_thread_comments="$(
                jq '[
                  (.data.repository.pullRequest.reviewThreads.nodes // [])[]
                  | select(.comments.pageInfo.hasNextPage == true)
                ] | length' <<<"${response}"
              )"
              if [ "${incomplete_thread_comments}" -gt 0 ]; then
                echo "Review-thread comments exceed the verified page; refusing to publish PASS." >&2
                exit 1
              fi

              page_unresolved="$(
                jq \
                  --arg reviewer "${COPILOT_REVIEWER_LOGIN}" \
                  '[
                    (.data.repository.pullRequest.reviewThreads.nodes // [])[]
                    | select(.isResolved == false)
                    | select(
                        any(
                          .comments.nodes[]?;
                          (.author.login // "") as $login
                          | ($login == $reviewer
                            or $login == ($reviewer + "[bot]"))
                        )
                      )
                  ]
                  | length' <<<"${response}"
              )"
              unresolved_copilot_threads=$((unresolved_copilot_threads + page_unresolved))

              has_next="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"${response}")"
              if [ "${has_next}" != "true" ]; then
                break
              fi
              after="$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor // empty' <<<"${response}")"
              if [ -z "${after}" ]; then
                echo "Review-thread pagination cursor is missing." >&2
                exit 1
              fi
            done

            if [ "${request_failed}" = false ] && [ "${unresolved_copilot_threads}" -eq 0 ]; then
              findings_resolved=true
              break
            fi
            if [ "${resolution_attempt}" -eq "${resolution_observations}" ]; then
              if [ "${request_failed}" = true ]; then
                echo "Unable to verify Copilot review threads after repeated API or head-change failures." >&2
              else
                echo "${unresolved_copilot_threads} unresolved GitHub Copilot review thread(s) remain." >&2
              fi
              exit 1
            fi
            echo "Waiting for GitHub Copilot findings to be resolved (attempt ${resolution_attempt}/20)."
            sleep 15
          done

          if [ "${findings_resolved}" != true ]; then
            echo "GitHub Copilot thread verification ended unexpectedly." >&2
            exit 1
          fi

          echo "GitHub Copilot reviewed current head ${head_sha}; no unresolved Copilot findings remain."
          VERIFY_COPILOT_REVIEW
          bash "${verification_script}"

      - name: Publish bound neutral result
        id: publish-bound-neutral-result
        if: steps.producer-owner.outputs.owner == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          LIVE_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER_RUN_ID: ${{ steps.producer-owner.outputs.owner_run_id }}
          PRODUCER_OWNER_MODE: ${{ steps.producer-owner.outputs.owner_mode }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_KIND: ${{ steps.trusted-automation.outputs.kind }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          api_read() {
            local attempt output
            for attempt in $(seq 1 5); do
              if output="$(gh api "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "GitHub API read failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          test -f "${RUNNER_TEMP}/current-revision-producer-owner.sh"
          test ! -L "${RUNNER_TEMP}/current-revision-producer-owner.sh"
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/current-revision-producer-owner.sh"
          ro() {
            local live_owner
            live_owner="$(eo)"
            test "${live_owner}" = "${OWNER_RUN_ID}"
            test "${live_owner}" = "${GITHUB_RUN_ID}"
          }
          vc() {
            local check_id="$1" external_id="$2" check_name="$3"
            local expected_details_url="$4" recovery_evidence recovery_identity
            local snapshot
            recovery_evidence="$(jq -cn \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --argjson check_run_id "${check_id}" \
              --argjson producer_run_id "${OWNER_RUN_ID}" '
                {schema:4,base_sha:$base,head_sha:$head,
                  producer_run_id:$producer_run_id,
                  invalidated_check_run_id:$check_run_id,
                  reason:"canonical refresh invalidation"}
              ')" || return 1
            snapshot="$(api_read \
              "repos/${REPOSITORY}/check-runs/${check_id}")" || return 1
            if jq -e \
              --arg check_name "${check_name}" \
              --arg details_url "${expected_details_url}" \
              --arg evidence "${evidence}" \
              --arg external_id "${external_id}" \
              --arg head "${EVENT_HEAD}" \
              --argjson check_id "${check_id}" '
                .id == $check_id
                and .name == $check_name
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .head_sha == $head
                and .external_id == $external_id
                and .status == "completed"
                and ($details_url == "" or .details_url == $details_url)
                and .conclusion == "success"
                and .output.summary == $evidence
              ' <<<"${snapshot}" >/dev/null; then
              return 0
            fi
            jq -e \
              --arg check_name "${check_name}" \
              --arg details_url "${expected_details_url}" \
              --arg external_id "${external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg recovery_evidence "${recovery_evidence}" \
              --argjson check_id "${check_id}" '
                .id == $check_id
                and .name == $check_name
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .head_sha == $head
                and .external_id == $external_id
                and .status == "completed"
                and ($details_url == "" or .details_url == $details_url)
                and (.completed_at | type) == "string"
                and .conclusion == "failure"
                and .output.title == "Current revision review invalidated"
                and .output.summary == $recovery_evidence
              ' <<<"${snapshot}" >/dev/null || return 1
            recovery_identity="$(jq -cer \
              '[.id,.completed_at,.external_id,.output.summary] | @json' \
              <<<"${snapshot}")" || return 1
            if [ "${TRUSTED_KIND}" = none ]; then
              test -f "${RUNNER_TEMP}/verify-current-copilot-review.sh" \
                || return 1
              test ! -L "${RUNNER_TEMP}/verify-current-copilot-review.sh" \
                || return 1
              bash "${RUNNER_TEMP}/verify-current-copilot-review.sh" >&2 \
                || return 1
            elif [[ "${TRUSTED_KIND}" =~ ^(shared-assets|repository-quality|renovate|ancestry-backmerge)$ ]]; then
              echo "Deterministic ${TRUSTED_KIND} evidence was revalidated after refresh invalidation." >&2
            else
              return 1
            fi
            ro || return 1
            snapshot="$(api_read \
              "repos/${REPOSITORY}/check-runs/${check_id}")" || return 1
            jq -e \
              --arg check_name "${check_name}" \
              --arg details_url "${expected_details_url}" \
              --arg external_id "${external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg recovery_evidence "${recovery_evidence}" \
              --arg recovery_identity "${recovery_identity}" \
              --argjson check_id "${check_id}" '
                .id == $check_id
                and .name == $check_name
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .head_sha == $head
                and .external_id == $external_id
                and .status == "completed"
                and ($details_url == "" or .details_url == $details_url)
                and (.completed_at | type) == "string"
                and .conclusion == "failure"
                and .output.title == "Current revision review invalidated"
                and .output.summary == $recovery_evidence
                and ([.id,.completed_at,.external_id,.output.summary] | @json)
                  == $recovery_identity
              ' <<<"${snapshot}" >/dev/null || return 1
          }
          api_patch_bound() {
            local check_id="$1" external_id="$2" check_name="$3"
            local expected_details_url="$4" attempt output
            shift 4
            for attempt in $(seq 1 5); do
              ro || return 1
              vc \
                "${check_id}" "${external_id}" "${check_name}" \
                "${expected_details_url}" || return 1
              if output="$(gh api --method PATCH "$@")"; then
                printf '%s' "${output}"
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "Bound GitHub check update failed after five attempts." >&2
                return 1
              fi
              sleep 5
            done
          }
          [[ "${EVENT_BASE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${OWNER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_RUN_ID}" = "${OWNER_RUN_ID}"
          ro
          test "${DEFAULT_BRANCH}" = develop
          test "${TRUSTED_WORKFLOW_REF}" = \
            "${REPOSITORY}/.github/workflows/copilot-review.yml@refs/heads/${DEFAULT_BRANCH}"
          default_head="$(gh api "repos/${REPOSITORY}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)"
          controller_ancestry="$(gh api \
            "repos/${REPOSITORY}/compare/${TRUSTED_WORKFLOW_SHA}...${default_head}")"
          jq -e \
            --arg controller "${TRUSTED_WORKFLOW_SHA}" '
              .status == "identical"
              or (.status == "ahead" and .behind_by == 0
                  and .merge_base_commit.sha == $controller)
            ' <<<"${controller_ancestry}" >/dev/null
          protected_run="$(gh api "repos/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          jq -e \
            --arg branch "${EVENT_HEAD_REF}" \
            --arg repository "${REPOSITORY}" \
            --arg sha "${EVENT_HEAD}" '
              .event == "pull_request_target"
              and .name == "Current revision review gate"
              and .path == ".github/workflows/copilot-review.yml"
              and .head_branch == $branch
              and .head_sha == $sha
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
            ' <<<"${protected_run}" >/dev/null
          pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r .state <<<"${pr}")" = open
          test "$(jq -r .draft <<<"${pr}")" = false
          test "$(jq -r .head.sha <<<"${pr}")" = "${EVENT_HEAD}"
          test "$(jq -r .base.sha <<<"${pr}")" = "${EVENT_BASE}"
          base_ref="$(jq -er '.base.ref | select(. == "develop" or . == "main")' <<<"${pr}")"
          test -n "${base_ref}"
          test "$(jq -r .base.repo.full_name <<<"${pr}")" = "${REPOSITORY}"
          author="$(jq -r .user.login <<<"${pr}")"
          review_path="applicable Copilot or governed automation exemption"
          external_kind="copilot"
          result_title="Current revision review passed"
          if [[ "${TRUSTED_KIND}" =~ ^(shared-assets|repository-quality)$ ]]; then
            test "${author}" = 'lightning-it-shared-assets-sync[bot]'
            test "${base_ref}" = develop
            review_path="deterministic provenance-bound managed distribution exemption"
            external_kind="managed-sync"
            result_title="Current revision managed distribution exemption passed"
          elif [ "${TRUSTED_KIND}" = renovate ]; then
            test "${author}" = 'renovate[bot]'
            test "${base_ref}" = develop
            review_path="deterministic policy-bound Renovate exemption"
            external_kind="renovate"
            result_title="Current revision Renovate exemption passed"
          elif [ "${TRUSTED_KIND}" = ancestry-backmerge ]; then
            if [ "${author}" = 'lightning-it-release-automation[bot]' ]; then
              :
            else
              test "${REPOSITORY}" = "lightning-it/.github"
              test "${author}" = 'lightning-it-shared-assets-sync[bot]'
            fi
            test "${TRUSTED_KIND}" = ancestry-backmerge
            test "${base_ref}" = develop
            [[ "${EVENT_HEAD_REF}" == backmerge/*-main ]]
            [[ "$(jq -r .title <<<"${pr}")" == \
              "chore(governance): record main ancestry before "* ]]
            head_commit="$(gh api "repos/${REPOSITORY}/git/commits/${EVENT_HEAD}")"
            current_main="$(gh api "repos/${REPOSITORY}/branches/main" --jq .commit.sha)"
            test "${default_head}" = "${EVENT_BASE}"
            jq -e \
              --arg develop "${default_head}" \
              --arg main "${current_main}" \
              '(.parents | length) == 2
               and .parents[0].sha == $develop
               and .parents[1].sha == $main' \
              <<<"${head_commit}" >/dev/null
            commit_response="$(gh api "repos/${REPOSITORY}/commits/${EVENT_HEAD}")"
            jq -e \
              --arg base "${EVENT_BASE}" \
              --arg head "${EVENT_HEAD}" \
              --arg main "${current_main}" '
                .sha == $head
                and (.parents | length) == 2
                and .parents[0].sha == $base
                and .parents[1].sha == $main
                and (.files | length) == 1
                and .files[0].filename == ".lit/main-ancestry.json"
                and (.files[0].status == "added" or .files[0].status == "modified")
                and (.files[0].previous_filename == null)
              ' <<<"${commit_response}" >/dev/null
            evidence_response="$(gh api \
              "repos/${REPOSITORY}/contents/.lit/main-ancestry.json?ref=${EVENT_HEAD}")"
            jq -e '.type == "file" and .encoding == "base64" and (.size > 0)' \
              <<<"${evidence_response}" >/dev/null
            evidence_json="$(jq -r .content <<<"${evidence_response}" | tr -d '\n' | base64 --decode)"
            jq -e \
              --arg repository "${REPOSITORY}" \
              --arg main "${current_main}" \
              --arg develop "${default_head}" '
                (keys | sort) == ["develop_parent_sha", "main_sha", "purpose", "repository", "schema_version"]
                and .schema_version == 1
                and .repository == $repository
                and .main_sha == $main
                and .develop_parent_sha == $develop
                and .purpose == "Bind the reviewed main ancestry backmerge."
              ' <<<"${evidence_json}" >/dev/null
            review_path="deterministic evidence-bound ancestry exemption"
            external_kind="ancestry-backmerge"
            result_title="Current revision deterministic exemption passed"
          else
            test "${TRUSTED_KIND}" != shared-assets
            test "${TRUSTED_KIND}" != repository-quality
            test "${TRUSTED_KIND}" != renovate
            test "${TRUSTED_KIND}" != ancestry-backmerge
            test "${author}" != 'lightning-it-shared-assets-sync[bot]'
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${TRUSTED_KIND}" = renovate ]; then
            renovate_labels_json="$(jq -cer '
              if (.labels | type) == "array"
                and all(.labels[]?;
                  type == "object" and (.name | type) == "string")
              then [.labels[].name] | sort
              else error("malformed Renovate pull-request labels") end
              ' <<<"${pr}")"
            renovate_labels_sha256="$(printf '%s' "${renovate_labels_json}" \
              | sha256sum | cut -d ' ' -f 1)"
            [[ "${renovate_labels_sha256}" =~ ^[0-9a-f]{64}$ ]]
            renovate_last_edited_at="$(jq -r '.last_edited_at // "null"' \
              <<<"${pr}")"
            renovate_head_repository="$(jq -er \
              '.head.repo.full_name | select(type == "string" and length > 0)' \
              <<<"${pr}")"
            test "${renovate_head_repository}" = "${REPOSITORY}"
            evidence="$(jq -cn \
              --arg base "${EVENT_BASE}" \
              --arg controller "${TRUSTED_WORKFLOW_SHA}" \
              --arg controller_ref "${DEFAULT_BRANCH}" \
              --arg head "${EVENT_HEAD}" \
              --arg head_repository "${renovate_head_repository}" \
              --arg labels_sha256 "${renovate_labels_sha256}" \
              --arg last_edited_at "${renovate_last_edited_at}" \
              --arg review_path "${review_path}" \
              --argjson pr_number "${PR_NUMBER}" \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --arg run_url "${run_url}" \
              '{schema:4,base_sha:$base,controller_ref:$controller_ref,
                controller_sha:$controller,head_repository:$head_repository,
                head_sha:$head,producer_run_id:$run_id,
                pull_request_labels_sha256:$labels_sha256,
                pull_request_last_edited_at:(if $last_edited_at == "null"
                  then null else $last_edited_at end),
                pull_request_number:$pr_number,review_id:null,
                review_path:$review_path,run_url:$run_url}')"
          else
            evidence="$(jq -cn \
              --arg base "${EVENT_BASE}" \
              --arg controller "${TRUSTED_WORKFLOW_SHA}" \
              --arg head "${EVENT_HEAD}" \
              --arg review_path "${review_path}" \
              --argjson pr_number "${PR_NUMBER}" \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --arg run_url "${run_url}" \
              '{schema:4,base_sha:$base,head_sha:$head,controller_sha:$controller,
                pull_request_number:$pr_number,producer_run_id:$run_id,
                review_path:$review_path,run_url:$run_url}')"
          fi
          publish_once() {
            local check_name="$1" external_id="$2" title="$3"
            local checks named count check_id check_url completed_at created
            local owner_attempt owner_id owner_jobs owner_pr owner_run owner_snapshot
            local recovered recovery_attempt updated
            read_named_checks() {
              checks="$(api_read --paginate --slurp \
                "repos/${REPOSITORY}/commits/${EVENT_HEAD}/check-runs?check_name=$(jq -rn --arg value "${check_name}" '$value|@uri')&filter=all&per_page=100")" || return 1
              jq -ce \
                --arg name "${check_name}" \
                'select(type == "array" and length > 0
                  and all(.[]; type == "object"
                    and (.total_count | type == "number" and . >= 0 and floor == .)
                    and (.check_runs | type == "array"))) |
                [.[].check_runs[]] as $inventory |
                select(all(.[]; .total_count == ($inventory | length))
                  and ($inventory | all(.[]; type == "object"
                    and (.id | type == "number" and . > 0 and floor == .)
                    and (.name | type == "string")
                    and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                    and (.status | type == "string")
                    and has("conclusion")
                    and (.external_id | type | IN("string", "null"))
                    and (.details_url | type | IN("string", "null"))
                    and (.output | type == "object")
                    and (.output.summary | type | IN("string", "null"))
                    and (.app | type == "object")
                    and (.app.id | type == "number" and . > 0 and floor == .)
                    and (.app.slug | type == "string" and length > 0)))
                  and ($inventory | map(.id) | unique | length) == ($inventory | length)) |
                [$inventory[] |
                  select(.name == $name) |
                  select(.app.id == 15368 and .app.slug == "github-actions")]' \
                <<<"${checks}"
            }
            reuse_permanent_owner() {
              owner_snapshot="${named}"
              owner_id="$(jq -er '.[0].output.summary | fromjson |
                .producer_run_id | select(type == "number" and . > 0 and floor == .)' \
                <<<"${named}")" || return 1
              owner_pr="$(jq -er '.[0].output.summary | fromjson |
                .pull_request_number |
                select(type == "number" and . > 0 and floor == .)' \
                <<<"${named}")" || return 1
              jq -e --argjson expected "${evidence}" \
                --argjson owner "${owner_id}" --argjson owner_pr "${owner_pr}" \
                --arg repository "${REPOSITORY}" \
                --arg server "${GITHUB_SERVER_URL}" --arg title "${result_title}" '
                  .[0] as $check | ($check.output.summary | fromjson) as $actual |
                  $check.head_sha == $expected.head_sha
                  and $check.status == "completed" and $check.conclusion == "success"
                  and $check.output.title == $title
                  and ($check.id | type == "number" and . > 0 and floor == .)
                  and $check.details_url == ($server + "/" + $repository + "/runs/" + ($check.id|tostring))
                  and $check.external_id == ("mlx90-current-revision:copilot:v6:"
                    + ($owner_pr|tostring) + ":" + ($owner|tostring)
                    + ":" + $expected.base_sha + ":" + $expected.head_sha)
                  and $actual.run_url == ($server + "/" + $repository + "/actions/runs/" + ($owner|tostring))
                  and $actual.pull_request_number == $owner_pr
                  and ($actual | del(.pull_request_number, .producer_run_id, .run_url))
                    == ($expected | del(.pull_request_number, .producer_run_id, .run_url))
                ' <<<"${named}" >/dev/null || return 1
              owner_run="$(api_read "repos/${REPOSITORY}/actions/runs/${owner_id}")" || return $?
              owner_attempt="$(jq -er '
                .run_attempt | select(type == "number" and (. == 1 or . == 2))
                ' <<<"${owner_run}")" || return 1
              jq -e --argjson owner "${owner_id}" --argjson owner_pr "${owner_pr}" \
                --argjson owner_attempt "${owner_attempt}" \
                --arg repository "${REPOSITORY}" --arg head "${EVENT_HEAD}" \
                --arg base "${EVENT_BASE}" --arg ref "${EVENT_HEAD_REF}" \
                --arg api "${GITHUB_API_URL}" '
                  .id == $owner and .run_attempt == $owner_attempt
                  and .event == "pull_request_target"
                  and .path == ".github/workflows/copilot-review.yml"
                  and .name == "Current revision review gate"
                  and .repository.full_name == $repository
                  and .head_repository.full_name == $repository
                  and .head_sha == $head and .head_branch == $ref
                  and (.status == "completed" and .conclusion == "success")
                  and (.pull_requests | type == "array" and length == 1)
                  and .pull_requests[0].number == $owner_pr
                  and .pull_requests[0].base.sha == $base
                  and .pull_requests[0].base.repo.url == ($api + "/repos/" + $repository)
                  and .pull_requests[0].head.sha == $head
                  and .pull_requests[0].head.ref == $ref
                  and .pull_requests[0].head.repo.url == ($api + "/repos/" + $repository)
                ' <<<"${owner_run}" >/dev/null || return 1
              owner_jobs="$(api_read --paginate --slurp \
                "repos/${REPOSITORY}/actions/runs/${owner_id}/attempts/${owner_attempt}/jobs?filter=all&per_page=100")" || return $?
              jq -e --argjson owner "${owner_id}" \
                --argjson owner_attempt "${owner_attempt}" --arg head "${EVENT_HEAD}" '
                select(type == "array" and length > 0 and length <= 10
                  and all(.[]; type == "object"
                    and (.total_count | type == "number" and . >= 1 and floor == .)
                    and (.jobs | type == "array"))) |
                [.[].jobs[]] as $all |
                select(all(.[]; .total_count == ($all | length))
                  and ($all | map(.id) | unique | length) == ($all | length)
                  and ($all | all(.[];
                    type == "object"
                    and (.id | type == "number" and . > 0 and floor == .)
                    and (.name | type == "string" and length > 0)
                    and .run_id == $owner and .run_attempt == $owner_attempt
                    and .head_sha == $head
                    and .status == "completed"
                    and (.conclusion | IN("success", "skipped"))
                    and (.steps | type == "array")
                    and all(.steps[]?;
                      type == "object"
                      and (.name | type == "string" and length > 0)
                      and .status == "completed"
                      and (.conclusion | IN("success", "skipped")))))) |
                [$all[] | select(.name == "Verify current revision policy")] as $jobs |
                select(($jobs | length) == 1) |
                $jobs[0] as $policy |
                [$policy.steps[] | select(.name == "Verify current Copilot review and resolved findings"
                  or .name == "Publish bound neutral result")] as $critical |
                select(
                  ($policy.runner_id | type == "number" and . > 0 and floor == .)
                  and $policy.conclusion == "success"
                  and ($critical | length) == 2
                  and ($critical | map(.name) | unique | length) == 2
                  and ($critical | all(.[]; .conclusion == "success")))
                ' <<<"${owner_jobs}" >/dev/null || return 1
              if [ "${TRUSTED_KIND}" = none ]; then
                test -f "${RUNNER_TEMP}/verify-current-copilot-review.sh" || return 1
                test ! -L "${RUNNER_TEMP}/verify-current-copilot-review.sh" || return 1
                bash "${RUNNER_TEMP}/verify-current-copilot-review.sh" >&2 || return 1
              else
                return 1
              fi
              ro || return 1
              named="$(read_named_checks)" || return $?
              test "$(jq -cS . <<<"${named}")" = \
                "$(jq -cS . <<<"${owner_snapshot}")" || return 1
              printf 'reused:%s' "$(jq -er '.[0].id' <<<"${named}")"
            }
            named="$(read_named_checks)" || return $?
            count="$(jq 'length' <<<"${named}")"
            if [ "${count}" -gt 1 ]; then
              echo "Multiple protected ${check_name} results exist for ${EVENT_HEAD}." >&2
              return 1
            fi
            if [ "${count}" -eq 1 ] && [ "${external_kind}" = copilot ] \
              && [ "$(jq -r '.[0].output.summary | fromjson | .producer_run_id' \
                <<<"${named}")" != "${GITHUB_RUN_ID}" ]; then
              reuse_permanent_owner
              return $?
            fi
            if [ "${count}" -eq 1 ]; then
              check_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"${named}")"
              check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
              # A new bound producer must refresh the terminal timestamp. GitHub's
              # strict status policy can otherwise retain the check as expected.
              completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              vc \
                "${check_id}" "${external_id}" "${check_name}" "${check_url}"
              updated="$(api_patch_bound \
                "${check_id}" "${external_id}" "${check_name}" "${check_url}" \
                "repos/${REPOSITORY}/check-runs/${check_id}" \
                -f status=completed \
                -f conclusion=success \
                -f "completed_at=${completed_at}" \
                -f "details_url=${check_url}" \
                -f "external_id=${external_id}" \
                -f "output[title]=${title}" \
                -f "output[summary]=${evidence}")"
              jq -e \
                --arg check_name "${check_name}" \
                --arg completed_at "${completed_at}" \
                --arg evidence "${evidence}" \
                --arg external_id "${external_id}" \
                --arg head "${EVENT_HEAD}" \
                --arg url "${check_url}" \
                --argjson check_id "${check_id}" '
                  .id == $check_id
                  and .name == $check_name
                  and .app.id == 15368
                  and .app.slug == "github-actions"
                  and .head_sha == $head
                  and .details_url == $url
                  and .external_id == $external_id
                  and .completed_at == $completed_at
                  and .status == "completed"
                  and .conclusion == "success"
                  and .output.summary == $evidence
                ' <<<"${updated}" >/dev/null
              printf '%s' "${check_id}"
              return
            fi
            # The repository/head/check-name publisher lane is serialized above. Re-elect
            # the immutable owner and require two identical complete zero-check
            # inventories before the only allowed create. A queued loser can
            # therefore only validate and reuse the permanent owner.
            ro
            owner_snapshot="$(read_named_checks)" || return $?
            sleep 2
            ro
            named="$(read_named_checks)" || return $?
            test "$(jq -cS . <<<"${named}")" = \
              "$(jq -cS . <<<"${owner_snapshot}")" || return 1
            count="$(jq 'length' <<<"${named}")"
            if [ "${count}" -gt 1 ]; then
              echo "Multiple protected ${check_name} results exist for ${EVENT_HEAD}." >&2
              return 1
            fi
            if [ "${count}" -eq 1 ]; then
              if [ "${external_kind}" = copilot ] \
                && [ "$(jq -r '.[0].output.summary | fromjson | .producer_run_id' \
                  <<<"${named}")" != "${GITHUB_RUN_ID}" ]; then
                reuse_permanent_owner
                return $?
              fi
              echo "Serialized publisher inventory changed before create." >&2
              return 1
            fi
            if ! created="$(gh api --method POST "repos/${REPOSITORY}/check-runs" \
                -f name="${check_name}" \
                -f head_sha="${EVENT_HEAD}" \
                -f status=completed \
                -f conclusion=success \
                -f external_id="${external_id}" \
                -f "output[title]=${title}" \
                -f "output[summary]=${evidence}")"; then
              # Never retry a create blindly: GitHub can materialize the check
              # even when the client receives a non-success response. Recover
              # only one exact app/head/external-id result.
              created=''
              for recovery_attempt in $(seq 1 5); do
                echo "Recovering protected check creation outcome (attempt ${recovery_attempt}/5)." >&2
                sleep 5
                named="$(read_named_checks)"
                recovered="$(jq -c \
                  --arg external_id "${external_id}" \
                  --arg head "${EVENT_HEAD}" '
                    [.[] |
                      select(.head_sha == $head) |
                      select(.external_id == $external_id)]
                  ' <<<"${named}")"
                if [ "$(jq 'length' <<<"${named}")" -gt 1 ] \
                  || [ "$(jq 'length' <<<"${recovered}")" -gt 1 ]; then
                  echo "Ambiguous protected check creation outcome." >&2
                  return 1
                fi
                if [ "$(jq 'length' <<<"${recovered}")" -eq 1 ]; then
                  created="$(jq -c '.[0]' <<<"${recovered}")"
                  break
                fi
              done
              if [ -z "${created}" ]; then
                echo "Protected check creation failed without a materialized exact result." >&2
                return 1
              fi
            fi
            check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"${created}")"
            check_url="${GITHUB_SERVER_URL}/${REPOSITORY}/runs/${check_id}"
            vc \
              "${check_id}" "${external_id}" "${check_name}" ''
            created="$(api_patch_bound \
              "${check_id}" "${external_id}" "${check_name}" '' \
              "repos/${REPOSITORY}/check-runs/${check_id}" \
              -f "details_url=${check_url}")"
            jq -e \
              --arg evidence "${evidence}" \
              --arg external_id "${external_id}" \
              --arg head "${EVENT_HEAD}" \
              --arg url "${check_url}" \
              --argjson check_id "${check_id}" '
                .id == $check_id
                and .app.id == 15368
                and .app.slug == "github-actions"
                and .head_sha == $head
                and .details_url == $url
                and .external_id == $external_id
                and .status == "completed"
                and .conclusion == "success"
                and .output.summary == $evidence
                ' <<<"${created}" >/dev/null
            named="$(read_named_checks)" || return $?
            test "$(jq 'length' <<<"${named}")" -eq 1
            test "$(jq -er '.[0].id' <<<"${named}")" = "${check_id}"
            test "$(jq -er '.[0].external_id' <<<"${named}")" = "${external_id}"
            printf '%s' "${check_id}"
          }
          record_publication_ownership() {
            local published_check_id="$1"
            if [[ "${published_check_id}" =~ ^reused:[1-9][0-9]*$ ]]; then
              echo 'owns_result=false' >>"${GITHUB_OUTPUT}"
              return 0
            fi
            [[ "${published_check_id}" =~ ^[1-9][0-9]*$ ]] || return 1
            echo 'owns_result=true' >>"${GITHUB_OUTPUT}"
          }
          published_check_id="$(publish_once \
            'Current revision review' \
            "mlx90-current-revision:${external_kind}:v6:${PR_NUMBER}:${GITHUB_RUN_ID}:${EVENT_BASE}:${EVENT_HEAD}" \
            "${result_title}")" || exit $?
          record_publication_ownership "${published_check_id}" || exit $?
          if [[ "${published_check_id}" =~ ^reused:[1-9][0-9]*$ ]]; then
            echo 'Exact review evidence already has a protected producer; ownership retained.'
            exit 0
          fi

  request-protected-verifier-reevaluation:
    name: Request protected verifier re-evaluation
    needs: verify-current-revision-policy
    if: >-
      always() &&
      needs['verify-current-revision-policy'].result == 'success' &&
      needs['verify-current-revision-policy'].outputs.producer_owner == 'true' &&
      needs['verify-current-revision-policy'].outputs.owns_result == 'true' &&
      needs['verify-current-revision-policy'].outputs.trusted_kind != 'renovate'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - *materialize-producer-owner-guard

      - name: Dispatch the protected re-evaluation helper from the exact base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OWNER_RUN_ID: >-
            ${{ needs.verify-current-revision-policy.outputs.producer_run_id }}
          PRODUCER_OWNER_MODE: >-
            ${{ needs.verify-current-revision-policy.outputs.producer_owner_mode }}
        run: |
          set -euo pipefail
          EVENT_BASE="${EXPECTED_BASE}"
          LIVE_BASE="${EXPECTED_BASE}"
          EVENT_HEAD="${EXPECTED_HEAD}"
          EVENT_HEAD_REF="${EXPECTED_HEAD_REF}"
          export EVENT_BASE LIVE_BASE EVENT_HEAD EVENT_HEAD_REF
          owner_guard="${RUNNER_TEMP}/current-revision-producer-owner.sh"
          # shellcheck source=/dev/null
          source "${owner_guard}"
          [[ "${BASE_REF}" =~ ^(develop|main)$ ]]
          [[ "${PRODUCER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PRODUCER_RUN_ATTEMPT}" =~ ^(1|2)$ ]]
          [[ "${OWNER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${GITHUB_REF}" = "refs/heads/${BASE_REF}"
          test "${GITHUB_REF_PROTECTED}" = true
          live_owner="$(eo)" || exit 1
          test "${live_owner}" = "${OWNER_RUN_ID}"
          test "${live_owner}" = "${PRODUCER_RUN_ID}"
          test "${live_owner}" = "${GITHUB_RUN_ID}"
          gh api --method POST \
            "repos/${REPOSITORY}/actions/workflows/current-revision-rerun.yml/dispatches" \
            -f "ref=${BASE_REF}" \
            -f "inputs[base_ref]=${BASE_REF}" \
            -f "inputs[pr_number]=${PR_NUMBER}" \
            -f "inputs[expected_base]=${EXPECTED_BASE}" \
            -f "inputs[expected_head]=${EXPECTED_HEAD}" \
            -f "inputs[producer_run_id]=${PRODUCER_RUN_ID}" \
            -f "inputs[producer_run_attempt]=${PRODUCER_RUN_ATTEMPT}" >/dev/null
