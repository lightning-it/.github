# yamllint disable rule:truthy
---
name: OpenSSF Scorecard reusable

on:
  workflow_call:
    inputs:
      publish_results:
        description: Publish public OpenSSF Scorecard results for public repositories.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish_results }}

      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: error

  upload-sarif:
    name: Upload Scorecard SARIF
    runs-on: ubuntu-latest
    needs: scorecard
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download Scorecard SARIF artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scorecard-sarif

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard.sarif
