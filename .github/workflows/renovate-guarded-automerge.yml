# yamllint disable rule:truthy rule:line-length
---
name: Renovate guarded automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  enable-trusted-renovate-automerge:
    name: Enable auto-merge for trusted Renovate PR
    if: github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Verify exact-head Renovate identity and labels
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          trusted=false
          live_pr="{}"

          renovate_owns_head() {
            local author commits committer expected_head last_sha reason sha verified
            expected_head="$1"
            commits="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | [.sha, (.author.login // ""), (.committer.login // ""), (.commit.verification.verified | tostring), (.commit.verification.reason // "")] | @tsv'
            )" || return 1
            [ -n "${commits}" ] || return 1
            last_sha=""
            while IFS=$'\t' read -r sha author committer verified reason; do
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || return 1
              [ "${author}" = "renovate[bot]" ] || return 1
              [ "${committer}" = "web-flow" ] || return 1
              [ "${verified}" = "true" ] || return 1
              [ "${reason}" = "valid" ] || return 1
              last_sha="${sha}"
            done <<<"${commits}"
            [ "${last_sha}" = "${expected_head}" ]
          }

          if [ "${PR_AUTHOR}" = "renovate[bot]" ] \
            && [ "${PR_HEAD_REPO}" = "${REPO}" ] \
            && [[ "${PR_HEAD}" == renovate/* ]] \
            && [ "${PR_BASE}" = "develop" ] \
            && [ "${PR_DRAFT}" = "false" ] \
            && [ "${TRIGGER_ACTOR}" = "renovate[bot]" ] \
            && live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" \
              --arg head_sha "${PR_HEAD_SHA}" \
              --arg repo "${REPO}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("renovate") != null)
               and ([.labels[].name] | index("dependencies") != null)
               and ([.labels[].name] | index("safe-automerge") != null)
               and ([.labels[].name] | index("breaking-update") == null)' \
              <<<"${live_pr}" >/dev/null \
            && renovate_owns_head "${PR_HEAD_SHA}"; then
            label_events="$(
              gh api --paginate \
                "repos/${REPO}/issues/${PR_NUMBER}/events?per_page=100" \
                --jq '.[] | [.event, (.label.name // ""), (.actor.login // "")] | @tsv'
            )"
            safe_event="$(
              awk -F '\t' \
                '$2 == "safe-automerge" && ($1 == "labeled" || $1 == "unlabeled") { latest=$0 } END { print latest }' \
                <<<"${label_events}"
            )"
            expected_safe_event=$'labeled\tsafe-automerge\trenovate[bot]'
            breaking_event_pattern=$'labeled\tbreaking-update\t'
            if [ "${safe_event}" = "${expected_safe_event}" ] \
              && ! grep -Fq "${breaking_event_pattern}" <<<"${label_events}"; then
              trusted=true
            fi
          fi

          echo "trusted=${trusted}" >>"${GITHUB_OUTPUT}"

      - name: Revoke auto-merge when the trusted state is lost
        if: steps.guard.outputs.trusted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          renovate_owns_head() {
            local author commits committer expected_head last_sha reason sha verified
            expected_head="$1"
            commits="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | [.sha, (.author.login // ""), (.committer.login // ""), (.commit.verification.verified | tostring), (.commit.verification.reason // "")] | @tsv'
            )" || return 1
            [ -n "${commits}" ] || return 1
            last_sha=""
            while IFS=$'\t' read -r sha author committer verified reason; do
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || return 1
              [ "${author}" = "renovate[bot]" ] || return 1
              [ "${committer}" = "web-flow" ] || return 1
              [ "${verified}" = "true" ] || return 1
              [ "${reason}" = "valid" ] || return 1
              last_sha="${sha}"
            done <<<"${commits}"
            [ "${last_sha}" = "${expected_head}" ]
          }

          # Avoid revoking auto-merge on events that are "untrusted" even though the
          # PR is still currently safe (e.g., a maintainer edits the PR body).
          live_pr="{}"
          force_revoke=false
          if [ "${PR_ACTION}" = "synchronize" ] \
            && [ "${TRIGGER_ACTOR}" != "renovate[bot]" ]; then
            force_revoke=true
          fi

          if [ "${force_revoke}" != "true" ] \
            && live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")" \
            && jq -e \
              --arg repo "${REPO}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == "renovate[bot]")
               and (.base.ref == "develop")
               and (.head.ref | startswith("renovate/"))
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("renovate") != null)
               and ([.labels[].name] | index("dependencies") != null)
               and ([.labels[].name] | index("safe-automerge") != null)
               and ([.labels[].name] | index("breaking-update") == null)' \
              <<<"${live_pr}" >/dev/null \
            && renovate_owns_head "$(jq -r '.head.sha' <<<"${live_pr}")"; then
            label_events="$(
              gh api --paginate \
                "repos/${REPO}/issues/${PR_NUMBER}/events?per_page=100" \
                --jq '.[] | [.event, (.label.name // ""), (.actor.login // "")] | @tsv'
            )"
            safe_event="$(
              awk -F '\t' \
                '$2 == "safe-automerge" && ($1 == "labeled" || $1 == "unlabeled") { latest=$0 } END { print latest }' \
                <<<"${label_events}"
            )"
            expected_safe_event=$'labeled\tsafe-automerge\trenovate[bot]'
            breaking_event_pattern=$'labeled\tbreaking-update\t'
            if [ "${safe_event}" = "${expected_safe_event}" ] \
              && ! grep -Fq "${breaking_event_pattern}" <<<"${label_events}"; then
              echo "Current live PR state is safe; no revocation is needed."
              exit 0
            fi
          fi

          owner="${REPO%%/*}"
          name="${REPO#*/}"
          query_auto_merge() {
            gh api graphql \
              -f query="query(\$owner:String!,\$name:String!,\$number:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$number){autoMergeRequest{__typename}}}}" \
              -f owner="${owner}" \
              -f name="${name}" \
              -F number="${PR_NUMBER}" \
              --jq '.data.repository.pullRequest.autoMergeRequest != null'
          }
          auto_merge_enabled="$(query_auto_merge)"
          case "${auto_merge_enabled}" in
            true)
              if ! disable_error="$(
                gh pr merge "${PR_URL}" --disable-auto 2>&1
              )"; then
                auto_merge_enabled="$(query_auto_merge)"
                if [ "$auto_merge_enabled" != false ]; then
                  printf '%s\n' "$disable_error" >&2
                  exit 1
                fi
              fi
              ;;
            false) ;;
            *) echo "ERROR: unable to determine auto-merge state." >&2; exit 1 ;;
          esac

      - name: Enable auto-merge after live-state verification
        if: steps.guard.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          renovate_owns_head() {
            local author commits committer expected_head last_sha reason sha verified
            expected_head="$1"
            commits="$(
              gh api --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100" \
                --jq '.[] | [.sha, (.author.login // ""), (.committer.login // ""), (.commit.verification.verified | tostring), (.commit.verification.reason // "")] | @tsv'
            )" || return 1
            [ -n "${commits}" ] || return 1
            last_sha=""
            while IFS=$'\t' read -r sha author committer verified reason; do
              [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || return 1
              [ "${author}" = "renovate[bot]" ] || return 1
              [ "${committer}" = "web-flow" ] || return 1
              [ "${verified}" = "true" ] || return 1
              [ "${reason}" = "valid" ] || return 1
              last_sha="${sha}"
            done <<<"${commits}"
            [ "${last_sha}" = "${expected_head}" ]
          }

          assert_live_safe() {
            local label_events live_pr safe_event
            live_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")" || return 1
            jq -e \
              --arg author "${PR_AUTHOR}" \
              --arg base "${PR_BASE}" \
              --arg head "${PR_HEAD}" \
              --arg head_sha "${PR_HEAD_SHA}" \
              --arg repo "${REPO}" \
              '(.state == "open") and (.draft == false)
               and (.user.login == $author) and (.base.ref == $base)
               and (.head.ref == $head) and (.head.sha == $head_sha)
               and (.head.repo.full_name == $repo)
               and ([.labels[].name] | index("renovate") != null)
               and ([.labels[].name] | index("dependencies") != null)
               and ([.labels[].name] | index("safe-automerge") != null)
               and ([.labels[].name] | index("breaking-update") == null)' \
              <<<"${live_pr}" >/dev/null || return 1
            renovate_owns_head "${PR_HEAD_SHA}" || return 1
            label_events="$(
              gh api --paginate \
                "repos/${REPO}/issues/${PR_NUMBER}/events?per_page=100" \
                --jq '.[] | [.event, (.label.name // ""), (.actor.login // "")] | @tsv'
            )" || return 1
            safe_event="$(
              awk -F '\t' \
                '$2 == "safe-automerge" && ($1 == "labeled" || $1 == "unlabeled") { latest=$0 } END { print latest }' \
                <<<"${label_events}"
            )"
            expected_safe_event=$'labeled\tsafe-automerge\trenovate[bot]'
            breaking_event_pattern=$'labeled\tbreaking-update\t'
            [ "${safe_event}" = "${expected_safe_event}" ] \
              && ! grep -Fq "${breaking_event_pattern}" <<<"${label_events}"
          }

          disable_auto_merge() {
            local auto_merge_enabled disable_error name owner
            owner="${REPO%%/*}"
            name="${REPO#*/}"
            query_auto_merge() {
              gh api graphql \
                -f query="query(\$owner:String!,\$name:String!,\$number:Int!){repository(owner:\$owner,name:\$name){pullRequest(number:\$number){autoMergeRequest{__typename}}}}" \
                -f owner="${owner}" \
                -f name="${name}" \
                -F number="${PR_NUMBER}" \
                --jq '.data.repository.pullRequest.autoMergeRequest != null'
            }
            auto_merge_enabled="$(query_auto_merge)"
            case "${auto_merge_enabled}" in
              true)
                if ! disable_error="$(
                  gh pr merge "${PR_URL}" --disable-auto 2>&1
                )"; then
                  auto_merge_enabled="$(query_auto_merge)"
                  if [ "$auto_merge_enabled" != false ]; then
                    printf '%s\n' "$disable_error" >&2
                    return 1
                  fi
                fi
                ;;
              false) ;;
              *) echo "ERROR: unable to determine auto-merge state for ${PR_URL}." >&2; return 1 ;;
            esac
          }

          if ! assert_live_safe; then
            disable_auto_merge
            exit 1
          fi
          # The protected develop branch requires zero approving reviews. Its
          # governance policy deliberately prohibits Actions from submitting
          # reviews, so a synthetic self-approval would only make this path
          # fail. Auto-merge still waits for every required current-head check.
          gh pr merge "${PR_URL}" --auto --merge --delete-branch \
            --match-head-commit "${PR_HEAD_SHA}"
